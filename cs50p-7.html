<script>
/* ============ 题目数据 ============
   卡片两种：
     {t:'teach', kicker, h, body, code, out}           只讲，不问
     {t:'quiz',  kicker, code, out, q, opts:[...], exp} 选择题
   out  ：代码块下面接一条「屏幕上会出现什么」；写 '' 表示「什么都没有」
   opts ：每一项 {a:'选项文字', ok:true/false, why:'选错时单独讲这一项错在哪'}
   ★ 所有代码的输出和报错原文，都用本机 python3 3.14.6 实跑核对过，不是凭记忆写的
==================================== */
const CHAPTERS = [{
name:'第7讲 正则表达式',
cards:[
{t:'teach',kicker:'这一讲讲什么',h:'正则表达式：用模式匹配文字',
 body:`<p>正则表达式（regex）就是一种<b>模式</b>，用来检查、清理、提取文字。</p>
<p>老师用三个例子贯穿整讲：</p>
<ul>
<li><b>验证</b>：用户输入的是不是邮箱地址</li>
<li><b>清理</b>：把「Malan, David」改成「David Malan」</li>
<li><b>提取</b>：从 Twitter 网址里取出用户名</li>
</ul>
<p>模块是 <span class="ic">re</span>，最常用 <span class="ic">re.search</span>。</p>`},

{t:'teach',kicker:'第 1 步',h:'不用正则的笨办法有多累',
 code:`email = "malan@harvard.edu"
username, domain = email.split("@")
if username and domain.endswith(".edu"):
    print("Valid")
else:
    print("Invalid")`,
 out:'Valid',
 body:`<p>用 split、endswith、in 一点点检查也能做，但老师发现漏洞一个接一个：只输一个 @ 也算有效、malan@.edu 也算有效……</p>
<p>每堵一个洞就要多写几行。正则表达式能用<b>一行模式</b>把规则说清楚。</p>`},

{t:'teach',kicker:'第 2 步',h:'几个基本符号',
 body:`<ul>
<li><span class="ic">.</span> 任意一个字符（换行除外）</li>
<li><span class="ic">*</span> 前面的东西 0 次或多次</li>
<li><span class="ic">+</span> 前面的东西 1 次或多次</li>
<li><span class="ic">?</span> 前面的东西 0 次或 1 次，也就是「可选」</li>
<li><span class="ic">{m}</span> 正好 m 次；<span class="ic">{m,n}</span> m 到 n 次</li>
<li><span class="ic">^</span> 字符串开头；<span class="ic">$</span> 字符串结尾</li>
</ul>
<p>所以 <span class="ic">.+@.+</span> 就是「@ 左边至少一个字符，右边也至少一个」。</p>`},

{t:'quiz',kicker:'练一下',
 code:`import re
print(bool(re.search(r".*@.*", "@")))
print(bool(re.search(r".+@.+", "@")))`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`True` 然后 `False`',ok:true},
  {a:'`True` 然后 `True`',why:'`+` 要求<b>至少 1 个</b>字符。光一个 @，左右都是空的，第二个模式不匹配。'},
  {a:'`False` 然后 `False`',why:'`*` 允许 0 个字符，所以光一个 @ 也能匹配第一个模式。'},
  {a:'`False` 然后 `True`',why:'反了：* 更宽松，+ 更严格。'}],
 exp:'这正是老师从 `.*` 改成 `.+` 的原因：* 让「什么都没有」也能通过。'},

{t:'teach',kicker:'第 3 步',h:'点要转义，模式要用 r 字符串',
 code:`import re
print(bool(re.search(r".+@.+.edu", "malan@harvard?edu")))
print(bool(re.search(r".+@.+\\.edu", "malan@harvard?edu")))`,
 out:'True\nFalse',
 body:`<p>模式里的 <span class="ic">.</span> 是「任意字符」，所以 <span class="ic">.edu</span> 连 ?edu 都能匹配。想要<b>真的点</b>，写成 <span class="ic">\\.</span>，反斜杠表示转义。</p>
<p>模式前加 <span class="ic">r</span> 表示<b>原始字符串</b>，让 Python 别自己去解释反斜杠，原样交给 re。老师建议正则一律加 r。</p>`},

{t:'teach',kicker:'第 4 步',h:'^ 和 $：从头到尾都要匹配',
 code:`import re
s = "My email is malan@harvard.edu."
print(bool(re.search(r".+@.+\\.edu", s)))
print(bool(re.search(r"^.+@.+\\.edu$", s)))`,
 out:'True\nFalse',
 body:`<p>不加 ^ 和 $ 时，只要字符串<b>里面某处</b>能匹配就算通过，一整句英文也会被当成有效邮箱。</p>
<p>加上 <span class="ic">^</span>（开头）和 <span class="ic">$</span>（结尾），就要求<b>整个字符串</b>都符合模式。</p>`},

{t:'teach',kicker:'第 5 步',h:'字符集：方括号',
 body:`<ul>
<li><span class="ic">[abc]</span>：a、b、c 中任意一个</li>
<li><span class="ic">[a-z]</span>：范围，a 到 z 任意一个</li>
<li><span class="ic">[^@]</span>：方括号里开头的 ^ 表示<b>取反</b>，除了 @ 以外的任意字符</li>
</ul>
<p>常用简写：</p>
<ul>
<li><span class="ic">\\w</span> 单词字符，等于 <span class="ic">[a-zA-Z0-9_]</span></li>
<li><span class="ic">\\d</span> 数字；<span class="ic">\\s</span> 空白</li>
<li>大写 <span class="ic">\\W \\D \\S</span> 是反过来</li>
</ul>`},

{t:'quiz',kicker:'练一下',
 code:`import re
p = r"^\\w+@\\w+\\.edu$"
print(bool(re.search(p, "malan@@@harvard.edu")))
print(bool(re.search(p, "david_malan@harvard.edu")))`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`False` 然后 `True`',ok:true},
  {a:'`True` 然后 `True`',why:'`\\w` 只认字母、数字、下划线，<b>不包括 @</b>。多出来的 @ 匹配不上。'},
  {a:'`False` 然后 `False`',why:'下划线属于 `\\w`，所以 david_malan 是合法的。'},
  {a:'`True` 然后 `False`',why:'反了。'}],
 exp:'用 \\w 代替 . 后，用户名和域名里就不能再混进 @ 了。'},

{t:'teach',kicker:'第 6 步',h:'分组、或、可选：处理子域名',
 code:`import re
p = r"^\\w+@(\\w+\\.)?\\w+\\.edu$"
for e in ["malan@harvard.edu", "malan@cs50.harvard.edu"]:
    print(bool(re.search(p, e)))`,
 out:'True\nTrue',
 body:`<ul>
<li><span class="ic">( )</span> 把一段括成<b>一组</b></li>
<li>组后面加 <span class="ic">?</span>：整组可有可无，这里就是「cs50. 这样的子域名可以有也可以没有」</li>
<li><span class="ic">A|B</span>：A 或 B，比如 <span class="ic">(com|edu)</span></li>
</ul>
<p>第三个参数可以传标志：<span class="ic">re.IGNORECASE</span> 忽略大小写。</p>`},

{t:'teach',kicker:'第 7 步',h:'捕获：把匹配到的部分取出来',
 code:`import re
name = "Malan, David"
if matches := re.search(r"^(.+), *(.+)$", name):
    name = matches.group(2) + " " + matches.group(1)
print(name)`,
 out:'David Malan',
 body:`<p>括号除了分组，还会<b>捕获</b>匹配到的内容。<span class="ic">matches.group(1)</span> 是第一组括号，<span class="ic">group(2)</span> 是第二组。<b>从 1 开始数</b>。</p>
<p><span class="ic">, *</span> 允许逗号后面有任意个空格，用户多敲几个空格也不怕。</p>
<p><span class="ic">:=</span> 是<b>海象运算符</b>，在 if 里一边赋值一边判断，省掉一行。</p>`},

{t:'quiz',kicker:'这题是个坎',
 code:`import re
url = "https://www.twitter.com/davidjmalan"
m = re.search(r"^https?://(www\\.)?twitter\\.com/(.+)$", url)
print(m.group(1))`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`www.`',ok:true},
  {a:'`davidjmalan`',why:'第一组括号是 `(www\\.)`，所以 group(1) 是 www.。用户名在<b>第二组</b>，要写 group(2)。老师就踩过这个坑。'},
  {a:'`None`',why:'网址里有 www.，这一组匹配到了内容。没有 www. 时它才是 None。'},
  {a:'`https`',why:'https 没被括号括起来，不会被捕获。'}],
 exp:'只想分组不想捕获，可以写 `(?:www\\.)`，这样用户名就回到 group(1)。'},

{t:'teach',kicker:'第 8 步',h:'re.sub：替换',
 code:`import re
url = "https://twitter.com/davidjmalan"
print(re.sub(r"^(https?://)?(www\\.)?twitter\\.com/", "", url))`,
 out:'davidjmalan',
 body:`<p><span class="ic">re.sub(模式, 换成什么, 字符串)</span>：查找替换。把网址前缀换成空字符串，剩下的就是用户名。</p>
<p>不过 sub 不会告诉你「到底匹配上没有」：用户输了个 google.com，它会原样还给你。所以老师最后又改回用 re.search 加 if 判断。</p>
<p>别的函数：<span class="ic">re.match</span>（默认从开头匹配）、<span class="ic">re.fullmatch</span>（整串匹配）、<span class="ic">re.split</span>、<span class="ic">re.findall</span>。</p>`},

{t:'teach',kicker:'动手',h:'去 Termux 试试',
 body:`<ul>
<li>把邮箱模式里的 <span class="ic">\\.</span> 改回 <span class="ic">.</span>，试 malan@harvard?edu</li>
<li>去掉 ^ 和 $，试一整句话</li>
<li>老师的忠告：<b>一小步一小步加</b>，每加一个符号就测一次，别一口气写个超长正则</li>
</ul>`}
]}];

/* ============ 渲染 ============ */
const KW=/^(if|else|elif|for|while|def|return|import|from|in|not|and|or|is|True|False|None|class|try|except|finally|with|as|pass|break|continue|lambda|global|yield|raise|assert|match|case)$/;
const BI=/^(print|input|len|int|str|float|bool|list|dict|range|type|open|sum|min|max|abs|round)$/;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(code){
  let out='',i=0;
  while(i<code.length){
    const c=code[i];
    if(c==='"'||c==="'"){let j=i+1;while(j<code.length&&code[j]!==c)j++;
      out+='<span class="s">'+esc(code.slice(i,Math.min(j+1,code.length)))+'</span>';i=j+1;continue;}
    if(c==='#'){let j=code.indexOf('\n',i);if(j<0)j=code.length;
      out+='<span class="cm">'+esc(code.slice(i,j))+'</span>';i=j;continue;}
    if(/[0-9]/.test(c)&&!/[A-Za-z0-9_]/.test(code[i-1]||' ')){
      let j=i;while(j<code.length&&/[0-9.]/.test(code[j]))j++;
      out+='<span class="n">'+esc(code.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_]/.test(c)){
      let j=i;while(j<code.length&&/[A-Za-z0-9_]/.test(code[j]))j++;
      const w=code.slice(i,j);
      out+=KW.test(w)?'<span class="k">'+esc(w)+'</span>'
          :BI.test(w)?'<span class="b">'+esc(w)+'</span>':esc(w);i=j;continue;}
    out+=esc(c);i++;
  }
  return out;
}
function rich(s){return (s||'').replace(/`([^`]+)`/g,(m,c)=>'<span class="ic">'+esc(c)+'</span>');}
function codeBlock(c,out){
  let h='<pre>'+hl(c)+'</pre>';
  if(out!==undefined)h+='<div class="out"><span class="lb">屏幕上出现</span>'+
    (out===''?'<span class="v none">（什么都没有）</span>':'<span class="v">'+esc(out)+'</span>')+'</div>';
  return h;
}

const LTR=['A','B','C','D','E'];
const KEY='cs50p_review_7';
let cards=CHAPTERS[0].cards.slice();
let idx=0, answered=false, wrongIdx=[], rightCnt=0, quizTotal=0, redo=false;
cards.forEach(c=>{if(c.t==='quiz')quizTotal++;});

const stage=document.getElementById('stage');
const dock=document.getElementById('dock');

function save(){try{localStorage.setItem(KEY,JSON.stringify({idx,wrongIdx,rightCnt}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d&&d.idx>0&&d.idx<cards.length){idx=d.idx;wrongIdx=d.wrongIdx||[];rightCnt=d.rightCnt||0;}}catch(e){}}

function render(){
  const c=cards[idx];
  if(!c){renderFin();return;}
  answered=false;
  document.getElementById('prog').textContent=(idx+1)+' / '+cards.length;
  document.getElementById('barFill').style.width=(idx/cards.length*100)+'%';
  document.getElementById('chTitle').textContent=redo?'重做错题 · 第7讲':'CS50P · '+CHAPTERS[0].name;

  let h='<div class="card">';
  if(c.kicker)h+='<div class="kicker">'+esc(c.kicker)+'</div>';
  if(c.h)h+='<h2>'+esc(c.h)+'</h2>';
  if(c.code)h+=codeBlock(c.code,c.out);
  if(c.t==='teach'){
    h+='<div class="body">'+c.body+'</div>';
  }else{
    h+='<div class="q">'+esc(c.q)+'</div><div class="opts" id="opts">';
    c.opts.forEach((o,i)=>{
      h+='<button class="opt" data-i="'+i+'"><span class="ltr">'+LTR[i]+'</span>'+
         '<span class="txt">'+rich(o.a)+'</span></button>';
    });
    h+='</div><div id="expSlot"></div>';
  }
  h+='</div>';
  stage.innerHTML=h;
  window.scrollTo(0,0);

  if(c.t==='quiz'){
    document.getElementById('opts').querySelectorAll('.opt')
      .forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)));
    dock.innerHTML='<button class="btn" id="next" disabled>先选一个</button>';
  }else{
    dock.innerHTML='<button class="btn" id="next">'+(idx===cards.length-1?'看结果':'懂了，继续')+'</button>';
    document.getElementById('next').onclick=nextCard;
  }
  save();
}

function pick(i){
  if(answered)return;
  answered=true;
  const c=cards[idx], right=c.opts.findIndex(o=>o.ok), good=(i===right);
  const btns=document.getElementById('opts').querySelectorAll('.opt');
  btns.forEach((b,k)=>{
    b.disabled=true;
    if(k===right)b.classList.add('ok');
    else if(k===i)b.classList.add('no');
    else b.classList.add('fade');
  });
  if(good){rightCnt++;}
  else if(!wrongIdx.includes(idx)&&!redo){wrongIdx.push(idx);}

  let e='<div class="exp '+(good?'g':'r')+'">';
  e+='<div class="hd">'+(good?'✓ 对了':'✗ 选的是 '+LTR[i])+'</div>';
  if(!good&&c.opts[i].why)e+='<p>'+rich(c.opts[i].why)+'</p><div class="more">'+rich(c.exp)+'</div>';
  else e+=rich(c.exp);
  e+='</div>';
  document.getElementById('expSlot').innerHTML=e;

  const n=document.getElementById('next');
  n.disabled=false;
  n.textContent=(idx===cards.length-1?'看结果':'下一题');
  n.onclick=nextCard;
  n.scrollIntoView({block:'nearest'});
}

function nextCard(){idx++;save();render();}

function renderFin(){
  document.getElementById('barFill').style.width='100%';
  document.getElementById('prog').textContent='完成';
  const w=wrongIdx.length;
  stage.innerHTML='<div class="card fin">'+
    '<div class="big">'+(w===0?'🎉':'📗')+'</div>'+
    '<h2>'+(w===0?'一题没错':'第7讲复习完了')+'</h2>'+
    '<div class="score"><em>'+rightCnt+'</em> / '+quizTotal+' 题答对</div>'+
    '<div class="body" style="text-align:left;margin-top:14px">'+
    (w>0?'<p>有 <b>'+w+'</b> 题答错。错的那几题正是没想通的地方，重做一遍比往下学新的更划算。</p>'
        :'<p>全对。挑一两段代码去 Termux 里敲 <b>python</b> 亲手跑一遍，改改参数看结果怎么变。</p>')+'<a class="golink" href="cs50p-8.html">第8讲 · 面向对象 →</a>'+
    '</div></div>';
  let d='';
  if(w>0)d+='<button class="btn" id="redo">重做那 '+w+' 题</button>';
  d+='<button class="btn '+(w>0?'ghost':'')+'" id="again">'+(w>0?'从头':'从头再来一遍')+'</button>';
  dock.innerHTML=d;
  if(w>0)document.getElementById('redo').onclick=()=>{
    const list=wrongIdx.slice();
    cards=list.map(i=>CHAPTERS[0].cards[i]);
    quizTotal=cards.length;rightCnt=0;wrongIdx=[];idx=0;redo=true;render();
  };
  document.getElementById('again').onclick=()=>{
    cards=CHAPTERS[0].cards.slice();
    quizTotal=0;cards.forEach(c=>{if(c.t==='quiz')quizTotal++;});
    rightCnt=0;wrongIdx=[];idx=0;redo=false;
    try{localStorage.removeItem(KEY);}catch(e){}
    render();
  };
  try{localStorage.removeItem(KEY);}catch(e){}
}

load();
render();
</script>
</body>
</html>
