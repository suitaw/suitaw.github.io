<script>
/* ============ 题目数据 ============
   卡片两种：
     {t:'teach', kicker, h, body, code, out}           只讲，不问
     {t:'quiz',  kicker, code, out, q, opts:[...], exp} 选择题
   out  ：代码块下面接一条「屏幕上会出现什么」；写 '' 表示「什么都没有」
   opts ：每一项 {a:'选项文字', ok:true/false, why:'选错时单独讲这一项错在哪'}
   ★ 所有代码的输出和报错原文，都用本机 python3 3.14.6 实跑核对过，不是凭记忆写的
==================================== */
const CHAPTERS = [{
name:'第1讲 条件语句',
cards:[
{t:'teach',kicker:'这一讲讲什么',h:'条件语句：让程序做判断',
 body:`<p>第 1 讲只围绕一件事：让代码<b>根据情况走不同的路</b>。</p>
<ul>
<li>比较符号：<span class="ic">&gt;</span> <span class="ic">&gt;=</span> <span class="ic">&lt;</span> <span class="ic">&lt;=</span> <span class="ic">==</span> <span class="ic">!=</span></li>
<li>关键字：<span class="ic">if</span>、<span class="ic">elif</span>、<span class="ic">else</span>、<span class="ic">or</span>、<span class="ic">and</span>、<span class="ic">match</span></li>
</ul>
<p>老师反复强调一件事：代码<b>对了</b>还不够，还要<b>设计得好</b>，也就是少问不必要的问题。</p>`},

{t:'teach',kicker:'第 1 步',h:'= 和 == 不是一回事',
 code:`x = 1
y = 2
if x == y:
    print("equal")
if x != y:
    print("not equal")`,
 out:'not equal',
 body:`<ul>
<li><span class="ic">=</span> 一个等号：<b>赋值</b>，把右边装进左边</li>
<li><span class="ic">==</span> 两个等号：<b>比较</b>，问「左右相等吗」，答案是 True 或 False</li>
<li><span class="ic">!=</span>：不等于</li>
</ul>
<p>if 那一行末尾要有<b>冒号</b>，下面要执行的代码要<b>缩进</b>。缩进就是 Python 判断「哪些代码归这个 if 管」的依据。</p>`},

{t:'quiz',kicker:'练一下',
 code:`x = 5
if x > 3:
    print("big")
print("done")`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`big` 然后 `done`',ok:true},
  {a:'只有 `big`',why:'`print("done")` 没缩进，不归 if 管，<b>不管条件真假都会执行</b>。'},
  {a:'只有 `done`',why:'5 > 3 是真，所以缩进的 `print("big")` 也会执行。'},
  {a:'报错',why:'这段代码语法完全正确：if 后有冒号，下一行缩进了。'}],
 exp:'缩进决定归属：缩进的那行只在条件为真时执行；没缩进的那行总会执行。'},

{t:'teach',kicker:'第 2 步',h:'if 连写 vs elif：少问没必要的问题',
 code:`x = 1
y = 2
if x < y:
    print("x is less than y")
elif x > y:
    print("x is greater than y")
else:
    print("x is equal to y")`,
 out:'x is less than y',
 body:`<p>老师一开始写的是三个独立的 <span class="ic">if</span>，结果是<b>不管前面答案是什么，三个问题都要问一遍</b>。</p>
<p>改成 <span class="ic">elif</span>（else if 的缩写）后，<b>一旦某个条件为真，后面的就不再问了</b>，各分支互斥。</p>
<p>最后的 <span class="ic">else</span> 是兜底：既不小于也不大于，那只能是等于，不用再问第三个问题。</p>`},

{t:'quiz',kicker:'这题是个坎',
 code:`score = 95
if score >= 90:
    print("A")
if score >= 80:
    print("B")`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`A` 然后 `B`',ok:true},
  {a:'只有 `A`',why:'这里是两个<b>独立的 if</b>，不是 elif。第一个打了 A 之后，第二个照样会问：95 >= 80 吗？是，于是也打 B。'},
  {a:'只有 `B`',why:'95 >= 90 为真，第一个 if 会打出 A。'},
  {a:'什么都不打',why:'两个条件都为真，两行都会执行。'}],
 exp:'这正是老师讲的 bug：评分程序全用 if，95 分的学生会同时拿到 A、B、C、D。把第二个改成 `elif` 就只打 A。'},

{t:'teach',kicker:'第 3 步',h:'or 和 and',
 code:`score = 85
if 80 <= score < 90:
    print("B")
if score < 0 or score > 100:
    print("invalid")`,
 out:'B',
 body:`<ul>
<li><span class="ic">or</span>：任意一边为真，整体就为真</li>
<li><span class="ic">and</span>：两边都为真，整体才为真</li>
</ul>
<p>Python 还允许<b>连着比</b>：<span class="ic">80 &lt;= score &lt; 90</span> 就是「score 在 80 到 90 之间（不含 90）」，跟数学课本上一样写。这在很多别的语言里做不到。</p>`},

{t:'quiz',kicker:'练一下',
 code:`x = 5
if x < 0 or x > 3:
    print("yes")
else:
    print("no")`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`yes`',ok:true},
  {a:'`no`',why:'or 只要<b>有一边为真</b>就行。5 > 3 为真，所以整体为真。'},
  {a:'`yes` 然后 `no`',why:'if 和 else 是二选一，只会走一边。'},
  {a:'报错',why:'or 连接两个比较完全合法。'}],
 exp:'`x < 0` 是假，`x > 3` 是真，假 or 真 = 真。'},

{t:'teach',kicker:'第 4 步',h:'% 取余数：判断奇偶',
 code:`x = 7
if x % 2 == 0:
    print("Even")
else:
    print("Odd")`,
 out:'Odd',
 body:`<p><span class="ic">%</span> 在这里不是百分号，是<b>取余数</b>：7 除以 2 商 3 余 1，所以 <span class="ic">7 % 2</span> 是 1。</p>
<p>能被 2 整除（余数是 0）就是偶数。</p>`},

{t:'quiz',kicker:'练一下',
 code:`print(10 % 3)`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`1`',ok:true},
  {a:'`3`',why:'3 是商（10 ÷ 3 = 3 余 1）。% 要的是<b>余数</b>。'},
  {a:'`3.33...`',why:'那是 `10 / 3` 的结果。% 只给余数。'},
  {a:'`0.1`',why:'% 在 Python 里不表示百分比，是取余运算。'}],
 exp:'10 = 3 × 3 + 1，余数是 1。'},

{t:'teach',kicker:'第 5 步',h:'返回 bool 的函数，越写越短',
 code:`def is_even(n):
    return n % 2 == 0

print(is_even(4))
print(is_even(7))`,
 out:'True\nFalse',
 body:`<p><b>bool</b> 是第四种数据类型，只有两个值：<span class="ic">True</span> 和 <span class="ic">False</span>（首字母大写）。</p>
<p>老师把 is_even 从四行 if/else 一路精简到一行：<span class="ic">n % 2 == 0</span> 本身就是个真或假的答案，<b>直接 return 它</b>就行，不用再包一层 if。</p>
<p>中间还有一版「Pythonic」写法：<span class="ic">return True if n % 2 == 0 else False</span>。</p>`},

{t:'quiz',kicker:'练一下',
 code:`def is_big(n):
    return n > 10

if is_big(3):
    print("big")
else:
    print("small")`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`small`',ok:true},
  {a:'`big`',why:'3 > 10 是假，is_big(3) 返回 False，于是走 else。'},
  {a:'`False`',why:'函数的返回值 False 被 if 拿去判断了，没有被打印。打印的是 else 分支里的 "small"。'},
  {a:'报错：if 后面不能放函数',why:'if 后面可以放任何能得出真假的东西，函数调用也行，只要它返回 True/False。'}],
 exp:'if 后面放函数调用很常见：函数返回 True 就走 if，返回 False 就走 else。'},

{t:'teach',kicker:'第 6 步',h:'match：一个值对多个情况',
 code:`name = "Hermione"
match name:
    case "Harry" | "Hermione" | "Ron":
        print("Gryffindor")
    case "Draco":
        print("Slytherin")
    case _:
        print("Who?")`,
 out:'Gryffindor',
 body:`<p><span class="ic">match</span> 类似别的语言里的 switch：拿一个值，依次跟各个 <span class="ic">case</span> 比。</p>
<ul>
<li><span class="ic">|</span> 表示「或」，一个 case 可以匹配好几个值</li>
<li><span class="ic">case _:</span> 是兜底，相当于 else</li>
<li>不需要写 break</li>
</ul>`},

{t:'quiz',kicker:'练一下',
 code:`name = "Padma"
match name:
    case "Harry":
        print("Gryffindor")
    case "Draco":
        print("Slytherin")`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'什么都不打',ok:true},
  {a:'`Gryffindor`',why:'Padma 不等于 Harry，第一个 case 不匹配。'},
  {a:'`Slytherin`',why:'Padma 也不等于 Draco。'},
  {a:'报错：没有匹配的情况',why:'没有任何 case 匹配时，match 只是什么都不做，不会报错。想要兜底得加 `case _:`。'}],
 exp:'没写 `case _:`，又没有一个 case 匹配，那就什么都不发生。老师演示时 Padma 就是这样被「无视」的。'},

{t:'teach',kicker:'动手',h:'去 Termux 试试',
 body:`<ul>
<li>把 <span class="ic">if x == 5:</span> 写成 <span class="ic">if x = 5:</span>，看 SyntaxError 怎么提示你</li>
<li>漏掉 if 末尾的冒号，看报错</li>
<li>if 下面那行不缩进，看 IndentationError</li>
</ul>`}
]}];

/* ============ 渲染 ============ */
const KW=/^(if|else|elif|for|while|def|return|import|from|in|not|and|or|is|True|False|None|class|try|except|finally|with|as|pass|break|continue|lambda|global|yield|raise|assert|match|case)$/;
const BI=/^(print|input|len|int|str|float|bool|list|dict|range|type|open|sum|min|max|abs|round)$/;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(code){
  let out='',i=0;
  while(i<code.length){
    const c=code[i];
    if(c==='"'||c==="'"){let j=i+1;while(j<code.length&&code[j]!==c)j++;
      out+='<span class="s">'+esc(code.slice(i,Math.min(j+1,code.length)))+'</span>';i=j+1;continue;}
    if(c==='#'){let j=code.indexOf('\n',i);if(j<0)j=code.length;
      out+='<span class="cm">'+esc(code.slice(i,j))+'</span>';i=j;continue;}
    if(/[0-9]/.test(c)&&!/[A-Za-z0-9_]/.test(code[i-1]||' ')){
      let j=i;while(j<code.length&&/[0-9.]/.test(code[j]))j++;
      out+='<span class="n">'+esc(code.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_]/.test(c)){
      let j=i;while(j<code.length&&/[A-Za-z0-9_]/.test(code[j]))j++;
      const w=code.slice(i,j);
      out+=KW.test(w)?'<span class="k">'+esc(w)+'</span>'
          :BI.test(w)?'<span class="b">'+esc(w)+'</span>':esc(w);i=j;continue;}
    out+=esc(c);i++;
  }
  return out;
}
function rich(s){return (s||'').replace(/`([^`]+)`/g,(m,c)=>'<span class="ic">'+esc(c)+'</span>');}
function codeBlock(c,out){
  let h='<pre>'+hl(c)+'</pre>';
  if(out!==undefined)h+='<div class="out"><span class="lb">屏幕上出现</span>'+
    (out===''?'<span class="v none">（什么都没有）</span>':'<span class="v">'+esc(out)+'</span>')+'</div>';
  return h;
}

const LTR=['A','B','C','D','E'];
const KEY='cs50p_review_1';
let cards=CHAPTERS[0].cards.slice();
let idx=0, answered=false, wrongIdx=[], rightCnt=0, quizTotal=0, redo=false;
cards.forEach(c=>{if(c.t==='quiz')quizTotal++;});

const stage=document.getElementById('stage');
const dock=document.getElementById('dock');

function save(){try{localStorage.setItem(KEY,JSON.stringify({idx,wrongIdx,rightCnt}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d&&d.idx>0&&d.idx<cards.length){idx=d.idx;wrongIdx=d.wrongIdx||[];rightCnt=d.rightCnt||0;}}catch(e){}}

function render(){
  const c=cards[idx];
  if(!c){renderFin();return;}
  answered=false;
  document.getElementById('prog').textContent=(idx+1)+' / '+cards.length;
  document.getElementById('barFill').style.width=(idx/cards.length*100)+'%';
  document.getElementById('chTitle').textContent=redo?'重做错题 · 第1讲':'CS50P · '+CHAPTERS[0].name;

  let h='<div class="card">';
  if(c.kicker)h+='<div class="kicker">'+esc(c.kicker)+'</div>';
  if(c.h)h+='<h2>'+esc(c.h)+'</h2>';
  if(c.code)h+=codeBlock(c.code,c.out);
  if(c.t==='teach'){
    h+='<div class="body">'+c.body+'</div>';
  }else{
    h+='<div class="q">'+esc(c.q)+'</div><div class="opts" id="opts">';
    c.opts.forEach((o,i)=>{
      h+='<button class="opt" data-i="'+i+'"><span class="ltr">'+LTR[i]+'</span>'+
         '<span class="txt">'+rich(o.a)+'</span></button>';
    });
    h+='</div><div id="expSlot"></div>';
  }
  h+='</div>';
  stage.innerHTML=h;
  window.scrollTo(0,0);

  if(c.t==='quiz'){
    document.getElementById('opts').querySelectorAll('.opt')
      .forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)));
    dock.innerHTML='<button class="btn" id="next" disabled>先选一个</button>';
  }else{
    dock.innerHTML='<button class="btn" id="next">'+(idx===cards.length-1?'看结果':'懂了，继续')+'</button>';
    document.getElementById('next').onclick=nextCard;
  }
  save();
}

function pick(i){
  if(answered)return;
  answered=true;
  const c=cards[idx], right=c.opts.findIndex(o=>o.ok), good=(i===right);
  const btns=document.getElementById('opts').querySelectorAll('.opt');
  btns.forEach((b,k)=>{
    b.disabled=true;
    if(k===right)b.classList.add('ok');
    else if(k===i)b.classList.add('no');
    else b.classList.add('fade');
  });
  if(good){rightCnt++;}
  else if(!wrongIdx.includes(idx)&&!redo){wrongIdx.push(idx);}

  let e='<div class="exp '+(good?'g':'r')+'">';
  e+='<div class="hd">'+(good?'✓ 对了':'✗ 选的是 '+LTR[i])+'</div>';
  if(!good&&c.opts[i].why)e+='<p>'+rich(c.opts[i].why)+'</p><div class="more">'+rich(c.exp)+'</div>';
  else e+=rich(c.exp);
  e+='</div>';
  document.getElementById('expSlot').innerHTML=e;

  const n=document.getElementById('next');
  n.disabled=false;
  n.textContent=(idx===cards.length-1?'看结果':'下一题');
  n.onclick=nextCard;
  n.scrollIntoView({block:'nearest'});
}

function nextCard(){idx++;save();render();}

function renderFin(){
  document.getElementById('barFill').style.width='100%';
  document.getElementById('prog').textContent='完成';
  const w=wrongIdx.length;
  stage.innerHTML='<div class="card fin">'+
    '<div class="big">'+(w===0?'🎉':'📗')+'</div>'+
    '<h2>'+(w===0?'一题没错':'第1讲复习完了')+'</h2>'+
    '<div class="score"><em>'+rightCnt+'</em> / '+quizTotal+' 题答对</div>'+
    '<div class="body" style="text-align:left;margin-top:14px">'+
    (w>0?'<p>有 <b>'+w+'</b> 题答错。错的那几题正是没想通的地方，重做一遍比往下学新的更划算。</p>'
        :'<p>全对。挑一两段代码去 Termux 里敲 <b>python</b> 亲手跑一遍，改改参数看结果怎么变。</p>')+'<a class="golink" href="cs50p-2.html">第2讲 · 循环 →</a>'+
    '</div></div>';
  let d='';
  if(w>0)d+='<button class="btn" id="redo">重做那 '+w+' 题</button>';
  d+='<button class="btn '+(w>0?'ghost':'')+'" id="again">'+(w>0?'从头':'从头再来一遍')+'</button>';
  dock.innerHTML=d;
  if(w>0)document.getElementById('redo').onclick=()=>{
    const list=wrongIdx.slice();
    cards=list.map(i=>CHAPTERS[0].cards[i]);
    quizTotal=cards.length;rightCnt=0;wrongIdx=[];idx=0;redo=true;render();
  };
  document.getElementById('again').onclick=()=>{
    cards=CHAPTERS[0].cards.slice();
    quizTotal=0;cards.forEach(c=>{if(c.t==='quiz')quizTotal++;});
    rightCnt=0;wrongIdx=[];idx=0;redo=false;
    try{localStorage.removeItem(KEY);}catch(e){}
    render();
  };
  try{localStorage.removeItem(KEY);}catch(e){}
}

load();
render();
</script>
</body>
</html>
