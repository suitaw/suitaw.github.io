<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理财入门 · 第三课 钱该放哪儿</title>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
  --accent:#e8a84c;--accent-dim:rgba(232,168,76,.12);
  --text:#e8e9f0;--dim:#8890a8;
  --ok:#4caf82;--no:#e85c5c;--blue:#82aaff;
  --c-rf:#4a5170;--c-tp:#5a7fb8;--c-cp:#4caf82;--c-ep:#e8a84c;
  --dock-h:74px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);min-height:100vh;
  font-family:system-ui,-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.7;padding-bottom:calc(var(--dock-h) + 24px);}
.wrap{max-width:560px;margin:0 auto;padding:0 14px;}

/* 顶栏和图整块吸顶。
   这一课最要紧的一句原则是「讲的那句话和屏幕上的东西必须是同一个东西」，
   而原来图在最上、讲解在中间，读到「看第二根柱子下面那根红条」时图早滚没了 ——
   等于又变回了看视频学不会的那个毛病。
   把顶栏和图包在同一个 sticky 里，就不用去算顶栏到底多高。 */
.stick{position:sticky;top:0;z-index:10;background:var(--bg);
  box-shadow:0 6px 14px -8px rgba(0,0,0,.9);}
.top{padding:12px 14px 8px;}
/* sticky 的经典坑：scrollIntoView 会把目标滚到视口最上边，正好被吸顶块盖住。
   --stick-h 由 JS 量了写进来（图的高度会随视口变）。 */
.lesson,.row,.stats,.howto{scroll-margin-top:calc(var(--stick-h,320px) + 12px);}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.top h1{font-size:16px;font-weight:600;}
.top .sub{font-size:12px;color:var(--dim);white-space:nowrap;}
.bar{height:3px;background:var(--surface2);border-radius:2px;margin-top:8px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .35s;}
.back{display:inline-flex;align-items:center;font-size:12.5px;color:var(--dim);
  text-decoration:none;min-height:44px;padding:0 2px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px 15px;margin-top:12px;}
.card h2{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:10px;}
.body{font-size:15px;}
.body p{margin:9px 0;}
.body p:first-child{margin-top:0;}
.body b{color:var(--accent);font-weight:600;}
.body em{color:var(--no);font-style:normal;font-weight:600;}
.body ul{margin:9px 0;padding-left:0;list-style:none;}
.body li{margin:7px 0;padding-left:15px;position:relative;}
.body li:before{content:"·";position:absolute;left:3px;color:var(--accent);font-weight:700;}

/* 清算顺序梯子 */
.ladder{margin:11px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ladder div{display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:13.5px;
  border-bottom:1px solid var(--border);color:#c9cee0;}
.ladder div:last-child{border-bottom:none;}
.ladder .n{flex:0 0 20px;height:20px;border-radius:50%;background:var(--surface2);
  color:var(--dim);font-size:11px;font-weight:700;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);}
.ladder .you{background:rgba(232,168,76,.1);color:var(--accent);font-weight:600;}
.ladder .you .n{background:var(--accent);color:#1a1206;}

.tbl{margin:11px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.tbl div{display:flex;font-size:13.5px;border-bottom:1px solid var(--border);}
.tbl div:last-child{border-bottom:none;}
.tbl span{flex:1;padding:7px 11px;font-family:var(--mono);}
.tbl span:first-child{flex:1.3;background:var(--surface2);color:#c9cee0;font-family:inherit;}
.tbl .hd span{background:var(--surface2);font-family:inherit;font-size:12px;color:var(--dim);}
.tbl .hot span:last-child{color:var(--no);font-weight:700;}

/* 图。吸顶之后高度是稀缺资源：canvas 从 300 压到 208，
   图例挤成一行，「怎么看图」挪到下面去了（那是头一回要读的东西，不用常驻） */
.chart-card{padding:6px 8px 8px;margin-top:0;border-radius:12px;}
canvas{display:block;width:100%;height:176px;}
/* 图例必须挤进一行：换行就多吃 22px，而吸顶区每一像素都是从讲解那儿抢来的。
   所以文字用短词（「不担风险」而不是「不担风险就有的」），完整说法在下面「怎么看图」里 */
.legend{display:flex;justify-content:space-between;gap:2px;padding:5px 2px 0;
  font-size:12px;color:var(--dim);}
.legend span{white-space:nowrap;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;
  vertical-align:-1px;}
.legend i.ln{width:11px;height:0;border-top:2px solid #fff;border-radius:0;vertical-align:4px;}
.howto{margin:12px 0 0;padding:11px 13px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface);font-size:12.5px;line-height:1.7;color:var(--dim);}
.howto b{color:#a8b0c8;}

/* 选资产那一排 */
.pick{display:flex;gap:5px;margin-top:7px;}
.pick button{flex:1;min-height:44px;padding:0 2px;border-radius:10px;background:var(--surface2);
  color:var(--dim);border:1px solid var(--border);font-family:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer;line-height:1.3;}
.pick button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;}
.st{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;}
.st .lb{font-size:12px;color:var(--dim);line-height:1.5;}
.st .v{font-size:19px;font-weight:700;font-family:var(--mono);margin-top:2px;}
.st.big{grid-column:1 / -1;background:var(--accent-dim);border-color:rgba(232,168,76,.35);}
.st.big .v{font-size:26px;color:var(--accent);}
.st.bad .v{color:var(--no);}
.st.good .v{color:var(--ok);}
.st.dd{grid-column:1 / -1;background:rgba(232,92,92,.09);border-color:rgba(232,92,92,.3);}
.st.dd .v{color:var(--no);}
.st.cmp{grid-column:1 / -1;background:rgba(130,170,255,.08);border-color:rgba(130,170,255,.3);}
.st.cmp .v{color:var(--blue);font-size:17px;}

.ctrl{margin-top:14px;}
.ctrl .hd{font-size:12px;color:var(--dim);letter-spacing:.06em;margin-bottom:2px;}
.ctrl .hd2{font-size:12px;color:var(--dim);letter-spacing:.06em;
  margin:14px 0 -2px;padding-top:12px;border-top:1px solid var(--border);}
.row{padding:9px 0 3px;}
.row .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.row .name{font-size:14px;}
.row .name i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:6px;}
.row .val{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);}
/* touch-action:pan-y —— 滑杆默认把垂直手势也吃掉，滚页面时手指落在它上面就误改了值 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;
  background:transparent;margin:0;cursor:pointer;touch-action:pan-y;}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:var(--surface2);border:1px solid var(--border);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:26px;height:26px;border-radius:50%;background:var(--accent);
  border:3px solid var(--surface);margin-top:-11px;}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface2);
  border:1px solid var(--border);}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;
  background:var(--accent);border:3px solid var(--surface);}

/* 讲解里提到的滑杆/按钮做成可点的：点一下滚过去并闪一下。
   「现在去拖 rf 那根滑杆」——不做成可点的话，他得自己往下翻三百像素去找哪根是 rf */
.body .jump{color:var(--accent);font-weight:600;border-bottom:1px dashed rgba(232,168,76,.5);
  cursor:pointer;padding:2px 0;}
@keyframes ma-flash{0%,100%{background:transparent;}30%{background:rgba(232,168,76,.22);}}
.flash{animation:ma-flash 1.1s ease-out;border-radius:9px;}

.lesson{border-left:3px solid var(--accent);}
.lesson .step{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.05em;}
.lesson h2{margin:6px 0 8px;}
.warn{margin-top:11px;padding:11px 12px;border-radius:10px;
  background:rgba(232,92,92,.1);border:1px solid rgba(232,92,92,.3);font-size:13.5px;color:#e2b5b5;}
.warn b{color:#ff9f9f;}
.aside{margin-top:11px;padding-top:10px;border-top:1px solid var(--border);
  font-size:13.5px;color:#a8b0c8;}
.aside b{color:var(--accent);}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:linear-gradient(to top,var(--bg) 66%,rgba(15,17,23,0));padding:12px 14px 16px;}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:9px;}
.btn{flex:1;min-height:48px;border:none;border-radius:11px;background:var(--accent);
  color:#1a1206;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn:disabled{opacity:.32;}
.btn.ghost{flex:0 0 auto;padding:0 16px;background:var(--surface2);color:var(--dim);
  border:1px solid var(--border);font-weight:500;font-size:14px;min-width:60px;}
</style>
</head>
<body>

<div class="stick">
  <div class="top wrap">
    <div class="top-row">
      <h1>第三课 · 钱该放哪儿</h1>
      <div class="sub" id="prog">1 / 8</div>
    </div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
  </div>
  <div class="wrap">
    <div class="card chart-card">
      <canvas id="cv"></canvas>
      <div class="legend">
        <span><i style="background:var(--c-rf)"></i>不担风险</span>
        <span><i style="background:var(--c-tp)"></i>借得久</span>
        <span><i style="background:var(--c-cp)"></i>借给企业</span>
        <span><i style="background:var(--c-ep)"></i>当老板</span>
        <span><i class="ln"></i>实际到手</span>
      </div>
      <div class="pick" id="pick"></div>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="card lesson" id="lessonCard">
    <div class="step" id="lStep"></div>
    <h2 id="lTitle"></h2>
    <div class="body" id="lBody"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="howto" id="howto"></div>

  <div class="card ctrl">
    <div class="hd">你的情况</div>
    <div id="rowsA"></div>
    <div class="hd2">市场现在肯给多少（这四段加起来就是柱子的高度）</div>
    <div id="rowsB"></div>
  </div>

  <div class="card" style="font-size:13px;color:var(--dim);line-height:1.75">
    上面那四段溢价的默认值<b style="color:#a8b0c8">是量级，不是精确统计</b> ——
    它们随时间、国家、品种变化很大，我没有拿任何历史数据做承诺。
    这一课要你记住的是<b style="color:#a8b0c8">这个结构</b>：
    回报是一段一段叠上去的，每一段都对应你多担了一样具体的事。
    <br><br>波动幅度（每档下面那根红条）也是同一个口径的量级参照。
    <b style="color:#a8b0c8">终值是随机模拟出来的，不是预测</b>，
    换套参数就会变，你可以自己拖着看。
  </div>

  <a class="back" href="learn-money-2.html">‹ 回第二课 · 风险到底是什么</a>
</div>

<div class="dock"><div class="dock-in">
  <button class="btn ghost" id="bPrev">‹ 上一步</button>
  <button class="btn" id="bNext">下一步</button>
</div></div>

<script src="money-nav.js"></script>
<script src="money-ui.js"></script>
<script src="money-agent.js"></script>
<script>
MoneyNav.init({no:3});

/* ================= 参数 ================= */
const P = [
  {k:'p0', name:'现在手上有',  unit:'元', g:'A',
   vals:[0,10000,50000,100000,200000,500000,1000000]},
  {k:'m',  name:'每月投进去',  unit:'元', g:'A',
   vals:[0,500,1000,2000,3000,5000,10000]},
  {k:'y',  name:'投多少年',    unit:'年', g:'A',
   vals:[1,3,5,10,15,20,25,30,35,40]},
  {k:'rf', name:'不担风险就有的', unit:'%', g:'B', c:'var(--c-rf)',
   vals:[0,0.5,1,1.5,2,2.5,3,4,5]},
  {k:'tp', name:'借得久，多给',  unit:'%', g:'B', c:'var(--c-tp)',
   vals:[0,0.5,1,1.5,2,2.5,3]},
  {k:'cp', name:'借给企业，多给', unit:'%', g:'B', c:'var(--c-cp)',
   vals:[0,0.5,1,1.5,2,2.5,3,4]},
  {k:'ep', name:'当老板，多给',   unit:'%', g:'B', c:'var(--c-ep)',
   vals:[0,1,2,3,4,5,6,8]}
];
const IDX={}; P.forEach(p=>IDX[p.k]=0);
function V(k){const p=P.find(x=>x.k===k);return p.vals[IDX[k]];}
function setV(k,val){const p=P.find(x=>x.k===k);let b=0,bd=Infinity;
  p.vals.forEach((v,i)=>{const d=Math.abs(v-val);if(d<bd){bd=d;b=i;}});IDX[k]=b;}

/* 五档资产。sig 是写死的 —— 波动是这类东西本身有多抖，
   不是市场肯给你多少，跟上面四根滑杆不是一回事。
   seg 表示这一档由哪几段溢价叠成（rf 人人都有，所以都从它起）。 */
const ASSETS=[
  {n:'活期 / 货币基金', s:'活期',  sig:0.005, seg:['rf'],
   what:'把钱借给银行。有存款保险兜底，几乎不担风险'},
  {n:'国债（长期限）',  s:'国债',  sig:0.04,  seg:['rf','tp'],
   what:'把钱借给国家，但要借很多年。你担的是「这些年利率会变」'},
  {n:'企业债 / 债券基金',s:'企业债',sig:0.07,  seg:['rf','tp','cp'],
   what:'把钱借给企业。多担一样：他可能还不上'},
  {n:'股票指数基金',    s:'指数',  sig:0.19,  seg:['rf','tp','cp','ep'],
   what:'不当债主，当老板之一，而且一次买几百家。赚了分你，赔了你先赔'},
  {n:'单独一只股票',    s:'个股',  sig:0.40,  seg:['rf','tp','cp','ep'],
   what:'同样是当老板，但只押一家。押中押不中，全看这一家'}
];
const SEGC={rf:'#4a5170',tp:'#5a7fb8',cp:'#4caf82',ep:'#e8a84c'};
let A=3;                                  // 当前选中哪一档

function muOf(i){return ASSETS[i].seg.reduce((s,k)=>s+V(k)/100,0);}
function sigOf(i){return ASSETS[i].sig;}
/* 实际到手的年化。和第二课同一条公式：几何 = (1+mu)*e^(-sig²/2) - 1，
   差出来的 sig²/2 就是波动拖累。 */
function geoOf(i){const mu=muOf(i),s=sigOf(i);return (1+mu)*Math.exp(-s*s/2)-1;}

/* ================= 模拟 =================
   和第二课逐字同一套：月对数收益 ~ N(m,s²)，12m = ln(1+mu) - sig²/2。
   用固定种子，所以刷新页面数字不会变 —— 讲解里才敢写精确数。
   随机性本身第二课已经讲透了，这一课要的是几档之间横着比。
============================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}
function mkGauss(seed){const r=mulberry32(seed);let sp=null;
  return function(){if(sp!==null){const v=sp;sp=null;return v;}
    let u=0,v=0;while(!u)u=r();while(!v)v=r();
    const R=Math.sqrt(-2*Math.log(u));sp=R*Math.sin(2*Math.PI*v);return R*Math.cos(2*Math.PI*v);};}
const K=1200;
function sim(i){
  const p0=V('p0'), m=V('m'), y=V('y'), mu=muOf(i), sig=sigOf(i);
  const months=y*12, mm=(Math.log(1+mu)-sig*sig/2)/12, s=sig/Math.sqrt(12);
  const g=mkGauss(20260813);
  const ends=[]; let mddSum=0,mddMax=0,dd30=0,dd50=0;
  for(let k=0;k<K;k++){
    let bal=p0,peak=p0,mdd=0;
    for(let t=0;t<months;t++){
      bal=bal*Math.exp(mm+s*g())+m;
      if(bal<0)bal=0;
      peak=Math.max(peak,bal);
      if(peak>0)mdd=Math.max(mdd,(peak-bal)/peak);
    }
    ends.push(bal); mddSum+=mdd; mddMax=Math.max(mddMax,mdd);
    if(mdd>=0.3)dd30++; if(mdd>=0.5)dd50++;
  }
  ends.sort((a,b)=>a-b);
  const q=p=>ends[Math.min(K-1,Math.floor(K*p))];
  return {med:q(0.5),p10:q(0.1),p90:q(0.9),
          mddAvg:mddSum/K,mddMax:mddMax,dd30:dd30/K,dd50:dd50/K};
}
let RES=null, RES3=null;                   // 选中档 / 指数档（拿来对照）

function fmt(n){
  n=Math.round(n);
  if(Math.abs(n)>=100000000)return (n/100000000).toFixed(2)+' 亿';
  if(Math.abs(n)>=10000)return (n/10000).toFixed(1)+' 万';
  return n.toLocaleString('zh-CN');
}

/* ================= 画图 ================= */
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
function draw(){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.clearRect(0,0,W,H);
  const font=getComputedStyle(document.body).fontFamily;

  const padL=40,padR=8,padT=12;
  const nameH=30, volH=42, barB=H-nameH-volH;    // 柱区底 / 波动条区 / 名字区
  const w=W-padL-padR, h=barB-padT;
  const slot=w/ASSETS.length;

  // 刻度要够细，不然 8.5% 的柱子配一个 15% 的顶，柱子只占一半高、白瞎了半张图
  let top=Math.max(...ASSETS.map((_,i)=>muOf(i)))*1.18;
  if(!(top>0))top=0.01;
  const raw=top/4, pw=Math.pow(10,Math.floor(Math.log10(raw))), rr=raw/pw;
  const stp=(rr<=1?1:rr<=1.5?1.5:rr<=2?2:rr<=2.5?2.5:rr<=3?3:rr<=4?4:rr<=5?5:rr<=7.5?7.5:10)*pw;
  top=Math.ceil(top/stp)*stp;
  const Y=v=>padT+h-(v/top)*h;

  // 横向网格 + 百分比刻度
  cx.font='11px '+font; cx.textAlign='right'; cx.textBaseline='middle';
  for(let v=0;v<=top+1e-9;v+=stp){
    const yy=Y(v);
    cx.strokeStyle='#262b43'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(padL,yy); cx.lineTo(W-padR,yy); cx.stroke();
    cx.fillStyle='#6b7391'; cx.fillText(+(v*100).toFixed(1)+'%',padL-6,yy);
  }

  ASSETS.forEach((a,i)=>{
    const cxx=padL+slot*(i+0.5), bw=Math.min(slot*0.56,46);
    const on=i===A;

    // 堆叠柱：一段一段往上叠，每段就是一项溢价
    let acc=0;
    a.seg.forEach(k=>{
      const v=V(k)/100;
      if(v<=0){return;}
      const y0=Y(acc), y1=Y(acc+v);
      cx.fillStyle=SEGC[k];
      cx.globalAlpha=on?1:.62;          // 没选中的也得看得出分了几段，这张图讲的就是分段
      cx.fillRect(cxx-bw/2,y1,bw,y0-y1);
      cx.globalAlpha=1;
      // 段与段之间描一条底色缝，不然相邻两段的颜色会糊在一起
      cx.strokeStyle='#14161f'; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(cxx-bw/2,y1); cx.lineTo(cxx+bw/2,y1); cx.stroke();
      acc+=v;
    });
    // 选中的描个边
    if(on&&acc>0){
      cx.strokeStyle='#fff'; cx.lineWidth=1.5; cx.lineJoin='round';
      cx.strokeRect(cxx-bw/2,Y(acc),bw,Y(0)-Y(acc));
    }
    // 实际到手：白横杠。它比柱顶矮多少，就是波动吃掉了多少
    const g=geoOf(i);
    if(g>0&&g<=top){
      const gy=Y(g);
      cx.strokeStyle=on?'#fff':'rgba(255,255,255,.45)';
      cx.lineWidth=on?2.5:1.5;
      cx.beginPath(); cx.moveTo(cxx-bw/2-4,gy); cx.lineTo(cxx+bw/2+4,gy); cx.stroke();
    }

    // 波动条：宽度 ∝ sig。柱子高＝能拿多少，条子宽＝有多抖
    const maxSig=Math.max(...ASSETS.map(x=>x.sig));
    const cw=(a.sig/maxSig)*(slot*0.82);
    const vy=barB+14;
    cx.fillStyle=on?'rgba(232,92,92,.85)':'rgba(232,92,92,.3)';
    cx.beginPath();
    const r=3, x0=cxx-cw/2, x1=cxx+cw/2;
    cx.moveTo(x0+r,vy); cx.lineTo(x1-r,vy);
    cx.quadraticCurveTo(x1,vy,x1,vy+r); cx.lineTo(x1,vy+6-r);
    cx.quadraticCurveTo(x1,vy+6,x1-r,vy+6); cx.lineTo(x0+r,vy+6);
    cx.quadraticCurveTo(x0,vy+6,x0,vy+6-r); cx.lineTo(x0,vy+r);
    cx.quadraticCurveTo(x0,vy,x0+r,vy);
    cx.fill();
    cx.font='10.5px '+font; cx.textAlign='center'; cx.textBaseline='top';
    cx.fillStyle=on?'#e2a0a0':'#6b7391';
    cx.fillText('抖 '+(a.sig*100).toFixed(1)+'%',cxx,vy+9);

    // 档位名
    cx.font=(on?'600 ':'')+'11.5px '+font;
    cx.fillStyle=on?'#e8a84c':'#6b7391';
    cx.fillText(a.s,cxx,H-nameH+5);
    cx.font='10px '+font; cx.fillStyle=on?'#a8b0c8':'#525a76';
    cx.fillText(+(muOf(i)*100).toFixed(1)+'%',cxx,H-nameH+20);
  });
}

/* ================= UI ================= */
function buildRows(){
  const html=g=>P.filter(p=>p.g===g).map(p=>
    '<div class="row"><div class="top2"><span class="name">'+
    (p.c?'<i style="background:'+p.c+'"></i>':'')+p.name+'</span>'+
    '<span class="val" id="v_'+p.k+'"></span></div>'+
    '<input type="range" id="r_'+p.k+'" min="0" max="'+(p.vals.length-1)+'" step="1"></div>'
  ).join('');
  document.getElementById('rowsA').innerHTML=html('A');
  document.getElementById('rowsB').innerHTML=html('B');
  P.forEach(p=>document.getElementById('r_'+p.k).addEventListener('input',e=>{
    IDX[p.k]=+e.target.value; quick(); later(); save();
  }));

  document.getElementById('pick').innerHTML=ASSETS.map((a,i)=>
    '<button data-a="'+i+'">'+a.s+'</button>').join('');
  document.querySelectorAll('#pick button').forEach(b=>b.onclick=()=>{
    A=+b.dataset.a; quick(); later(); save();
  });
}

/* 图和滑杆只吃解析公式，拖起来要跟手 —— 所以和模拟分开。
   模拟 1200 条路径要一百多毫秒，拖动时每帧跑一遍会卡，压到停手之后再算。 */
let timer=null;
function quick(){
  P.forEach(p=>{
    document.getElementById('r_'+p.k).value=IDX[p.k];
    const v=p.vals[IDX[p.k]];
    document.getElementById('v_'+p.k).textContent=
      p.unit==='元'?fmt(v)+' 元':(v+' '+p.unit);
  });
  document.querySelectorAll('#pick button').forEach(b=>
    b.classList.toggle('on',+b.dataset.a===A));
  draw();
  paintStats();
  document.getElementById('prog').textContent=(si+1)+'/'+STEPS.length;
  document.getElementById('howto').innerHTML=
    '<b>柱子高</b>＝市场承诺的平均年回报，一段颜色就是一样你多担的事；'+
    '<b>白横杠</b>＝扣掉波动后你实际到手的年化；'+
    '<b>下面的红条</b>越宽＝这一档越抖。点柱子下面那排按钮换档。';
}
function runSim(){RES=sim(A);RES3=A===3?RES:sim(3);paintStats();}
function later(now){
  clearTimeout(timer);
  if(now){runSim();return;}                 // 首屏别留空窗，直接算
  timer=setTimeout(runSim,170);
}
function paintStats(){
  const a=ASSETS[A], mu=muOf(A), g=geoOf(A), y=V('y');
  const put=V('p0')+V('m')*12*y;
  const s=document.getElementById('stats');
  s.innerHTML=
    '<div class="st big"><div class="lb">'+a.n+'：'+y+' 年后中位数（一半人比它多，一半比它少）</div>'+
      '<div class="v">'+(RES?fmt(RES.med):'…')+'</div></div>'+
    '<div class="st"><div class="lb">市场承诺的平均每年涨</div><div class="v">'+
      (+(mu*100).toFixed(2))+'%</div></div>'+
    '<div class="st '+(g<mu*0.7?'bad':'good')+'"><div class="lb">实际到手年化</div>'+
      '<div class="v">'+(g*100).toFixed(2)+'%</div></div>'+
    '<div class="st"><div class="lb">你自己投进去的</div><div class="v">'+fmt(put)+'</div></div>'+
    '<div class="st bad"><div class="lb">差的情况（10% 的人比这更差）</div><div class="v">'+
      (RES?fmt(RES.p10):'…')+'</div></div>'+
    '<div class="st dd"><div class="lb">路上从最高点跌掉过（平均 / 最惨的一次）</div><div class="v">'+
      (RES?Math.round(RES.mddAvg*100)+'% / '+Math.round(RES.mddMax*100)+'%':'…')+'</div></div>'+
    (A!==3&&RES3?
      '<div class="st cmp"><div class="lb">同期「股票指数」那一档的中位数，拿来对照</div>'+
      '<div class="v">'+fmt(RES3.med)+'</div></div>':'');
}
function setDock(){
  const prev=document.getElementById('bPrev'), nx=document.getElementById('bNext');
  prev.disabled=si===0;
  if(si===STEPS.length-1){
    nx.disabled=true; nx.textContent='第四课还没做';
    nx.onclick=null;
  }else{
    nx.disabled=false;
    nx.textContent=si===STEPS.length-2?'最后一步':'下一步';
    nx.onclick=()=>{si++;renderStep();};
  }
}
function paintLesson(){
  const s=STEPS[si];
  document.getElementById('lStep').textContent=s.step;
  document.getElementById('lTitle').textContent=s.h;
  document.getElementById('lBody').innerHTML=s.body;
  document.getElementById('barFill').style.width=((si+1)/STEPS.length*100)+'%';
  setDock();
  MoneyUI.bind(document.getElementById('lBody'));   // 「先猜一下」那种块要重新接上
}
function renderStep(scroll){
  const s=STEPS[si];
  Object.keys(s.set||{}).forEach(k=>setV(k,s.set[k]));
  if(typeof s.a==='number')A=s.a;
  paintLesson();
  quick(); later(); save();
  // block:'start' 才吃 scroll-margin-top（nearest 在元素已可见时干脆不滚）。
  // 初始化那次不滚：一进来就该从最上面开始看
  if(scroll!==false)
    document.getElementById('lessonCard').scrollIntoView({block:'start',behavior:'smooth'});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({si,IDX,A}));}catch(e){}}
function load(){try{
  const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d&&typeof d.si==='number'){
    si=Math.min(d.si,STEPS.length-1);
    if(d.IDX)Object.keys(d.IDX).forEach(k=>{if(k in IDX)IDX[k]=d.IDX[k];});
    if(typeof d.A==='number')A=Math.min(Math.max(d.A,0),ASSETS.length-1);
  }
}catch(e){}}

document.getElementById('bPrev').onclick=()=>{if(si>0){si--;renderStep();}};
/* 吸顶块有多高，得让 CSS 知道（scroll-margin-top 要用），而它随视口变 */
function syncStickH(){
  const h=document.querySelector('.stick').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--stick-h',Math.round(h)+'px');
}
window.addEventListener('resize',()=>{draw();syncStickH();});

/* 讲解里的 <b class="jump" data-j="rf"> 点了滚到那根滑杆并闪一下。
   data-j 取滑杆的 k，或 'pick'（档位那排）。图是吸顶的，不用跳。 */
function flash(node){
  if(!node)return;
  node.classList.remove('flash');
  void node.offsetWidth;                 // 强制重排，不然连点两次不会重放动画
  node.classList.add('flash');
  setTimeout(()=>node.classList.remove('flash'),1200);
}
document.getElementById('lBody').addEventListener('click',e=>{
  const j=e.target.closest('[data-j]');
  if(!j)return;
  const k=j.dataset.j;
  if(k==='pick'){ flash(document.getElementById('pick')); return; }   // 吸顶区，本来就看得见
  let target=null;
  if(k==='stats')target=document.getElementById('stats');
  else{
    const r=document.getElementById('r_'+k);
    target=r&&r.closest('.row');
  }
  if(!target)return;
  target.scrollIntoView({block:'start',behavior:'smooth'});
  setTimeout(()=>flash(target),280);
});

buildRows();
const fresh=!localStorage.getItem(KEY);
load();
if(fresh){renderStep(false);}
else{paintLesson();quick();}
later(true);        // 首屏直接算出来，别让他先看见一屏「…」
syncStickH();

/* ================= AI 助教 ================= */
MoneyAgent.init({
  lesson:'第三课 · 钱该放哪儿（回报拆解器）',
  lessonNo:3,
  outline:'这一课八步：'+STEPS.map((s,i)=>(i+1)+'.'+s.h).join('；'),
  getState(){
    const L=[
      '在第 '+(si+1)+'/'+STEPS.length+' 步：'+STEPS[si].h,
      '当前选中档位：'+ASSETS[A].n+'（'+ASSETS[A].what+'）',
      '滑杆：手上 '+V('p0')+' 元 / 每月 '+V('m')+' 元 / 投 '+V('y')+' 年',
      '四段溢价：不担风险 '+V('rf')+'% ＋ 借得久 '+V('tp')+'% ＋ 借给企业 '+V('cp')+
        '% ＋ 当老板 '+V('ep')+'%',
      '五档柱子（平均涨 / 波动 / 实际到手年化）：',
      ...ASSETS.map((a,i)=>'  '+a.s+'：'+(muOf(i)*100).toFixed(2)+'% / '+
        (a.sig*100).toFixed(1)+'% / '+(geoOf(i)*100).toFixed(2)+'%'),
      '自己投进去的本金合计 '+fmt(V('p0')+V('m')*12*V('y'))
    ];
    if(RES)L.push('选中这档模拟 '+K+' 条路径：中位数 '+fmt(RES.med)+
      '，差的情况(10%分位) '+fmt(RES.p10)+'，好的情况(90%分位) '+fmt(RES.p90)+
      '，平均最大回撤 '+Math.round(RES.mddAvg*100)+'%，最惨一条 '+
      Math.round(RES.mddMax*100)+'%，跌超三成的比例 '+Math.round(RES.dd30*100)+
      '%，腰斩过的比例 '+Math.round(RES.dd50*100)+'%');
    if(RES3&&A!==3)L.push('对照：股票指数那一档中位数 '+fmt(RES3.med));
    return L.join('\n');
  },
  tools:[
    {name:'pickAsset',desc:'切换选中哪一档资产，图和下面的数字都会跟着变',
     args:'i 是 0~4：0活期/货基 1国债 2企业债 3股票指数 4单只股票',
     run(a){
       const i=Math.round(Number(a.i));
       if(!(i>=0&&i<ASSETS.length))return 'i 只能是 0~4';
       A=i; quick(); runSim(); save();
       return '已切到「'+ASSETS[A].n+'」：平均涨 '+(muOf(A)*100).toFixed(2)+
         '%，波动 '+(sigOf(A)*100).toFixed(1)+'%，实际到手 '+(geoOf(A)*100).toFixed(2)+
         '%，'+V('y')+' 年后中位数 '+fmt(RES.med);
     }},
    {name:'setParam',desc:'把某根滑杆设成某个值，五根柱子会跟着重算',
     args:'k 取 p0(手上有,元) / m(每月投,元) / y(年数) / rf(不担风险就有的,%) / '+
          'tp(借得久多给,%) / cp(借给企业多给,%) / ep(当老板多给,%)；v 是数字',
     run(a){
       const p=P.find(x=>x.k===a.k);
       if(!p)return '没有这个参数「'+a.k+'」，只能是 p0/m/y/rf/tp/cp/ep';
       const v=Number(a.v);
       if(!isFinite(v))return '值不是数字：'+a.v;
       setV(a.k,v); quick(); runSim(); save();
       return p.name+' 现在是 '+V(a.k)+p.unit+'（固定档位，取了最接近的一档）；'+
         '当前档实际到手年化变成 '+(geoOf(A)*100).toFixed(2)+'%，中位数 '+fmt(RES.med);
     }},
    {name:'gotoStep',desc:'跳到这一课的第几步，会摆成那一步的预设',
     args:'n 是 1~'+STEPS.length,
     run(a){
       const n=Math.round(Number(a.n));
       if(!(n>=1&&n<=STEPS.length))return '只有 1~'+STEPS.length+' 步';
       si=n-1; renderStep();
       return '已跳到第 '+n+' 步：'+STEPS[si].h;
     }}
  ],
  suggestions:['这张图怎么看？','为什么股东排最后','单只股票为什么反而更少',
               '我这笔钱一年内要用，该放哪档']
});
