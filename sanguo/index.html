<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1e18">
<title>三国武将录</title>
<style>
:root{
  --ink:#2a1e18; --paper:#fffaf0; --paper2:#f3ead6; --line:#3a2a22; --red:#b8302a; --gold:#d9a520;
  --muted:#7a6a5a; --btn:#efe4cc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1a1410;color:var(--ink);overflow:hidden;
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#000;overflow:hidden}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hide{display:none!important}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
canvas.px{image-rendering:pixelated}

/* 对话框 */
.box{background:var(--paper);border:3px solid var(--line);border-radius:8px;box-shadow:0 0 0 2px var(--paper) inset,0 3px 0 rgba(0,0,0,.35)}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;min-height:84px;padding:10px 14px 14px;font-size:17px;line-height:1.55;z-index:5}
#dlgName{position:absolute;top:-15px;left:10px;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:2px 10px;border-radius:4px;border:2px solid var(--line)}
#dlgName:empty{display:none}
.more{position:absolute;right:10px;bottom:4px;font-size:12px;color:var(--red);animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
#choices{position:absolute;right:8px;bottom:100px;min-width:120px;padding:6px;z-index:6;display:flex;flex-direction:column}
#choices button{text-align:left;padding:9px 12px;font-size:16px;border-radius:5px}
#choices button:active,#choices button.sel{background:var(--paper2)}
#toast{position:absolute;top:10px;left:10px;padding:6px 12px;font-size:14px;font-weight:700;z-index:4;transition:opacity .5s}
#btnMenu{position:absolute;top:10px;right:10px;z-index:4;padding:6px 12px;font-size:14px;font-weight:700}

/* 操作区 */
#pad{height:188px;flex:none;background:linear-gradient(#3a2a22,#2a1e18);position:relative;border-top:3px solid #1a1410;touch-action:none}
#dpad{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:150px;height:150px}
#dpad button{position:absolute;width:52px;height:52px;background:#5a463a;border-radius:8px;box-shadow:0 4px 0 #1a1410;color:#e8d8c0;font-size:20px}
#dpad button:active,#dpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #1a1410;background:#6e584a}
#dpad .u{left:49px;top:0}#dpad .d{left:49px;bottom:0}#dpad .l{left:0;top:49px}#dpad .r{right:0;top:49px}
#dpad .c{left:49px;top:49px;width:52px;height:52px;position:absolute;background:#4a3a30;border-radius:4px}
.ab{position:absolute;width:66px;height:66px;border-radius:50%;font-size:22px;font-weight:800;color:#fff;box-shadow:0 5px 0 #1a1410}
.ab:active{transform:translateY(4px);box-shadow:0 1px 0 #1a1410}
#bA{right:22px;top:30px;background:var(--red)}
#bB{right:100px;top:84px;background:#6a5a4a}

/* 战斗 */
#battle{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:#000}
#bField{position:relative;flex:1;min-height:0;overflow:hidden;
  background:linear-gradient(#bfe3f5 0%,#e4f2ea 46%,#b9d98a 46.2%,#9cc873 100%)}
#bField.night{background:linear-gradient(#5a4a6a 0%,#a08aa0 46%,#8a9a6a 46.2%,#6a8a5a 100%)}
.plat{position:absolute;border-radius:50%;background:radial-gradient(#8ab85e,#76a64d 60%,#5e8e3c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
#pFoe{right:4%;top:calc(12% + 118px);width:170px;height:40px}
#pMe{left:0;bottom:6%;width:200px;height:46px}
#spFoe{position:absolute;right:calc(4% + 10px);top:12%}
#spMe{position:absolute;left:14px;bottom:calc(6% + 18px);transform:scaleX(-1)}
.card{position:absolute;padding:6px 10px 8px;width:58%;font-size:14px}
#cFoe{left:8px;top:10px}
#cMe{right:8px;bottom:calc(6% + 4px);width:56%}
.card .nm{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
.card .nm b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;color:#fff;font-size:12px;font-weight:800;font-style:normal;flex:none}
.stb{font-size:11px;padding:0 4px;border-radius:3px;color:#fff;background:#8a3a8a;font-weight:700}
.bar{height:8px;background:#5a4a3a;border-radius:4px;overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.bar>div{height:100%;background:#48c048;transition:width .45s,background .45s}
.hpt{font-size:12px;text-align:right;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.xp{height:4px;background:#ddd;margin-top:3px;border-radius:2px;overflow:hidden}
.xp>div{height:100%;background:#3a86c8;transition:width .5s}
#bBottom{flex:none;height:150px;position:relative;background:var(--ink);padding:8px}
#bMsg{position:absolute;inset:8px;padding:10px 14px;font-size:17px;line-height:1.55}
#bAct,#bMoves{position:absolute;inset:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bb{background:var(--paper);border:3px solid var(--line);border-radius:8px;font-size:17px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.bb:active{transform:translateY(2px);box-shadow:none}
.bb.red{background:#f6d8c8}
#bMoves .bb{font-size:15px;text-align:left;padding:4px 10px;border-left-width:10px;display:flex;flex-direction:column;justify-content:center}
#bMoves .bb small{font-size:11px;color:var(--muted);font-weight:600}
#bMoves .bb:disabled{opacity:.45}
#bMoves .back{position:absolute;right:0;top:-40px;padding:4px 12px;font-size:14px}

/* 菜单 / 面板 */
#menu{position:absolute;inset:0;z-index:30;background:rgba(20,14,10,.55);display:flex;flex-direction:column;justify-content:flex-end}
#panel{background:var(--paper);border-top:3px solid var(--line);max-height:92%;display:flex;flex-direction:column;border-radius:12px 12px 0 0}
#panel .hd{display:flex;align-items:center;padding:12px 14px;border-bottom:2px solid var(--paper2);font-weight:800;font-size:17px;gap:8px}
#panel .hd span{flex:1}
#panel .hd button{padding:4px 10px;background:var(--btn);border-radius:6px;font-size:14px;border:2px solid var(--line)}
#panel .bd{overflow-y:auto;padding:10px 12px 18px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;border:2px solid var(--paper2);margin-bottom:8px;background:#fff}
.row:active{background:var(--paper2)}
.row .info{flex:1;min-width:0}
.row .t{font-weight:800;display:flex;align-items:center;gap:6px}
.row .s{font-size:12px;color:var(--muted)}
.row.dead{opacity:.55}
.row.lead{border-color:var(--gold)}
.mbtn{display:block;width:100%;padding:14px;font-size:17px;font-weight:800;text-align:left;border-bottom:2px solid var(--paper2)}
.mbtn:active{background:var(--paper2)}
.mbtn small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:#fff;border:2px solid var(--paper2);border-radius:8px;padding:4px 2px;text-align:center;font-size:12px}
.cell canvas{display:block;margin:0 auto}
.stat{display:grid;grid-template-columns:3em 1fr 4.6em;gap:4px 8px;align-items:center;font-size:14px;margin:8px 0}
.stat i{height:7px;border-radius:4px;background:var(--paper2);display:block;overflow:hidden}
.stat i b{display:block;height:100%;background:var(--red)}
.mv{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:#fff;border:2px solid var(--paper2);margin-bottom:6px;font-size:14px}
.mv b{flex:1}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{flex:1;padding:11px;border-radius:8px;background:var(--btn);border:2px solid var(--line);font-weight:800;font-size:15px}

/* 标题 / 选将 */
#title{position:absolute;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 30%,#5a2a1e,#1a0e0a 75%);color:#f4e6c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#title h1{font-size:44px;margin:0;letter-spacing:6px;color:#ffd878;text-shadow:3px 3px 0 #7a1a10,0 0 18px rgba(255,180,80,.35)}
#title p{margin:0;color:#c9b08a;font-size:14px}
#title .trio{display:flex;gap:4px;margin:10px 0}
#title .tb{width:220px;padding:14px;font-size:18px;font-weight:800;border-radius:10px;background:#f4e6c8;color:var(--ink);border:3px solid #ffd878;box-shadow:0 4px 0 #7a1a10}
#title .tb:disabled{opacity:.4}
#title .tb.sub{background:transparent;color:#f4e6c8;border-color:#7a5a3a;box-shadow:none;font-size:15px;padding:10px}
.starter{display:flex;gap:8px;width:100%;max-width:440px}
.starter button{flex:1;background:#f4e6c8;color:var(--ink);border-radius:10px;border:3px solid #7a5a3a;padding:8px 4px;font-weight:800}
.starter button.sel{border-color:#ffd878;box-shadow:0 0 0 3px #ffd878}
.starter small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .25s}
#fade.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="world"></canvas>
    <div id="toast" class="box" style="opacity:0"></div>
    <button id="btnMenu" class="box">菜单</button>
    <div id="dlg" class="box hide"><div id="dlgName"></div><div id="dlgText"></div><div class="more">▼</div></div>
    <div id="choices" class="box hide"></div>
  </div>
  <div id="pad">
    <div id="dpad">
      <button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button>
      <div class="c"></div>
      <button class="r" data-d="right">▶</button><button class="d" data-d="down">▼</button>
    </div>
    <button class="ab" id="bB">B</button>
    <button class="ab" id="bA">A</button>
  </div>

  <div id="battle" class="hide">
    <div id="bField">
      <div class="card box" id="cFoe"><div class="nm"><i class="el"></i><b></b><span class="stb hide"></span><span class="lv"></span></div><div class="bar"><div></div></div></div>
      <div class="plat" id="pFoe"></div><canvas id="spFoe" class="px"></canvas>
      <div class="plat" id="pMe"></div><canvas id="spMe" class="px"></canvas>
      <div class="card box" id="cMe"><div class="nm"><i class="el"></i><b></b><span class="stb hide"></span><span class="lv"></span></div><div class="bar"><div></div></div><div class="hpt"></div><div class="xp"><div></div></div></div>
    </div>
    <div id="bBottom">
      <div id="bMsg" class="box"><span id="bText"></span><div class="more hide">▼</div></div>
      <div id="bAct" class="hide">
        <button class="bb red" data-a="fight">出 招</button><button class="bb" data-a="bag">背 包</button>
        <button class="bb" data-a="switch">换 将</button><button class="bb" data-a="run">撤 退</button>
      </div>
      <div id="bMoves" class="hide"></div>
    </div>
  </div>

  <div id="menu" class="hide"><div id="panel"><div class="hd"><span id="pTitle"></span><button id="pClose">关闭</button></div><div class="bd" id="pBody"></div></div></div>

  <div id="title">
    <h1>三国武将录</h1>
    <p>收服天下名将 · 五行相克 · 讨伐董卓</p>
    <div class="trio" id="trio"></div>
    <button class="tb" id="tNew">新的征程</button>
    <button class="tb" id="tLoad">继续征程</button>
    <p style="margin-top:8px;font-size:12px;color:#8a7050">方向键移动 · A 确认/交谈 · B 取消</p>
  </div>
  <div id="fade"></div>
</div>

<script src="data.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const rnd = Math.random;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TS = 16;
const SAVE_KEY = 'sanguo-save-v1';
const STAT_NAMES = ['兵力', '武力', '统率', '智力', '速度'];
const ST_NAME = { burn: '灼', poison: '毒', stun: '定' };

// ================= 像素画工具 =================
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(h, a) {
  const f = v => Math.max(0, Math.min(255, Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a)));
  return '#' + hexRGB(h).map(v => f(v).toString(16).padStart(2, '0')).join('');
}
function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function outline(c, col = '#1c1418') {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), p = d.data, o = new Uint8ClampedArray(p);
  const [r, gg, b] = hexRGB(col);
  const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && p[(y * w + x) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (p[i + 3]) continue;
    if (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1)) { o[i] = r; o[i + 1] = gg; o[i + 2] = b; o[i + 3] = 255; }
  }
  d.data.set(o); g.putImageData(d, 0, 0); return c;
}
// 画笔：R 矩形、E 椭圆（可带裁剪函数）、Ln 线段；off 是整体偏移（给描边留边）
function pen(g, off = 0) {
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x) + off, Math.round(y) + off, w, h); };
  const E = (cx, cy, rx, ry, col, clip) => {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1 && (!clip || clip(x, y))) {
        if (col) { g.fillStyle = col; g.fillRect(x + off, y + off, 1, 1); } else g.clearRect(x + off, y + off, 1, 1);
      }
    }
  };
  const Ln = (x0, y0, x1, y1, col, w = 2) => {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
    for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, w, w, col);
  };
  return { R, E, Ln };
}
// 按设备像素整数倍放大，保证像素边缘锐利
function crisp(src, cssW, into) {
  const dpr = window.devicePixelRatio || 1;
  const k = Math.max(1, Math.round(cssW * dpr / src.width));
  const c = into || mk(1, 1);
  c.width = src.width * k; c.height = src.height * k;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0, c.width, c.height);
  c.style.width = c.width / dpr + 'px'; c.style.height = c.height / dpr + 'px';
  c.classList.add('px');
  return c;
}
function lookOf(l) { return typeof l === 'string' ? GENS[l].look : l; }

// ---------- 武将立绘 48×48 ----------
const portraitCache = {};
function portrait(L, key) {
  if (key && portraitCache[key]) return portraitCache[key];
  const c = mk(50, 50), g = c.getContext('2d'), { R, E, Ln } = pen(g, 1);
  const skin = L.face || L.skin || '#f1c49a', sd = shade(skin, -.15), sdd = shade(skin, -.3);
  const ar = L.armor, ad = shade(ar, -.28), al = shade(ar, .22), tr = L.trim || '#d8b24a', td = shade(tr, -.3);
  const t = L.hat, hc = L.hatC || H;
  const hair = (t === 'bun' || t === 'female') ? hc : H;
  const W = L.weapon, wc = L.wc || '#dfe4ea', wd = shade(wc, -.35), red = '#c8302a', gold = '#e3b341';
  const fat = L.fat ? 3 : 0, hy = 16, ey = hy + 1;

  // —— 身后的长兵器 ——
  const pole = ['glaive', 'spear', 'snake', 'halberd', 'axe', 'mace', 'staff'].includes(W);
  if (pole) {
    const sc = W === 'staff' ? '#9a6a36' : '#6b4526', top = W === 'glaive' ? 2 : 7;
    R(39, top, 2, 48 - top, sc); R(39, top, 1, 48 - top, shade(sc, .25));
    if (W === 'glaive') {
      for (let y = 0; y <= 18; y++) { const w = Math.round(Math.sin(y / 18 * Math.PI) * 6); if (w > 0) { R(41, y, w, 1, wc); R(40 + w, y, 1, 1, '#ffffff'); } }
      R(41, 1, 1, 17, wd); R(37, 16, 6, 3, '#2f7a3f'); R(38, 17, 4, 1, gold); R(37, 19, 2, 6, red); R(41, 19, 2, 5, red);
    } else if (W === 'spear') {
      R(39, 0, 2, 2, wc); R(38, 2, 4, 4, wc); R(39, 6, 2, 1, wd); R(38, 2, 1, 4, '#ffffff');
      E(39.5, 8.5, 3, 2, red); R(37, 9, 6, 3, red); R(38, 12, 4, 1, shade(red, -.2));
    } else if (W === 'snake') {
      for (let y = 0; y < 12; y++) { const x = 39 + Math.round(Math.sin(y * .9) * 1.5); R(x, y, 2, 1, wc); if (y % 3 === 0) R(x, y, 1, 1, '#ffffff'); }
      E(39.5, 13, 3, 2, red); R(37, 13, 6, 3, red);
    } else if (W === 'halberd') {
      R(39, 0, 2, 2, wc); R(38, 2, 4, 5, wc); R(38, 2, 1, 4, '#ffffff');
      for (let y = 5; y <= 13; y++) { const w = Math.round(Math.sin((y - 5) / 8 * Math.PI) * 5); if (w > 0) { R(38 - w, y, w, 1, wc); R(42, y, w, 1, wc); R(38 - w, y, 1, 1, '#ffffff'); } }
      R(37, 13, 6, 2, gold); R(37, 15, 2, 6, red); R(41, 15, 2, 5, red);
    } else if (W === 'axe') {
      R(39, 1, 2, 6, wc);
      E(34, 10, 5, 7, wc, x => x <= 38); E(34, 10, 5, 7, '#ffffff', x => x <= 30); R(37, 8, 2, 5, wd);
    } else if (W === 'mace') {
      E(40, 5, 5, 5, '#7a7f88'); E(38.5, 3.5, 1.5, 1.5, '#c8ccd4');
      for (const [x, y] of [[39, -1], [34, 4], [45, 4], [36, 0], [43, 0], [36, 9], [43, 9]]) R(x, y, 2, 2, '#5a5f68');
    } else if (W === 'staff') {
      E(40, 4, 4, 4, gold); E(40, 4, 2, 2, null); R(35, 6, 2, 2, gold); R(44, 6, 2, 2, gold); R(35, 8, 2, 2, '#fff3a0'); R(44, 8, 2, 2, '#fff3a0');
    }
  }
  if (W === 'bow') {
    for (let y = 2; y <= 44; y++) { const x = Math.round(43 - Math.sin((y - 2) / 42 * Math.PI) * 7); R(x, y, 2, 1, '#7a4a24'); }
    R(44, 2, 1, 43, '#e8e0d0'); R(33, 21, 12, 1, '#b08a5a'); R(32, 20, 2, 3, '#ffffff');
  }
  if (W === 'dual') {
    Ln(14, 30, 4, 4, wc); Ln(15, 30, 5, 4, wd, 1); R(12, 29, 6, 2, gold);
    Ln(33, 30, 43, 4, wc); Ln(33, 30, 43, 4, '#ffffff', 1); R(30, 29, 6, 2, gold);
  }
  if (L.female) R(13, 10, 22, 26, hair);

  // —— 身体 ——
  for (let y = 28; y < 48; y++) {
    const hw = Math.min(23, 12 + fat + Math.floor((y - 28) * .45));
    R(24 - hw, y, hw * 2, 1, ar); R(24 - hw, y, 2, 1, al); R(24 + hw - 2, y, 2, 1, ad);
  }
  if (L.robe) {

function draw(now) {
  const w = cv.width, h = cv.height, u = TS * SC;
  let px = S.x, py = S.y;
  if (moving) { const k = Math.min(1, (now - moving.t0) / STEP); px = moving.fx + (S.x - moving.fx) * k; py = moving.fy + (S.y - moving.fy) * k; }
  const mw = MAP.rows[0].length * u, mh = MAP.rows.length * u;
  let cx = px * u + u / 2 - w / 2, cy = py * u + u / 2 - h / 2;
  cx = mw <= w ? (mw - w) / 2 : Math.max(0, Math.min(mw - w, cx));
  cy = mh <= h ? (mh - h) / 2 : Math.max(0, Math.min(mh - h, cy));
  cx = Math.round(cx / SC) * SC; cy = Math.round(cy / SC) * SC;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#1a1410'; ctx.fillRect(0, 0, w, h);
  const img = mapImg[Math.floor(now / 600) % 2];
  ctx.drawImage(img, -cx, -cy, img.width * SC, img.height * SC);
  const list = npcs.filter(n => n.vis).map(n => ({ x: n.x, y: n.y, spr: human(lookOf(n.look), n.dir, 0, n.id) }));
  const pf = moving ? walkFrame : 0;
  list.push({ x: px, y: py, spr: human(PLAYER_LOOK, S.dir, pf, 'me'), me: 1 });
  list.sort((a, b) => a.y - b.y);
  for (const s of list) {
    const sx = Math.round((s.x * TS - 1) * SC - cx), sy = Math.round((s.y * TS - 4) * SC - cy);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(sx + 4 * SC, sy + 16 * SC, 10 * SC, 2 * SC);
    ctx.drawImage(s.spr, sx, sy, 18 * SC, 18 * SC);
    const tx = Math.round(s.x), ty = Math.round(s.y);
    if (tileAt(tx, ty) === ',' && Math.abs(s.x - tx) < .01 && Math.abs(s.y - ty) < .01)
      ctx.drawImage(img, tx * TS, ty * TS + 10, TS, 6, tx * u - cx, (ty * TS + 10) * SC - cy, u, 6 * SC);
  }
  if (emote) {
    const ex = Math.round((emote.x * TS + 4) * SC - cx), ey = Math.round((emote.y * TS - 16) * SC - cy);
    ctx.fillStyle = '#1c1418'; ctx.fillRect(ex - SC, ey - SC, 10 * SC, 12 * SC);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(ex, ey, 8 * SC, 10 * SC);
    ctx.fillStyle = '#d02030'; ctx.fillRect(ex + 3 * SC, ey + SC, 2 * SC, 5 * SC); ctx.fillRect(ex + 3 * SC, ey + 7 * SC, 2 * SC, 2 * SC);
  }
}

const STEP = 170;
function tryStep(dir) {
  S.dir = dir;
  const [dx, dy] = DIRS[dir], nx = S.x + dx, ny = S.y + dy;
  if (!walkable(nx, ny)) return;
  moving = { fx: S.x, fy: S.y, t0: performance.now() };
  S.x = nx; S.y = ny; walkFrame = walkFrame === 1 ? 2 : 1;
}
function tapStep(d) { if (!moving && !lock && MAP && !inBattle() && $('#menu').classList.contains('hide') && $('#title').classList.contains('hide') && !waiter) tryStep(d); }
function loop(now) {
  if (moving && now - moving.t0 >= STEP) { moving = null; onArrive(); }
  if (!moving && !lock && held && $('#title').classList.contains('hide')) tryStep(held);
  if (MAP && !inBattle()) draw(now);
  requestAnimationFrame(loop);
}
async function onArrive() {
  const ex = MAP.exits.find(e => e[0] === S.x && e[1] === S.y);
  if (ex) { await warp(ex[2], ex[3], ex[4]); return; }
  if (await checkSight()) return;
  if (tileAt(S.x, S.y) === ',' && rnd() < .13) await wildEncounter();
}

  const n = npcAt(fx, fy);
  if (n) { lock = true; await talkNpc(n); lock = false; return; }
  const t = tileAt(fx, fy), key = fx + ',' + fy;
  if (t === 'S' && MAP.signs && MAP.signs[key]) { lock = true; await talk([MAP.signs[key]]); lock = false; return; }
  if ('HPD'.includes(t) && t) {
    lock = true;
    const d = (MAP.doors || {})[key];
    if (d === 'heal') await healScene('医馆掌柜');

  n.dir = opp[S.dir];
  const d = n.def;
  if (d.trainer && !S.flags[d.id]) { await trainerBattle(n); return; }

  if (d.give && !S.flags[d.id]) {

}
function inSight(n) {
  const d = n.def;

  const [dx, dy] = DIRS[n.dir];
  for (let i = 1; i <= d.sight; i++) {
    const x = n.x + dx * i, y = n.y + dy * i;
    if (x === S.x && y === S.y) return i;
    const t = tileAt(x, y);
    if (t === undefined || SOLID.includes(t) || npcAt(x, y)) return false;

async function checkSight() {

    const [dx, dy] = DIRS[n.dir];
    for (let i = 1; i < dist; i++) { n.x += dx; n.y += dy; await sleep(STEP + 30); }
    const opp = { up: 'down', down: 'up', left: 'right', right: 'left' };
    S.dir = opp[n.dir];

    return true;

}

function aiPick() {
  const f = B.foe(), me = B.me();
  const opts = f.moves.map((v, i) => ({ v, i })).filter(o => o.v.pp > 0);
  if (!opts.length) return -1;
  if (B.wild || rnd() < .25) return opts[Math.floor(rnd() * opts.length)].i;
  let best = opts[0], bs = -1;
  for (const o of opts) {
    const M = MOVES[o.v.id];
    let s = M.c === 's' ? (M.fx.t === 'heal' ? (f.hp < maxHp(f) * .4 ? 150 : 0) : M.fx.t === 'st' ? (me.st ? 0 : 55) : 40) : M.p * elemMult(M.e, GENS[me.g].e) * (M.e === GENS[f.g].e ? 1.25 : 1);
    s *= .85 + rnd() * .3;
    if (s > bs) { bs = s; best = o; }
  }
  return best.i;
}
async function runTurn(act) {
  if (act.t === 'run') {
    if (!B.wild) { await say('将对将的阵前，岂能临阵脱逃！'); return null; }
    if (rnd() < .5 + eff('me', 's') / (eff('foe', 's') * 4)) { await say('成功撤退了！'); return 'run'; }
    await bsay('没能撤走！');
    return await foeOnly();
  }
  if (act.t === 'switch') {
    await bsay(`${gname(B.me())}，回来！`); await animFaint('me');
    B.mi = act.i; B.stg.me = {}; B.used.add(B.mi); renderSprite('me'); renderCard('me'); await animEnter('me');
    await bsay(`去吧，${gname(B.me())}！`);
    return await foeOnly();
  }
  if (act.t === 'item') {
    const r = await useItemBattle(act); if (r) return r;
    return await foeOnly();
  }
  const fm = aiPick();
  let meFirst = eff('me', 's') > eff('foe', 's') || (eff('me', 's') === eff('foe', 's') && rnd() < .5);
  const order = meFirst ? [['me', act.i], ['foe', fm]] : [['foe', fm], ['me', act.i]];
  for (const [side, i] of order) {
    await useMove(side, i);
    const r = await afterHit(); if (r !== undefined) return r;
  }
  return await endOfTurn();
}
async function foeOnly() {
  await useMove('foe', aiPick());
  const r = await afterHit(); if (r !== undefined) return r;
  return await endOfTurn();
}
// 有人倒下时的处理；返回 undefined 表示回合继续
async function afterHit() {
  if (B.foe().hp <= 0) return await foeFainted();
  if (B.me().hp <= 0) return await meFainted();
}
async function endOfTurn() {
  for (const side of ['me', 'foe']) {
    const m = side === 'me' ? B.me() : B.foe();
    if (m.hp > 0 && (m.st === 'burn' || m.st === 'poison')) {
      const d = Math.max(1, Math.floor(maxHp(m) / (m.st === 'burn' ? 12 : 8)));
      m.hp = Math.max(0, m.hp - d); renderCard(side);
      await bsay(`${side === 'foe' ? '敌方' : ''}${gname(m)} 受到${m.st === 'burn' ? '灼烧' : '毒'}伤害！`);
      const r = await afterHit(); if (r !== undefined) return r;
    }
  }
  return null;
}
async function useMove(side, i) {
  const u = side === 'me' ? B.me() : B.foe(), tSide = side === 'me' ? 'foe' : 'me', t = side === 'me' ? B.foe() : B.me();
  const pre = side === 'foe' ? '敌方' : '';
  if (u.hp <= 0) return;
  if (u.st === 'stun') {
    if (u.stc > 0) { u.stc--; await bsay(`${pre}${gname(u)} 被定身，动弹不得！`); return; }
    u.st = null; renderCard(side); await bsay(`${pre}${gname(u)} 挣脱了定身！`);
  }
  let M;
  if (i < 0) M = { n: '死战', e: '无', c: 'w', p: 50, a: 100 };
  else { const v = u.moves[i]; v.pp = Math.max(0, v.pp - 1); M = MOVES[v.id]; }
  await bsay(`${pre}${gname(u)} 使出了「${M.n}」！`);
  await animLunge(side);
  if (rnd() * 100 >= M.a) { await bsay('但是没有命中！'); return; }
  if (M.c === 's') { await applyFx(M.fx, side, u, tSide, t, true); return; }
  const L = u.lv, A = eff(side, M.c === 'w' ? 'w' : 'z') * (u.st === 'burn' && M.c === 'w' ? .75 : 1), Df = eff(tSide, M.c === 'w' ? 't' : 'z');
  const typ = elemMult(M.e, GENS[t.g].e), stab = M.e === GENS[u.g].e ? 1.25 : 1;
  const crit = rnd() < (M.crit ? .2 : 1 / 16) ? 1.5 : 1;
  const dmg = Math.max(1, Math.floor(((2 * L / 5 + 2) * M.p * A / Df / 50 + 2) * stab * typ * crit * (.85 + rnd() * .15)));
  t.hp = Math.max(0, t.hp - dmg);
  await animHit(tSide); renderCard(tSide); await sleep(250);
  if (crit > 1) await bsay('暴击！');
  if (typ > 1) await bsay(`效果拔群！（${M.e}克${GENS[t.g].e}）`);
  else if (typ < 1) await bsay(`收效甚微……（${GENS[t.g].e}克${M.e}）`);
  if (M.fx && t.hp > 0 && rnd() < (M.fx.ch ?? 1)) await applyFx(M.fx, side, u, tSide, t, false);
}
async function applyFx(fx, side, u, tSide, t, loud) {
  const tp = tSide === 'foe' ? '敌方' : '', up = side === 'foe' ? '敌方' : '';
  if (fx.t === 'stat') {
    const who = fx.who === 'self' ? side : tSide, m = fx.who === 'self' ? u : t, p = fx.who === 'self' ? up : tp;
    const cur = B.stg[who][fx.s] || 0, nv = Math.max(-6, Math.min(6, cur + fx.v));
    const nm = { w: '武力', t: '统率', z: '智力', s: '速度' }[fx.s];
    if (nv === cur) { if (loud) await bsay(`${p}${gname(m)} 的${nm}已经无法再${fx.v > 0 ? '提升' : '降低'}了！`); return; }
    B.stg[who][fx.s] = nv;
    await bsay(`${p}${gname(m)} 的${nm}${fx.v > 0 ? '提升' : '下降'}了${Math.abs(fx.v) > 1 ? '很多' : ''}！`);
  } else if (fx.t === 'st') {
    if (t.st) { if (loud) await bsay(`${tp}${gname(t)} 已经处于异常状态了。`); return; }
    t.st = fx.s; if (fx.s === 'stun') t.stc = 1 + Math.floor(rnd() * 2);
    renderCard(tSide);
    await bsay(`${tp}${gname(t)} ${{ burn: '陷入了灼烧！', poison: '中毒了！', stun: '被定身了！' }[fx.s]}`);
  } else if (fx.t === 'heal') {
    const mx = maxHp(u); if (u.hp >= mx) { await bsay('兵力已经是满的了。'); return; }
    u.hp = Math.min(mx, u.hp + Math.floor(mx * fx.v)); renderCard(side);
    await bsay(`${up}${gname(u)} 恢复了兵力！`);
  }
}
async function foeFainted() {
  const f = B.foe();
  await animFaint('foe');
  await bsay(`敌方 ${gname(f)} 溃败了！`);
  const gain = Math.floor(GENS[f.g].exp * f.lv / 5 * (B.wild ? 1 : 1.5));
  const me = B.me();
  await giveExp(me, gain, true);
  const rest = Math.floor(gain * .3);
  if (rest > 0) for (const m of S.party) if (m !== me && m.hp > 0) await giveExp(m, rest, false);
  if (rest > 0 && S.party.filter(m => m !== me && m.hp > 0).length) await bsay(`其余武将各获得了 ${rest} 点经验。`);
  if (B.fi < B.foes.length - 1) {
    B.fi++; B.stg.foe = {};
    await say(`${B.tr.name} 派出了 ${gname(B.foe())}！`);
    renderSprite('foe'); renderCard('foe'); await animEnter('foe');
    return null;
  }
  return 'win';
}
async function giveExp(m, gain, loud) {
  m.exp += gain;
  if (loud) { await bsay(`${gname(m)} 获得了 ${gain} 点经验！`); renderCard('me'); }
  while (m.lv < 60 && m.exp >= expAt(m.lv + 1)) {
    const old = maxHp(m); m.lv++; m.hp += maxHp(m) - old;
    if (m === B.me()) renderCard('me');
    await say(`${gname(m)} 升到了 Lv.${m.lv}！`);
    for (const [l, id] of GENS[m.g].learn) if (l === m.lv && !m.moves.some(v => v.id === id)) await learnMove(m, id);
  }
}
async function learnMove(m, id) {
  const M = MOVES[id];
  if (m.moves.length < 4) { m.moves.push({ id, pp: M.pp }); await say(`${gname(m)} 学会了「${M.n}」！`); return; }
  await say(`${gname(m)} 想学「${M.n}」（${M.e}${M.p ? '·' + M.p : ''}），但已经会四个招式了。`);
  const i = await choose([...m.moves.map(v => '忘掉「' + MOVES[v.id].n + '」'), '不学了'], false);
  if (i >= 0 && i < 4) { const old = MOVES[m.moves[i].id].n; m.moves[i] = { id, pp: M.pp }; await say(`忘掉了「${old}」，学会了「${M.n}」！`); }
  else await say(`${gname(m)} 没有学「${M.n}」。`);
}
async function meFainted() {
  const me = B.me(); me.st = null;
  await animFaint('me');
  await bsay(`${gname(me)} 溃败了！`);
  if (!S.party.some(m => m.hp > 0)) return 'lose';
  const i = await pickMon('派谁上阵？', m => m.hp > 0, false);
  B.mi = i; B.stg.me = {}; B.used.add(i);
  renderSprite('me'); renderCard('me'); await animEnter('me');
  await bsay(`去吧，${gname(B.me())}！`);
  return null;
}
async function useItemBattle(act) {
  const it = ITEMS[act.id];
  S.bag[act.id]--; if (!S.bag[act.id]) delete S.bag[act.id];
  if (it.ball) {
    const f = B.foe();
    await bsay(`掷出了「${it.n}」！`);
    const chance = Math.max(.03, Math.min(.95, GENS[f.g].rate * (it.ball === 2 ? 1.8 : 1) * (1.6 - 1.2 * f.hp / maxHp(f)) * (f.st ? 1.4 : 1) * 2.2));
    const c = spr('foe');
    for (let k = 0; k < 3; k++) {
      await anim(c, [{ transform: 'rotate(0)' }, { transform: 'rotate(-12deg)' }, { transform: 'rotate(12deg)' }, { transform: 'rotate(0)' }], 380);
      if (rnd() > Math.pow(chance, 1 / 3)) {
        await bsay(['可恶！对方不肯归降！', '差一点点！', '对方挣脱了！'][k]);
        return null;
      }
      await sleep(200);
    }
    await say(`收服了 ${gname(f)}！`);
    const first = !S.caught[f.g];
    f.st = f.st === 'stun' ? null : f.st;
    const where = addMon(f);
    if (first) await say(`${gname(f)} 已记入武将录。`);
    if (where === 'box') await say('队伍满了，已送往营帐。');
    return 'catch';
  }
  const m = S.party[act.target];
  itemEffect(it, m);
  if (m === B.me()) renderCard('me');
  await bsay(`对 ${gname(m)} 使用了「${it.n}」。`);
  return null;
}
function itemEffect(it, m) {
  if (it.heal) m.hp = Math.min(maxHp(m), m.hp + it.heal);
  if (it.cure) m.st = null;
  if (it.revive) m.hp = Math.floor(maxHp(m) / 2);
}
function itemUsable(it, m) {
  if (it.revive) return m.hp <= 0;
  if (m.hp <= 0) return false;
  if (it.heal) return m.hp < maxHp(m);
  if (it.cure) return !!m.st;
  return false;
}

  <p><b>五行相克</b>（招式五行 → 对方五行）：<br>${['金', '木', '水', '火', '土'].map(e => `${elBadge(e)} 克 ${elBadge(ELEM[e].beats)}`).join('　')}<br>克制伤害 ×2，被克 ×0.5；招式和武将同五行再 ×1.25。</p>
  <p><b>武 / 智</b>：武类招式看「武力对统率」，智类招式看「智力对智力」。</p>
  <p><b>回复</b>：挂绿牌的医馆、随军郎中都能免费回满。全军溃败会丢一半金子，回到最后休息的地方。</p>
  <p><b>主线</b>：涿郡 → 广宗（张角）→ 酸枣 → 汜水关（华雄）→ 虎牢关（吕布）→ 洛阳（董卓）。</p></div>`);
}
async function mainMenu() {
  if (lock || moving) return;
  lock = true;
  await new Promise(res => {
    const home = () => {
      openPanel(`${MAP.n}　💰${S.gold} 金`, [['party', '队伍', S.party.length + ' 人'], ['bag', '背包', ''], ['dex', '武将录', Object.keys(S.caught).length + ' 位'], ['box', '营帐', S.box.length + ' 位'], ['save', '存档', ''], ['help', '说明', '']]
        .map(([k, n, s]) => `<button class="mbtn" data-k="${k}">${n}<small>${s}</small></button>`).join(''));
      panelClose = res;
      $('#pBody').onclick = async e => {
        const b = e.target.closest('.mbtn'); if (!b) return;
        const k = b.dataset.k;
        const back = () => { panelClose = () => { home(); $('#menu').classList.remove('hide'); }; };
        if (k === 'party') { partyPanel(); back(); }
        else if (k === 'bag') { await bagPanel(false); home(); }
        else if (k === 'dex') { dexPanel(); back(); }
        else if (k === 'box') { boxPanel(); back(); }
        else if (k === 'save') { toast(save() ? '已存档' : '存档失败（浏览器禁止了存储）'); }
        else if (k === 'help') { helpPanel(); back(); }
      };
    };
    home();
  });
  lock = false;
}

// ================= 输入 =================
function pressA() {
  if (choiceCancel === null && !$('#choices').classList.contains('hide')) return;
  if (advance()) return;
  if (!$('#menu').classList.contains('hide') || inBattle() || !$('#title').classList.contains('hide')) return;
  interact();
}
function pressB() {
  if (!$('#choices').classList.contains('hide')) { if (choiceCancel) choiceCancel(); return; }
  if (advance()) return;
  if (!$('#menu').classList.contains('hide') && !$('#pClose').classList.contains('hide')) closePanel();
}
document.querySelectorAll('#dpad button').forEach(b => {
  const d = b.dataset.d;
  b.addEventListener('pointerdown', e => { e.preventDefault(); held = d; b.classList.add('on'); tapStep(d); try { b.setPointerCapture(e.pointerId); } catch (_) {} });
  const up = () => { if (held === d) held = null; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
$('#bA').addEventListener('pointerdown', e => { e.preventDefault(); pressA(); });
$('#bB').addEventListener('pointerdown', e => { e.preventDefault(); pressB(); });
$('#dlg').addEventListener('click', () => advance());
$('#bMsg').addEventListener('click', () => advance());
$('#btnMenu').addEventListener('click', () => { if (!waiter) mainMenu(); });
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
addEventListener('keydown', e => {
  if (KEYS[e.key]) { held = KEYS[e.key]; e.preventDefault(); if (!e.repeat) tapStep(held); }
  else if (e.key === 'z' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pressA(); }
  else if (e.key === 'x' || e.key === 'Escape') pressB();
  else if (e.key === 'm' && !inBattle() && !waiter) mainMenu();
});
addEventListener('keyup', e => { if (KEYS[e.key] === held) held = null; });
addEventListener('resize', resize);

// ================= 开场 =================
function titleScreen() {
  const trio = $('#trio'); trio.innerHTML = '';
  for (const g of ['guanyu', 'lvbu', 'zhaoyun']) trio.appendChild(crisp(genPortrait(g), 96));
  const has = !!loadSave();
  $('#tLoad').disabled = !has;
  $('#tNew').onclick = async () => {
    if (has) { $('#tNew').textContent = '再点一次：覆盖旧存档'; if (!$('#tNew').dataset.ok) { $('#tNew').dataset.ok = 1; return; } }
    await newGame();
  };
  $('#tLoad').onclick = () => { S = loadSave(); startWorld(); };
}
function startWorld() {
  $('#title').classList.add('hide'); resize(); loadMap(S.map);
}
async function newGame() {
  S = newState();
  const t = $('#title');
  t.innerHTML = `<h1 style="font-size:30px">择 将</h1><p>中平元年，黄巾蜂起。<br>你是涿郡刘备，字玄德。挑选第一位同伴吧。</p><div class="starter" id="st"></div><button class="tb" id="go" disabled>就是他了</button>`;
  const info = { guanyu: '火 · 武力高，招式凶猛<br>克金，怕水', zhangfei: '木 · 兵力最厚，一身蛮力<br>克土，怕金', zhaoyun: '水 · 速度最快，攻守平衡<br>克火，怕土' };
  let pick = null;
  for (const g of Object.keys(info)) {
    const b = document.createElement('button'); b.appendChild(crisp(genPortrait(g), 96));
    b.insertAdjacentHTML('beforeend', `<div style="font-size:17px">${GENS[g].n}</div><small>${info[g]}</small>`);
    b.onclick = () => { pick = g; t.querySelectorAll('.starter button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); $('#go').disabled = false; $('#go').textContent = `就是${GENS[g].n}了`; };
    $('#st').appendChild(b);
  }
  await new Promise(r => $('#go').onclick = () => pick && r());
  const m = makeMon(pick, 5); addMon(m);
  startWorld(); save();
  lock = true;
  await talk([`${GENS[pick].n} 加入了队伍！`, '乡老就在北边路口，先去和他聊聊吧（面朝他按 A）。', '右上角「菜单」可以查看队伍、背包和存档。']);
  lock = false;
}

titleScreen();
requestAnimationFrame(loop);
</script>
</body>
</html>
