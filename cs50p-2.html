<script>
/* ============ 题目数据 ============
   卡片两种：
     {t:'teach', kicker, h, body, code, out}           只讲，不问
     {t:'quiz',  kicker, code, out, q, opts:[...], exp} 选择题
   out  ：代码块下面接一条「屏幕上会出现什么」；写 '' 表示「什么都没有」
   opts ：每一项 {a:'选项文字', ok:true/false, why:'选错时单独讲这一项错在哪'}
   ★ 所有代码的输出和报错原文，都用本机 python3 3.14.6 实跑核对过，不是凭记忆写的
==================================== */
const CHAPTERS = [{
name:'第2讲 循环',
cards:[
{t:'teach',kicker:'这一讲讲什么',h:'循环：一遍又一遍做同一件事',
 body:`<p>老师从一只喵喵叫的猫开始：叫三声，复制三行 print 当然能行，可要叫 500 声呢？</p>
<p>这一讲的工具：</p>
<ul>
<li><span class="ic">while</span> 循环、<span class="ic">for</span> 循环、<span class="ic">range</span></li>
<li><span class="ic">break</span>、<span class="ic">continue</span></li>
<li>两种新的数据结构：<b>列表</b> list 和<b>字典</b> dict</li>
</ul>`},

{t:'teach',kicker:'第 1 步',h:'while：条件为真就一直转',
 code:`i = 0
while i < 3:
    print("meow")
    i += 1`,
 out:'meow\nmeow\nmeow',
 body:`<p>while 每转一圈前都问一次：条件还成立吗？成立就执行缩进的代码，再回去问。</p>
<p><span class="ic">i += 1</span> 是 <span class="ic">i = i + 1</span> 的简写。<b>千万别忘了它</b>，否则 i 永远是 0，条件永远为真，就成了<b>死循环</b>。卡住了按 <b>Ctrl+C</b> 中断。</p>
<p>老师的建议：从 0 开始数，用 <span class="ic">&lt;</span> 而不是 <span class="ic">&lt;=</span>。</p>`},

{t:'quiz',kicker:'练一下',
 code:`i = 1
while i <= 3:
    print(i)
    i += 1`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`1` `2` `3`（每个一行）',ok:true},
  {a:'`0` `1` `2`',why:'i 从 1 开始，不是从 0。'},
  {a:'`1` `2`',why:'条件是 `<=`，i 等于 3 时也成立，所以 3 也会打出来。'},
  {a:'一直打 1，停不下来',why:'循环里有 `i += 1`，每圈 i 都会加 1，到 4 时条件不成立就停了。'}],
 exp:'i = 1、2、3 时条件成立，各打一次；i 变成 4 时 `4 <= 3` 为假，循环结束。'},

{t:'teach',kicker:'第 2 步',h:'for 和 range：知道要几次就用它',
 code:`for _ in range(3):
    print("meow")`,
 out:'meow\nmeow\nmeow',
 body:`<p><span class="ic">range(3)</span> 给出 0、1、2 三个数，for 每次取一个。</p>
<p>变量没用到时，按 Python 惯例起名叫 <span class="ic">_</span>（下划线），告诉读代码的人「这个变量我不关心」。</p>
<p>比 while 短得多：不用自己初始化、不用自己加 1，也就不会忘。</p>`},

{t:'quiz',kicker:'练一下',
 code:`for i in range(3):
    print(i)`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`0` `1` `2`（每个一行）',ok:true},
  {a:'`1` `2` `3`',why:'range 默认<b>从 0 开始</b>。'},
  {a:'`0` `1` `2` `3`',why:'range(3) <b>不包含 3</b>，到 3 之前就停。'},
  {a:'`3`',why:'for 会把 range 里的每个数都走一遍，不是只取最后一个。'}],
 exp:'`range(n)` 给出 0 到 n-1，一共 n 个数。'},

{t:'teach',kicker:'第 3 步',h:'字符串乘法：一行搞定',
 code:`print("meow\\n" * 3, end="")`,
 out:'meow\nmeow\nmeow',
 body:`<p>字符串乘一个整数，就是把它<b>重复那么多遍</b>。<span class="ic">\\n</span> 是换行。</p>
<p>每个 meow 后面都带了换行，最后 print 自己还会再加一个，所以用 <span class="ic">end=""</span> 去掉多出来的那个空行。</p>
<p>老师说：很酷，但不一定更好读，看你和同事习不习惯。</p>`},

{t:'teach',kicker:'第 4 步',h:'while True + break：一直问到用户给对为止',
 code:`while True:
    n = int(input("What's n? "))
    if n > 0:
        break
print("got", n)`,
 inp:'-1\n0\n3',
 out:"What's n? -1\nWhat's n? 0\nWhat's n? 3\ngot 3",
 body:`<p>这是获取用户输入时<b>非常常见的套路</b>：</p>
<ul>
<li><span class="ic">while True</span> 故意制造一个无限循环</li>
<li>拿到满意的输入就 <span class="ic">break</span> 跳出最近的那个循环</li>
<li>不满意就继续转，再问一次</li>
</ul>
<p>写在函数里时，也可以直接 <span class="ic">return n</span>：return 既跳出循环又返回值。</p>`},

{t:'quiz',kicker:'这题是个坎',
 code:`for i in range(5):
    if i == 3:
        break
    print(i)`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`0` `1` `2`',ok:true},
  {a:'`0` `1` `2` `3`',why:'i 等于 3 时，<b>先判断</b>，break 立刻跳出循环，后面的 `print(i)` 来不及执行。'},
  {a:'`0` `1` `2` `4`',why:'那是 continue 的效果（跳过这一圈继续下一圈）。break 是整个循环都不干了。'},
  {a:'`0` `1` `2` `3` `4`',why:'break 会提前结束循环。'}],
 exp:'break：跳出整个循环。continue：只跳过这一圈，接着下一圈。'},

{t:'teach',kicker:'第 5 步',h:'列表：一个变量装多个值',
 code:`students = ["Hermione", "Harry", "Ron"]
print(students[0])
for student in students:
    print(student)`,
 out:'Hermione\nHermione\nHarry\nRon',
 body:`<ul>
<li>方括号建列表，元素用逗号隔开</li>
<li><span class="ic">students[0]</span> 取第一个：<b>索引从 0 开始</b></li>
<li>for 可以直接遍历列表，每次拿一个元素</li>
<li><span class="ic">len(students)</span> 是列表长度，这里是 3</li>
</ul>
<p>想要编号时可以写 <span class="ic">for i in range(len(students))</span>，再用 <span class="ic">students[i]</span> 取元素。</p>`},

{t:'quiz',kicker:'练一下',
 code:`names = ["A", "B", "C"]
print(names[1])
print(len(names))`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`B` 然后 `3`',ok:true},
  {a:'`A` 然后 `3`',why:'索引从 0 开始：[0] 是 A，[1] 才是 B。'},
  {a:'`B` 然后 `2`',why:'len 给的是元素个数，一共 3 个。最大索引才是 2。'},
  {a:'`A` 然后 `2`',why:'两处都差了一：索引从 0 数，长度从 1 数。'}],
 exp:'列表有 3 个元素时：长度是 3，索引是 0、1、2。'},

{t:'teach',kicker:'第 6 步',h:'字典：用名字查值',
 code:`students = {
    "Hermione": "Gryffindor",
    "Draco": "Slytherin",
}
print(students["Draco"])
for student in students:
    print(student, students[student], sep=", ")`,
 out:'Slytherin\nHermione, Gryffindor\nDraco, Slytherin',
 body:`<p>字典用<b>花括号</b>，存的是<b>键: 值</b>对。就像真的字典：查一个词（键），得到它的释义（值）。</p>
<ul>
<li>取值不用数字，用键：<span class="ic">students["Draco"]</span></li>
<li>for 遍历字典时，拿到的是<b>键</b></li>
</ul>`},

{t:'quiz',kicker:'练一下',
 code:`d = {"a": 1, "b": 2}
for k in d:
    print(k)`,
 q:'屏幕上会出现什么？',
 opts:[
  {a:'`a` `b`',ok:true},
  {a:'`1` `2`',why:'for 遍历字典时拿到的是<b>键</b>。想要值得写 `d[k]`。'},
  {a:'`a 1` `b 2`',why:'只打印了 k，也就是键。'},
  {a:'报错：字典不能遍历',why:'字典可以直接用 for 遍历，每次拿到一个键。'}],
 exp:'`for k in d` 拿到键；`d[k]` 再拿到对应的值。'},

{t:'teach',kicker:'第 7 步',h:'字典列表：每个学生一个字典',
 code:`students = [
    {"name": "Hermione", "house": "Gryffindor"},
    {"name": "Draco", "house": None},
]
for s in students:
    print(s["name"], s["house"])`,
 out:'Hermione Gryffindor\nDraco None',
 body:`<p>每个学生有好几样信息时，就把<b>每个学生做成一个字典</b>，再把这些字典放进一个列表。键统一叫 name、house。</p>
<p><span class="ic">None</span> 表示「没有值」，比空字符串更明确：是确实没有，而不是忘了填。</p>`},

{t:'teach',kicker:'第 8 步',h:'嵌套循环：画方块',
 code:`size = 3
for i in range(size):
    for j in range(size):
        print("#", end="")
    print()`,
 out:'###\n###\n###',
 body:`<p>外层循环管<b>行</b>，内层循环管每行里的<b>每块砖</b>。</p>
<p>内层每打一块都不换行（<span class="ic">end=""</span>），一行打完后，单独一个 <span class="ic">print()</span> 只输出一个换行，进入下一行。</p>
<p>老师的 mario.py 最后用抽象函数 <span class="ic">print_row</span> 简化掉了内层循环：<span class="ic">print("#" * width)</span>。</p>`},

{t:'teach',kicker:'动手',h:'去 Termux 试试',
 body:`<ul>
<li>写个 while 循环但不写 i += 1，体验一下死循环，再按 Ctrl+C</li>
<li>取 <span class="ic">["a","b"][2]</span>，看 IndexError</li>
<li>取字典里不存在的键，看 KeyError</li>
</ul>`}
]}];

/* ============ 渲染 ============ */
const KW=/^(if|else|elif|for|while|def|return|import|from|in|not|and|or|is|True|False|None|class|try|except|finally|with|as|pass|break|continue|lambda|global|yield|raise|assert|match|case)$/;
const BI=/^(print|input|len|int|str|float|bool|list|dict|range|type|open|sum|min|max|abs|round)$/;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(code){
  let out='',i=0;
  while(i<code.length){
    const c=code[i];
    if(c==='"'||c==="'"){let j=i+1;while(j<code.length&&code[j]!==c)j++;
      out+='<span class="s">'+esc(code.slice(i,Math.min(j+1,code.length)))+'</span>';i=j+1;continue;}
    if(c==='#'){let j=code.indexOf('\n',i);if(j<0)j=code.length;
      out+='<span class="cm">'+esc(code.slice(i,j))+'</span>';i=j;continue;}
    if(/[0-9]/.test(c)&&!/[A-Za-z0-9_]/.test(code[i-1]||' ')){
      let j=i;while(j<code.length&&/[0-9.]/.test(code[j]))j++;
      out+='<span class="n">'+esc(code.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_]/.test(c)){
      let j=i;while(j<code.length&&/[A-Za-z0-9_]/.test(code[j]))j++;
      const w=code.slice(i,j);
      out+=KW.test(w)?'<span class="k">'+esc(w)+'</span>'
          :BI.test(w)?'<span class="b">'+esc(w)+'</span>':esc(w);i=j;continue;}
    out+=esc(c);i++;
  }
  return out;
}
function rich(s){return (s||'').replace(/`([^`]+)`/g,(m,c)=>'<span class="ic">'+esc(c)+'</span>');}
function codeBlock(c,out){
  let h='<pre>'+hl(c)+'</pre>';
  if(out!==undefined)h+='<div class="out"><span class="lb">屏幕上出现</span>'+
    (out===''?'<span class="v none">（什么都没有）</span>':'<span class="v">'+esc(out)+'</span>')+'</div>';
  return h;
}

const LTR=['A','B','C','D','E'];
const KEY='cs50p_review_2';
let cards=CHAPTERS[0].cards.slice();
let idx=0, answered=false, wrongIdx=[], rightCnt=0, quizTotal=0, redo=false;
cards.forEach(c=>{if(c.t==='quiz')quizTotal++;});

const stage=document.getElementById('stage');
const dock=document.getElementById('dock');

function save(){try{localStorage.setItem(KEY,JSON.stringify({idx,wrongIdx,rightCnt}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(d&&d.idx>0&&d.idx<cards.length){idx=d.idx;wrongIdx=d.wrongIdx||[];rightCnt=d.rightCnt||0;}}catch(e){}}

function render(){
  const c=cards[idx];
  if(!c){renderFin();return;}
  answered=false;
  document.getElementById('prog').textContent=(idx+1)+' / '+cards.length;
  document.getElementById('barFill').style.width=(idx/cards.length*100)+'%';
  document.getElementById('chTitle').textContent=redo?'重做错题 · 第2讲':'CS50P · '+CHAPTERS[0].name;

  let h='<div class="card">';
  if(c.kicker)h+='<div class="kicker">'+esc(c.kicker)+'</div>';
  if(c.h)h+='<h2>'+esc(c.h)+'</h2>';
  if(c.code)h+=codeBlock(c.code,c.out);
  if(c.t==='teach'){
    h+='<div class="body">'+c.body+'</div>';
  }else{
    h+='<div class="q">'+esc(c.q)+'</div><div class="opts" id="opts">';
    c.opts.forEach((o,i)=>{
      h+='<button class="opt" data-i="'+i+'"><span class="ltr">'+LTR[i]+'</span>'+
         '<span class="txt">'+rich(o.a)+'</span></button>';
    });
    h+='</div><div id="expSlot"></div>';
  }
  h+='</div>';
  stage.innerHTML=h;
  window.scrollTo(0,0);

  if(c.t==='quiz'){
    document.getElementById('opts').querySelectorAll('.opt')
      .forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)));
    dock.innerHTML='<button class="btn" id="next" disabled>先选一个</button>';
  }else{
    dock.innerHTML='<button class="btn" id="next">'+(idx===cards.length-1?'看结果':'懂了，继续')+'</button>';
    document.getElementById('next').onclick=nextCard;
  }
  save();
}

function pick(i){
  if(answered)return;
  answered=true;
  const c=cards[idx], right=c.opts.findIndex(o=>o.ok), good=(i===right);
  const btns=document.getElementById('opts').querySelectorAll('.opt');
  btns.forEach((b,k)=>{
    b.disabled=true;
    if(k===right)b.classList.add('ok');
    else if(k===i)b.classList.add('no');
    else b.classList.add('fade');
  });
  if(good){rightCnt++;}
  else if(!wrongIdx.includes(idx)&&!redo){wrongIdx.push(idx);}

  let e='<div class="exp '+(good?'g':'r')+'">';
  e+='<div class="hd">'+(good?'✓ 对了':'✗ 选的是 '+LTR[i])+'</div>';
  if(!good&&c.opts[i].why)e+='<p>'+rich(c.opts[i].why)+'</p><div class="more">'+rich(c.exp)+'</div>';
  else e+=rich(c.exp);
  e+='</div>';
  document.getElementById('expSlot').innerHTML=e;

  const n=document.getElementById('next');
  n.disabled=false;
  n.textContent=(idx===cards.length-1?'看结果':'下一题');
  n.onclick=nextCard;
  n.scrollIntoView({block:'nearest'});
}

function nextCard(){idx++;save();render();}

function renderFin(){
  document.getElementById('barFill').style.width='100%';
  document.getElementById('prog').textContent='完成';
  const w=wrongIdx.length;
  stage.innerHTML='<div class="card fin">'+
    '<div class="big">'+(w===0?'🎉':'📗')+'</div>'+
    '<h2>'+(w===0?'一题没错':'第2讲复习完了')+'</h2>'+
    '<div class="score"><em>'+rightCnt+'</em> / '+quizTotal+' 题答对</div>'+
    '<div class="body" style="text-align:left;margin-top:14px">'+
    (w>0?'<p>有 <b>'+w+'</b> 题答错。错的那几题正是没想通的地方，重做一遍比往下学新的更划算。</p>'
        :'<p>全对。挑一两段代码去 Termux 里敲 <b>python</b> 亲手跑一遍，改改参数看结果怎么变。</p>')+'<a class="golink" href="cs50p-3.html">第3讲 · 异常 →</a>'+
    '</div></div>';
  let d='';
  if(w>0)d+='<button class="btn" id="redo">重做那 '+w+' 题</button>';
  d+='<button class="btn '+(w>0?'ghost':'')+'" id="again">'+(w>0?'从头':'从头再来一遍')+'</button>';
  dock.innerHTML=d;
  if(w>0)document.getElementById('redo').onclick=()=>{
    const list=wrongIdx.slice();
    cards=list.map(i=>CHAPTERS[0].cards[i]);
    quizTotal=cards.length;rightCnt=0;wrongIdx=[];idx=0;redo=true;render();
  };
  document.getElementById('again').onclick=()=>{
    cards=CHAPTERS[0].cards.slice();
    quizTotal=0;cards.forEach(c=>{if(c.t==='quiz')quizTotal++;});
    rightCnt=0;wrongIdx=[];idx=0;redo=false;
    try{localStorage.removeItem(KEY);}catch(e){}
    render();
  };
  try{localStorage.removeItem(KEY);}catch(e){}
}

load();
render();
</script>
</body>
</html>
