<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="怪兽冒险 —— 手机上就能玩的宝可梦风格回合制 RPG">
<title>怪兽冒险 Monster Quest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 标题画面 ============ -->
<div id="title" class="screen">
  <div class="tbg"></div>
  <div class="tcontent">
    <h1 class="logo"><span>怪兽</span>冒险</h1>
    <p class="sub">MONSTER QUEST · 手机版回合制冒险</p>
    <div id="titleMenu" class="tmenu">
      <button id="btnCont" class="tbtn primary">继续冒险</button>
      <button id="btnNew" class="tbtn">开始新游戏</button>
      <div class="thint">方向键 / 虚拟摇杆移动　·　A 键交谈　·　B 键菜单</div>
    </div>
    <div id="nameBox" class="namebox hidden">
      <label>给自己起个名字</label>
      <input id="nameInput" maxlength="6" placeholder="小智" autocomplete="off">
      <button id="nameGo" class="tbtn primary">确定</button>
    </div>
  </div>
  <!-- 初始伙伴选择 -->
  <div id="starter" class="starter hidden">
    <h2>选择你的第一位伙伴</h2>
    <div class="slist"></div>
    <div class="sinfo">点击卡片查看介绍</div>
    <button class="sgo tbtn primary" disabled>就决定是你了！</button>
  </div>
</div>

<!-- ============ 游戏主体 ============ -->
<div id="game" class="screen hidden">
  <div id="hud">
    <div class="hleft">
      <span id="locName" class="loc"></span>
      <span id="hudMoney" class="chip">¥0</span>
      <span id="hudBadge" class="chip badge">◇</span>
    </div>
    <div class="hright">
      <div id="hudTeam" class="team"></div>
      <button id="hudMenu" class="menubtn">☰</button>
    </div>
  </div>

  <div id="stage">
    <canvas id="world"></canvas>
    <div id="emote" class="emote">!</div>
    <div id="encFx" class="encfx"></div>
    <div id="healFx" class="healfx"></div>
    <div id="dialog" class="dialog hidden">
      <div id="dialogName" class="dname"></div>
      <div id="dialogText" class="dtext"></div>
      <div class="dnext">▼</div>
    </div>
  </div>

  <div id="controls">
    <div id="dpad" class="dpad">
      <div class="dp up"></div><div class="dp down"></div><div class="dp left"></div><div class="dp right"></div>
      <div class="dcore"></div>
    </div>
    <div class="abs">
      <button id="btnB" class="rbtn b">B</button>
      <button id="btnA" class="rbtn a">A</button>
    </div>
  </div>
</div>

<!-- ============ 通用浮层 ============ -->
<div id="choice" class="choice hidden"></div>
<div id="menu" class="menu hidden"></div>
<div id="battle" class="battle hidden"></div>
<div id="fade" class="fade"></div>

<script src="data.js"></script>
<script src="sprites.js"></script>
<script src="audio.js"></script>
<script src="core.js"></script>
<script src="battle.js"></script>
<script src="world.js"></script>
</body>
</html>
