<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>军队文职考试笔记</title>
<link rel="stylesheet" href="notes.css">
<style>
.hero{padding:26px 0 6px;}
.hero .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 4px;}
.hero h1{font-family:var(--font-display);font-size:1.55rem;margin:0 0 6px;color:var(--navy);text-wrap:balance;}
.hero p{color:var(--ink-soft);font-size:.86rem;margin:0;}
.quizcta{
  display:flex;align-items:center;gap:12px;margin:20px 0 6px;
  background:var(--navy);color:#fbf8f0;border-radius:12px;padding:15px 17px;
  text-decoration:none;
}
@media (prefers-color-scheme: dark){.quizcta{color:#14171f;}}
.quizcta .ic{font-size:1.6rem;flex:none;}
.quizcta .t{font-weight:700;font-size:.98rem;}
.quizcta .d{font-size:.78rem;opacity:.82;margin-top:2px;}
.quizcta .arrow{margin-left:auto;font-size:1.1rem;flex:none;}

.chgroup{margin-top:34px;}
.chgroup h2{
  font-family:var(--font-display);font-size:1.15rem;color:var(--ink);
  border-bottom:2px solid var(--navy);padding-bottom:8px;margin:0 0 4px;
  display:flex;align-items:baseline;gap:8px;
}
.chgroup h2 .num{
  font-family:var(--font-mono);font-size:.78rem;font-weight:700;
  color:var(--navy);background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;letter-spacing:.02em;
}
.chgroup .sub{color:var(--ink-soft);font-size:.8rem;margin:8px 0 14px;}
.seclist{list-style:none;margin:0;padding:0;}
.seclist li{margin-bottom:9px;}
.seclist a{
  display:flex;align-items:center;gap:12px;min-height:58px;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;text-decoration:none;color:var(--ink);
}
.seclist .n{
  flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface-2);
  color:var(--navy);font-family:var(--font-mono);font-weight:700;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;
}
.seclist .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.seclist .t{display:block;font-size:.92rem;font-weight:700;line-height:1.3;}
.seclist .p{display:block;font-size:.74rem;color:var(--ink-soft);}
.seclist .qc{
  flex:none;font-family:var(--font-mono);font-size:.72rem;color:var(--crimson);
  background:var(--surface-2);border-radius:999px;padding:3px 8px;
  align-self:center;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <p class="eyebrow">军队文职人员招聘考试 · 公共科目 · 基本知识</p>
    <h1>复习笔记</h1>
    <p id="heroSub">整理自华图教育 2026 版教材。</p>
  </div>

  <a class="quizcta" href="quiz/quiz.html">
    <span class="ic">🎯</span>
    <span>
      <span class="t">在线测验</span>
      <span class="d">历年真题按小节分组，支持刷题计分、错题本、按章节复习</span>
    </span>
    <span class="arrow">›</span>
  </a>

  <div id="toc"></div>
</div>
<script src="book-nav.js"></script>
<script src="index-toc.js"></script>
</body>
</html>
