<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>正反转控制电路 · 实物接线图</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#d7dde3; --tx:#232a32; --tx2:#5b6570; --tx3:#8b96a1;
  --acc:#1a6fd4; --accbg:#e8f1fc;
  --red:#c0392b; --green:#2f9e44; --blue:#2b6cb0; --orange:#e67e22;
  --redbg:#fbe9e7; --greenbg:#e8f7ea; --bluebg:#e9f0f8; --orangebg:#fdf1e3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:12px 12px 0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 2px 10px}
.top h1{font-size:1.05rem;margin:0;flex:1 1 auto;line-height:1.35}
.top .back{font-size:.78rem;color:var(--tx3);text-decoration:none;border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;white-space:nowrap}
.sub{width:100%;font-size:.76rem;color:var(--tx3);margin-top:2px}

.circuits{display:flex;gap:6px;margin-bottom:8px}
.circuits button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx3);
  border-radius:9px;padding:8px 9px;font-size:.72rem;text-align:left;line-height:1.4}
.circuits button .k{font-weight:700;color:var(--tx);display:block;font-size:.84rem;margin-bottom:1px}
.circuits button.on{background:var(--accbg);border-color:var(--acc)}
.circuits button.on .k{color:var(--acc)}

.modes{display:flex;gap:6px;margin-bottom:8px}
.modes button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:9px;padding:9px 6px;font-size:.82rem;font-weight:600}
.modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* 原理图那一屏：三个「按住」按钮 + 状态条。
   按钮一律 touch-action:manipulation —— 长按会弹出系统的选中/放大镜，
   而这里的核心交互恰恰就是长按（手机上实测踩到的） */
.sbar{margin-bottom:10px}
.sbtns{display:flex;gap:6px}
.sbtns button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);
  border-radius:10px;padding:10px 4px;font-size:.8rem;font-weight:600;line-height:1.25;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sbtns button span{display:block;font-size:.66rem;font-weight:400;color:var(--tx3);margin-top:2px}
.sbtns button.down{transform:translateY(1px)}
.sbtns .b-g.down{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.sbtns .b-b.down{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
.sbtns .b-r.down{background:var(--redbg);border-color:var(--red);color:var(--red)}
.sbtns .b-g.down span,.sbtns .b-b.down span,.sbtns .b-r.down span{color:inherit}
.stip{font-size:.72rem;color:var(--tx3);margin-top:6px;line-height:1.5}
.srun{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  background:var(--card);font-size:.8rem;line-height:1.6}
.srun .st{font-weight:700}
.srun.on{background:var(--greenbg);border-color:var(--green)}
.srun.on .st{color:var(--green)}
.srun.off .st{color:var(--tx2)}
.srun .why{color:var(--tx2);font-size:.76rem;margin-top:3px}

/* 原理图里可点的符号：默认不加任何装饰，选中才描一圈——
   一上来就全部描边的话，整张图全是框，反而看不出哪个是重点 */
.sym{cursor:pointer}
.sym-hit{fill:transparent}
.sym-ring{fill:none;stroke:var(--acc);stroke-width:1.6;opacity:0;transition:opacity .15s}
.sym.sel .sym-ring{opacity:1}
.sw{stroke:var(--tx);stroke-width:2.2;fill:none;stroke-linecap:round;transition:stroke .18s}
.sw.live{stroke:var(--red);stroke-width:3.2}
.sdot{fill:var(--tx);transition:fill .18s}
.sdot.live{fill:var(--red)}
.sdash{stroke:var(--tx3);stroke-width:1.3;stroke-dasharray:4 3;fill:none}
.swire{stroke:var(--tx3);stroke-width:2.2;fill:none;stroke-linecap:round;
  transition:stroke .18s,stroke-width .18s}
.swire.live{stroke:var(--red);stroke-width:3.2}
.sbox{fill:var(--card);stroke:var(--tx);stroke-width:2}
.slbl{font-size:10.5px;fill:var(--tx2)}
.slbl-b{font-size:11px;fill:var(--tx);font-weight:700}
.snote{font-size:9.5px;fill:var(--tx3)}

.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.grpbtns{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;padding-bottom:2px}
.grpbtn{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);border-radius:8px;padding:7px 10px;font-size:.76rem;white-space:nowrap}
.grpbtn .dot{width:9px;height:9px;border-radius:50%;flex:none}
.grpbtn.on{border-color:var(--acc);background:var(--accbg);color:var(--acc);font-weight:700}
.chk{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--tx2);white-space:nowrap;
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card)}

.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}

.term-hit{fill:transparent;cursor:pointer}
.term-dot,.tlabel,.badge-c,.badge-t,.term-ring{pointer-events:none}
.term-dot{fill:#fff;stroke:#333;stroke-width:1.6}
.term-ring{fill:none;stroke:#333;stroke-width:1.3}
.term-dot.hi{stroke:var(--acc);stroke-width:2.4}
.term-dot.wrong{fill:var(--red);stroke:var(--red)}
.term-dot.right{fill:var(--green);stroke:var(--green)}
.tlabel{font-size:9.5px;fill:var(--tx2);font-family:ui-monospace,Menlo,Consolas,monospace}
.badge-c{fill:#fff;stroke:var(--tx2);stroke-width:1}
.badge-t{font-size:8px;fill:var(--tx2);text-anchor:middle;dominant-baseline:middle;font-weight:700}
.hide-labels .tlabel{display:none}

.dev-box{fill:#eef1f4;stroke:#98a3ad;stroke-width:1.6}
.dev-km{fill:#5a6472;stroke:#2e343c}
.dev-name{font-size:11px;fill:var(--tx2);text-anchor:middle}
.dev-name-in{font-size:11px;fill:#eef1f4;text-anchor:middle;font-weight:700}
.dev-sub-in{font-size:8.5px;fill:#c4cad2;text-anchor:middle}
.tb-strip{fill:#e2e7eb;stroke:#98a3ad;stroke-width:1.6}
.aux-strip{fill:#4a525c}
.fuse-body{fill:#f6e7b0;stroke:#a98a2e;stroke-width:1.2}

.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:miter;
  transition:opacity .25s,stroke-width .2s}
.wire.dim{opacity:.15}
.wire.hi{stroke-width:4.4}

.legend rect{stroke:var(--line);stroke-width:1}
.legend text{font-size:10.5px;fill:var(--tx2)}
.legend .lt{font-size:10.5px;fill:var(--tx3);font-weight:700}

.side{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:.82rem;color:var(--tx2);min-height:20px;line-height:1.55}
.side b{color:var(--tx)}
.side .empty{color:var(--tx3)}

.playbar,.testbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.playbar button,.testbar button{border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:8px;padding:7px 11px;font-size:.8rem}
.playbar button:disabled{opacity:.4}
.playbar .cur{flex:1 1 100%;font-size:.85rem;color:var(--tx);background:var(--accbg);
  border-radius:8px;padding:8px 10px}
.playbar .cur b{color:var(--acc)}
.playbar .cur .warnline{display:block;margin-top:7px;color:#a86200;background:#fdf1de;
  border-radius:7px;padding:6px 8px;font-size:.76rem;font-weight:400}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.qcard .qn{font-size:.72rem;color:var(--tx3);margin-bottom:4px}
.qcard .qt{font-size:.95rem;font-weight:700}
.qcard .qt b{color:var(--acc)}
.qcard .fb{margin-top:8px;font-size:.82rem;border-radius:8px;padding:8px 10px}
.qcard .fb.right{background:var(--greenbg);color:#1e6b2e}
.qcard .fb.wrong{background:var(--redbg);color:#9a2c1f}
.qcard .fb .hint{display:block;margin-top:4px;color:var(--tx2)}
.qcard .next{margin-top:8px;background:var(--acc);color:#fff;border:none;border-radius:8px;
  padding:8px 14px;font-size:.85rem;font-weight:600}
.score{font-size:.78rem;color:var(--tx3)}

.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.result .big{font-size:1.6rem;font-weight:800;color:var(--acc)}
.result table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.8rem;min-width:0}
.result td{border-top:1px solid var(--line);padding:6px 4px}
.result .redo{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.result .redo button{border:1px solid var(--line);background:var(--card2,#f7f9fb);color:var(--tx2);
  border-radius:8px;padding:8px 12px;font-size:.8rem}
.result .redo button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

.hintbar{position:sticky;bottom:0;margin-top:14px;background:var(--card);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));font-size:.8rem;color:var(--tx2);line-height:1.5}
.hintbar .g{color:var(--tx3);font-size:.72rem}
.hintbar .t{margin-top:2px}
.hintbar .warn{margin-top:6px;color:#a86200;background:#fdf1de;border-radius:8px;padding:6px 9px;font-size:.76rem}
.foot-pad{height:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="pgTitle">实物接线图</h1>
    <a class="back" href="index.html">‹ 电工课</a>
    <div class="sub" id="pgSub"></div>
  </div>

  <div class="circuits" id="circuitBtns"></div>

  <div class="modes">
    <button data-mode="schema">原理图</button>
    <button data-mode="browse" class="on">浏览模式</button>
    <button data-mode="step">逐根播放</button>
    <button data-mode="test">自测</button>
    <button data-mode="screw">上螺丝顺序</button>
  </div>

  <div class="sbar" id="schemaBar" style="display:none">
    <div class="sbtns">
      <button data-sb="cont" class="b-g">按住 连续<span>端子排 1、2</span></button>
      <button data-sb="jog"  class="b-b">按住 点动<span>端子排 5~8</span></button>
      <button data-sb="stop" class="b-r">按住 停止<span>端子排 11、12</span></button>
    </div>
    <div class="srun off" id="schemaState"></div>
    <div class="stip">按钮要<b>按住</b>再松手 —— 点动和连续的区别只有松手那一下看得出来。
      图上任一个符号都能点，告诉你它是什么。<br>
      按钮盒上<b>四个端子全用上的那个就是点动</b>；颜色上多半是绿＝连续、黄＝点动、红＝停止，
      <b>上板看一眼线落在哪几位可以确认</b>。</div>
  </div>

  <div class="toolbar" id="browseBar">
    <div class="grpbtns" id="grpBtns"></div>
    <label class="chk"><input type="checkbox" id="labelChk" checked> 显示端子号</label>
  </div>

  <div id="testHead"></div>
  <div id="screwHead"></div>

  <div class="stage">
    <svg id="svg" viewBox="0 0 860 700" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="playbar" id="playBar" style="display:none">
    <button id="pPrev">‹ 上一根</button>
    <button id="pNext">下一根 ›</button>
    <button id="pAuto">▶ 自动播放</button>
    <button id="pReset">重置</button>
    <div class="cur" id="pCur">点击「下一根」开始</div>
  </div>

  <div class="side" id="side"><span class="empty">悬停任意端子，看它接了几根线；点击左侧分组，只看这一组的走线。</span></div>

  <div class="hintbar" id="hintbar">
    <div class="g">记法</div>
    <div class="t" id="hintText">点一个分组，看这组怎么记。</div>
    <div id="warnBox"></div>
  </div>
  <div class="foot-pad"></div>
</div>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------
   数据（唯一真相）：元件外框 + 端子相对偏移 / 导线 from-to / 分组记忆法
   渲染只读这三个常量，不倒过来写死坐标 —— 改布局只改 DEVICES

   每块板子包成一个工厂函数：函数内部先建自己的 TPOS，再拿 X()/Y() 定义 WIRES。
   不这么做的话，第二块板的 WIRES 求值时会读到第一块板的坐标表——两个电路串味，
   而且报不出错，只是线画到离谱的地方去（改成多电路时踩的第一个坑）
------------------------------------------------------------------ */
function buildTPOS(devices){
  const tpos = {};
  devices.forEach(function(d){
    d.terminals.forEach(function(t){
      tpos[t.id] = {x:d.x+t.x, y:d.y+t.y, device:d.id, label:t.label};
    });
  });
  return tpos;
}

/* ══ K32 正反转（双接触器 · 14 根）══════════════════════════ */
function defK32(){
const DEVICES = [
  /* 端子排挪到左上角、竖排——照他实操板拍的照片来的（2026-09-06）。
     其余元件跟着整体右移 30px 让位，彼此之间的相对位置没变，
     所以大部分导线的拐点是靠 X()/Y() 现算的，改这里不用跟着改那些拐点 */
  {id:'tb', name:'端子排', sub:'TB', kind:'tb', x:40, y:50, w:50, h:380,
   terminals:(function(){
     const out=[];
     for(let i=0;i<12;i++) out.push({id:'tb-'+(i+1), label:String(i+1), x:25, y:20+i*(340/12)});
     out.push({id:'tb-last', label:'末', x:25, y:20+12*(340/12)});
     return out;
   })()},
  {id:'fu4', name:'4号熔断器', sub:'RT18-32X', kind:'fuse', x:120, y:40, w:60, h:90,
   terminals:[ {id:'fu4-out', label:'出', x:30, y:90} ]},
  {id:'fu5', name:'5号熔断器', sub:'RT18-32X', kind:'fuse', x:550, y:40, w:60, h:90,
   terminals:[ {id:'fu5-out', label:'出', x:30, y:90} ]},
  {id:'fr', name:'JR36 热继电器', sub:'', kind:'fr', x:260, y:70, w:110, h:60,
   terminals:[ {id:'fr-96', label:'96', x:0, y:30}, {id:'fr-95', label:'95', x:110, y:30} ]},
  {id:'km1', name:'1号接触器', sub:'CJX2s-0911', kind:'km', x:180, y:220, w:160, h:260,
   terminals:[
     {id:'km1-a1', label:'A1', x:160, y:20},
     {id:'km1-a2', label:'A2', x:160, y:160},
     {id:'km1-14', label:'14', x:40,  y:260},
     {id:'km1-22', label:'22', x:65,  y:260},
     {id:'km1-21', label:'21', x:95,  y:260},
     {id:'km1-13', label:'13', x:120, y:260}
   ]},
  {id:'km2', name:'2号接触器', sub:'CJX2s-0911', kind:'km', x:500, y:220, w:160, h:260,
   terminals:[
     {id:'km2-a1', label:'A1', x:0,   y:20},
     {id:'km2-a2', label:'A2', x:0,   y:180},
     {id:'km2-14', label:'14', x:40,  y:260},
     {id:'km2-22', label:'22', x:65,  y:260},
     {id:'km2-21', label:'21', x:95,  y:260},
     {id:'km2-13', label:'13', x:120, y:260}
   ]}
];

/* 端子绝对坐标表：{id:{x,y,device,label}} —— WIRES 的 from/to 全靠它解析，
   waypoints 里需要「跟某个端子对齐」的拐点也靠它取，不写死数字 */
const TPOS = buildTPOS(DEVICES);
function X(id){ return TPOS[id].x; }
function Y(id){ return TPOS[id].y; }

/* 端子的人话说法，自测出题 / 逐根播放 / 悬停面板都用它 */
const TLABEL = {
  'fu4-out':'4号熔断器', 'fu5-out':'5号熔断器',
  'fr-96':'热继电器96', 'fr-95':'热继电器95',
  'km1-a1':'1号接触器A1', 'km1-a2':'1号接触器A2',
  'km1-13':'1号接触器13', 'km1-14':'1号接触器14', 'km1-21':'1号接触器21', 'km1-22':'1号接触器22',
  'km2-a1':'2号接触器A1', 'km2-a2':'2号接触器A2',
  'km2-13':'2号接触器13', 'km2-14':'2号接触器14', 'km2-21':'2号接触器21', 'km2-22':'2号接触器22'
};
for(let i=1;i<=12;i++) TLABEL['tb-'+i] = '端子排'+i;
TLABEL['tb-last'] = '端子排（末端）';

const GROUPS = [
  {id:1, name:'电源进线',         hint:'两个熔断器各管一路，4 号走热继电器，5 号串两个线圈 A1'},
  {id:2, name:'常闭对线圈（交叉）', hint:'我的 22NC 管对方的命'},
  {id:3, name:'常闭对常开（交叉）', hint:'我的 21NC 接对方的 14NO，这个点再引一根下端子排'},
  {id:4, name:'常开对常开',       hint:'13NO 对 13NO，再引一根去公共点'},
  {id:5, name:'端子排跳线',       hint:'端子排 2-6-11 并成一个公共点'}
];
const GCOLOR = {1:'var(--red)', 2:'var(--blue)', 3:'var(--blue)', 4:'var(--green)', 5:'var(--orange)'};
const GCOLOR_HEX = {1:'#c0392b', 2:'#2b6cb0', 3:'#2b6cb0', 4:'#2f9e44', 5:'#e67e22'};

/* WIRES：from/to 是端子 id，waypoints 只写「中间拐点」，起止点由 from/to 自动取。
   14 根，数组顺序＝实际接线顺序（先常闭后常开：21NC/13NO 在接触器右侧相邻，
   22NC/14NO 在左侧相邻，先接常开会挡住旁边常闭的螺丝，2026-09-06 改的） */
/* 碰端子排的六根（2/8/10/12/13/14）单独说一下走法：端子排现在是竖排贴在左边，
   fu4 的左边缘在 x=120，留出 x=90~120 这条空当当走线的「过道」。
   凡是要去端子排的线，一律先落到过道里的某个 x（每根错开几像素，视觉上不叠成一股），
   再顺着过道走到端子排自己那一行的高度，最后从右边横着接进端子——不从端子排上方/
   下方穿过去，也不会撞见 fu4/km1 的方框 */
const WIRES = [
  {id:1,  from:'fu4-out', to:'fr-96',   group:1, waypoints:[[X('fu4-out'),150],[X('fr-96'),150]]},
  {id:2,  from:'fr-95',   to:'tb-last', group:1, waypoints:[[X('fr-95'),150],[114,150],[114,Y('tb-last')]]},
  {id:3,  from:'fu5-out', to:'km2-a1',  group:1, waypoints:[[X('fu5-out'),170],[X('km2-a1'),170]]},
  {id:4,  from:'km2-a1',  to:'km1-a1',  group:1, waypoints:[]},
  {id:5,  from:'km1-22',  to:'km2-a2',  group:2, waypoints:[[X('km1-22'),505],[400,505],[400,Y('km2-a2')]]},
  {id:6,  from:'km2-22',  to:'km1-a2',  group:2, waypoints:[[X('km2-22'),515],[440,515],[440,Y('km1-a2')]]},
  {id:7,  from:'km1-21',  to:'km2-14',  group:3, waypoints:[[X('km1-21'),540],[X('km2-14'),540]]},
  {id:8,  from:'km2-14',  to:'tb-5',    group:3, waypoints:[[X('km2-14'),560],[108,560],[108,Y('tb-5')]]},
  {id:9,  from:'km2-21',  to:'km1-14',  group:3, waypoints:[[X('km2-21'),580],[X('km1-14'),580]]},

/* ══ K31 单向连续运转 · 带点动控制（单接触器 · 10 根）═══════════
   **接线以他的实做记录为准**（2026-09-07 他在板子上接完后给的 10 根明细）。
   早先我按考试模拟软件那张 K31-03 原理图推过一版，拓扑等价但落到端子上处处不同，
   已经整个换掉了 —— 对不上的地方记在仓库 CLAUDE.md 里。

   回路（注意方向跟那张原理图是反的：先过线圈，最后才是停止和热继电器）：
     L1 → FU2(4号) → KM 线圈 A1→A2 → 公共点 X
     X ─┬─ 端子排 1 →[连续·动合]→ 端子排 2 ─┐
        ├─ 端子排 5 →[点动·动合]→ 端子排 6 ─┤→ 公共点 Y
        └─ 13NO →[KM 自锁]→ 14NO → 7 →[点动·动断]→ 8 ─┘
     Y → 端子排 11 →[停止·动断]→ 12 → FR 96-95 → FU2(5号) → L2

   全电路的眼仍在第三条支路：**自锁串了点动按钮的动断**，所以按点动时它先断开、
   自锁接不通，松手即停；按连续时那条路通着，松手照转。

   1-4 绿＝连续 / 5-8 黄＝点动 / 9-12 红＝停止。上板看一眼线落在哪几位就能确认。 */

   terminals:(function(){

     for(let i=0;i<12;i++) out.push({id:'tb-'+(i+1), label:String(i+1), x:27, y:40+i*40});

];

const TPOS = buildTPOS(DEVICES);
function X(id){ return TPOS[id].x; }

/* 端子排那 12 位一律带上「这一位通到哪个按钮的哪对触点」，
   光写「端子排4」的话，自测时根本判断不了该不该接它 */
const TLABEL = {

  'tb-11':'端子排11（停止·动断）', 'tb-12':'端子排12（停止·动断）'
};

/* 分组照他记录时的分法（他就是这么分三组记的），不另起炉灶 */
const GROUPS = [
  {id:1, name:'线圈与自锁', hint:'4 号熔断器直接进线圈 A1；A2 和 13NO 短接，自锁触点两端分别去端子排 1 和 7'},
  {id:2, name:'热继电器',   hint:'5 号熔断器 → 热继电器 95，96 出来去端子排 12（停止按钮那一对的另一端）'},
  {id:3, name:'端子排跳线', hint:'跳完只剩两个公共点：1＝5（接线圈那一侧）、2＝6＝8＝11（回停止按钮那一侧）'}
];
const GCOLOR_HEX = {1:'#c0392b', 2:'#2f9e44', 3:'#e67e22'};

/* 10 根，顺序照他记录的三组：先线圈与自锁、再热继电器、最后端子排跳线。

   720/735/750/765 在端子排右侧专走跳线），横向通道各占一条 y（175 上方、
   490/555/570/620 下方），两两不重叠。
   第 1 根和第 5 根必然交叉一次（4 号熔断器在左要往右去线圈，5 号在右要往左去热继电器）——
   交叉处不打点＝不相连，正好是 4.1 那节讲的规矩，不用为它重排布局 */
const WIRES = [
  {id:1,  from:'fu4-out', to:'km-a1', group:1, waypoints:[[X('fu4-out'),175],[500,175],[500,Y('km-a1')]]},

return { id:'k31', k:'K31',

         '⚠ 有 4 个端子要压两根线：<b>13NO、端子排 1、6、8</b> —— 两个冷压端子一起套上再拧'] };
}

/* 电路登记表：key 是电路 id（对应实操材料的 K 编号）。
   加 K33/K34 只要再写一个 defK33() 挂进来 —— 渲染层全部读「当前电路」，
   没有任何一处认死某一块板 */
const CIRCUITS = { k31: defK31(), k32: defK32() };
const CIRCUIT_ORDER = ['k31','k32'];

/* 「当前电路」的活动引用：loadCircuit() 换的就是这几个，
   下面所有渲染 / 模式代码照旧读 DEVICES / WIRES / TPOS…，一个字都不用改 */
let CUR = null, DEVICES, WIRES, GROUPS, TPOS, TLABEL, GCOLOR_HEX, CURRENT_CIRCUIT, TCOUNT;

/* 每个端子被几根线用到，从 wires 数组现算，不要在别处维护一份名单 */
function getTerminalWireCount(circuitId){
  const c = CIRCUITS[circuitId];
  const counts = {};
  if(!c) return counts;
  c.wires.forEach(function(w){
    counts[w.from] = (counts[w.from]||0) + 1;
    counts[w.to]   = (counts[w.to]||0) + 1;
  });
  return counts;
}
function termCount(id){ return TCOUNT[id]||0; }

function wireDesc(w){ return TLABEL[w.from]+' → '+TLABEL[w.to]; }
function otherEndText(w, tid){
  return w.from===tid ? '去往 '+TLABEL[w.to]+'（'+w.to+'）' : '来自 '+TLABEL[w.from]+'（'+w.from+'）';
}
function wirePathD(w){
  const p0=TPOS[w.from], p1=TPOS[w.to];
  const pts=[[p0.x,p0.y]].concat(w.waypoints||[]).concat([[p1.x,p1.y]]);
  return pts.map(function(p,i){ return (i===0?'M':'L')+p[0]+','+p[1]; }).join(' ');
}

/* 按端子分步：每个端子第一次在 wires 里出现的位置决定它排第几步，
   一步里列出这个端子上的每一根线 —— 接 2 根的步骤就是「同时压 2 个端子」那一下 */
function buildScrewSteps(circuitId){
  const c = CIRCUITS[circuitId];
  if(!c) return [];
  const order=[], seen={};
  c.wires.forEach(function(w){
    [w.from, w.to].forEach(function(tid){
      if(!seen[tid]){ seen[tid]=true; order.push(tid); }
    });
  });
  const counts = getTerminalWireCount(circuitId);
  return order.map(function(tid){
    const items = c.wires.filter(function(w){ return w.from===tid || w.to===tid; });
    return { terminal:tid, count:counts[tid], items:items };
  });
}

/* ------------------------------------------------------------------
   渲染：元件（静态画一次）+ 导线 path（14 条，各带 data-group/data-idx）
------------------------------------------------------------------ */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const svg = document.getElementById('svg');
const gDev = el('g',{id:'gDevices'});
const gWire = el('g',{id:'gWires'});
const gTerm = el('g',{id:'gTerms'});
const gLegend = el('g',{id:'gLegend'});
svg.appendChild(gDev); svg.appendChild(gWire); svg.appendChild(gTerm); svg.appendChild(gLegend);

function drawDevice(d){
  if(d.kind==='tb'){
    gDev.appendChild(el('rect',{class:'tb-strip', x:d.x, y:d.y, width:d.w, height:d.h, rx:4}));
    const label = d.name+'（'+d.sub+'）';
    if(d.h > d.w){
      /* 竖排端子排：标签横着写在顶端上方。
         早先是转 90° 贴在左边，K31 把端子排摆到右边之后，那一竖列文字正好落在
         「去端子排」的走线通道里，跟第 2 根线叠在一起（截图才看出来）。
         顶端上方两块板都是空的，横排也比竖排好读 */
      const t=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-8});
      t.textContent=label; gDev.appendChild(t);
    } else {
      const t=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-8});
      t.textContent=label; gDev.appendChild(t);
    }
    return;
  }
  if(d.kind==='fuse'){
    gDev.appendChild(el('rect',{class:'dev-box', x:d.x, y:d.y, width:d.w, height:d.h, rx:6}));
    gDev.appendChild(el('rect',{class:'fuse-body', x:d.x+d.w/2-9, y:d.y+16, width:18, height:d.h-32, rx:9}));
    gDev.appendChild(el('line',{x1:d.x+d.w/2, y1:d.y, x2:d.x+d.w/2, y2:d.y+16, stroke:'#98a3ad','stroke-width':1.6}));
    const t1=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-22}); t1.textContent=d.name; gDev.appendChild(t1);
    const t2=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-9, style:'font-size:9px;fill:var(--tx3)'});
    t2.textContent=d.sub; gDev.appendChild(t2);
    return;
  }
  if(d.kind==='fr'){
    gDev.appendChild(el('rect',{class:'dev-box', x:d.x, y:d.y, width:d.w, height:d.h, rx:6}));
    gDev.appendChild(el('circle',{cx:d.x+d.w/2, cy:d.y+d.h-14, r:6, fill:'#c0392b'}));
    const t=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-8}); t.textContent=d.name; gDev.appendChild(t);
    return;
  }
  /* km：接触器，深灰机身 + 白字铭牌 + 底部辅助端子条 */
  gDev.appendChild(el('rect',{class:'dev-box dev-km', x:d.x, y:d.y, width:d.w, height:d.h, rx:8}));
  gDev.appendChild(el('rect',{class:'aux-strip', x:d.x+18, y:d.y+d.h-46, width:d.w-36, height:26, rx:4}));
  const n1=el('text',{class:'dev-name-in', x:d.x+d.w/2, y:d.y+30}); n1.textContent=d.name; gDev.appendChild(n1);
  const n2=el('text',{class:'dev-sub-in', x:d.x+d.w/2, y:d.y+44}); n2.textContent=d.sub; gDev.appendChild(n2);
}

function drawTerminal(id){
  const p=TPOS[id];
  const n=termCount(id);
  const shared = n>=2;
  const g=el('g',{'data-term':id});
  const hit=el('circle',{class:'term-hit', cx:p.x, cy:p.y, r:14});
  g.appendChild(hit);
  /* 共用端子（同一颗螺丝压两根线）画成双环：外面再套一圈细描边，
     一眼跟只接一根的普通端子分开 —— 提醒「两个冷压端子一起套上再拧」 */
  if(shared) g.appendChild(el('circle',{class:'term-ring', cx:p.x, cy:p.y, r:10}));
  const dot=el('circle',{class:'term-dot', cx:p.x, cy:p.y, r:(shared?7:6), 'data-term-dot':id});
  g.appendChild(dot);
  const lbl=el('text',{class:'tlabel', x:p.x+9, y:p.y-8});
  lbl.textContent=p.label; g.appendChild(lbl);
  if(shared){
    g.appendChild(el('circle',{class:'badge-c', cx:p.x+11, cy:p.y+11, r:8}));
    const bt=el('text',{class:'badge-t', x:p.x+11, y:p.y+11}); bt.textContent='×'+n; g.appendChild(bt);
  }
  gTerm.appendChild(g);
  hit.addEventListener('mouseenter', function(){ onTermHover(id); });
  hit.addEventListener('mouseleave', function(){ onTermHover(null); });
  hit.addEventListener('click', function(){ onTermClick(id); });
}
function wirePath(idx){ return gWire.querySelector('path[data-idx="'+idx+'"]'); }

/* 图例：项目从当前电路的 GROUPS 现生成，按颜色去重
   （K32 的第 2、3 组同为蓝色，不去重会并排出现两条一样的蓝线） */
function drawLegend(){
  const seen={}, items=[];
  GROUPS.forEach(function(g){
    const c=GCOLOR_HEX[g.id];
    if(seen[c]) return;
    seen[c]=true; items.push([g.name, c]);
  });
  const bx=CUR.legend.x, by=CUR.legend.y;
  gLegend.appendChild(el('rect',{x:bx, y:by, width:230, height:14+items.length*18+6, rx:8,
    fill:'var(--card)', stroke:'var(--line)'}));
  const lt=el('text',{class:'lt', x:bx+10, y:by+16}); lt.textContent='图例（按接线分组）'; gLegend.appendChild(lt);
  items.forEach(function(it,i){
    const y=by+34+i*18;
    gLegend.appendChild(el('line',{x1:bx+12, y1:y-4, x2:bx+34, y2:y-4, stroke:it[1], 'stroke-width':3}));
    const t=el('text',{x:bx+42, y:y}); t.textContent=it[0]; gLegend.appendChild(t);
  });
}

/* 整幅图重画一次：换电路时四个图层全部清空重建。
   只清 innerHTML 不行——端子上挂着 mouseenter/click，留着旧节点会让上一块板的
   端子还在响应点击（换电路时踩的第二个坑） */
function buildScene(){
  [gDev, gWire, gTerm, gLegend].forEach(function(g){
    while(g.firstChild) g.removeChild(g.firstChild);
  });
  svg.setAttribute('viewBox', CUR.viewBox);
  DEVICES.forEach(drawDevice);
  Object.keys(TPOS).forEach(drawTerminal);
  WIRES.forEach(function(w){
    gWire.appendChild(el('path',{class:'wire', d:wirePathD(w), stroke:w.color,
      'data-idx':w.id, 'data-group':w.group}));
  });
  drawLegend();
}

/* ==================================================================
   原理图（只有 K31 有）：三个按钮真的能按住 / 松手，电流路径实时算出来

   这一屏要回答的只有一个问题：为什么按 SB2 松手照转、按 SB1 松手就停。
   答案全在「SB1 的动断触点串在自锁支路上」，所以三条并联支路必须分开画清楚。
------------------------------------------------------------------ */
/* 布局按他的实做接法排：**先过线圈，最后才是停止和热继电器** ——
   跟考试模拟软件那张原理图方向相反，但那是他板子上实际的接法 */
const S = { XL:70, XB:168, XC:262, XR:318,
  yIn:26, yFu:58, yCoil:110, yP:166, ySw:210, yC2:258, yQ:306, ySb3:350, yFr:396, yBot:436,
  H:7 };   /* H = 触点半高：导线段直接画到 y±H，触点自己不再画引脚。
              早先触点两头各画一小段引线、又不属于任何 seg，于是回路通电时
              那两小段永远是灰的，红线中间夹两截灰（截图看出来的） */

/* 开关的机械状态。**点动按钮是复合的**（动合＋动断各一对），两对分开记 ——
   「动断先断、动合后合」这个先后顺序就是靠它俩分开才表达得出来 */
const SW = { contno:false, jogno:false, jognc:true, stopnc:true, fr:true };
let kmOn = false;
let symSel = null;
const SW_DELAY = 260;   /* 复合按钮两对触点动作的时间差，见 pressSB */
let swTimer = null;

/* 电路求解。c 这一支用的是「上一刻的 kmOn」——自锁的正反馈就是这么出来的，
   跟 4.4 那节的 ctrlOn() 同一个写法。
   停止和热继电器画在回路末端（照他的接法），但串联位置不影响判断，照旧当总开关 */
function solve(){
  const up = SW.fr && SW.stopnc;
  const a  = up && SW.contno;                /* 连续启动 */
  const b  = up && SW.jogno;                 /* 点动 · 动合 */
  const c  = up && kmOn && SW.jognc;         /* 自锁：KM 13-14 串了点动的动断 */
  kmOn = a || b || c;
  return {up:up, a:a, b:b, c:c, km:kmOn};
}

const SYM_DESC = {
  fu:['熔断器 FU2（控制回路两只）',
      '一段细金属丝封在管里，电流大到一定程度自己熔断。控制回路要单独装两只，是因为主回路那几只是按电动机的大电流选的——控制回路这点电流根本熔不断它们，只会让线一直烧。'],
  stop:['停止按钮 · 动断触点（端子排 11、12）',
      '画的是「没人按」的样子：动触点臂压在静触点上，那一小横杠就是静触点。<b>按下去才断开。</b>停止一律用动断，理由和热继电器同一条：坏了要往「停」的方向坏。'],
  cont:['连续启动按钮 · 动合触点（端子排 1、2）',
      '动臂斜着离开静触点＝没人按时是断开的。按一下线圈得电，KM 的 13/14 跟着闭合把自己锁住，<b>松手照转</b>。这个按钮<b>只用动合这一对</b>，它的动断（端子排 3、4）这题空着。'],
  jogno:['点动按钮 · 动合触点（端子排 5、6）',
      '点动按钮是复合的，这是它的动合那一对。按住时线圈得电、电机转。<b>四个端子全用上的那个按钮就是点动</b>——这是现场认按钮最快的判据。'],
  jognc:['点动按钮 · 动断触点（端子排 7、8）← 全图的机关',
      '它<b>串在自锁支路上</b>。按点动时它先断开，自锁那条路根本接不通，所以松手就停。左边那条折虚线表示它和上面那个动合触点是<b>同一个按钮</b>机械联动的。'],
  km:['接触器 KM 的动合辅助触点（13-14）',
      '线圈得电它就闭合，把线圈自己的供电锁住，叫<b>自锁</b>。它串在点动按钮的动断前面，所以点动的时候锁不上。接线图上这两个端子就是 13NO / 14NO——13 接线圈 A2，14 去端子排 7。'],
  coil:['接触器 KM 的线圈（A1-A2）',
      '通电产生磁力吸合衔铁，带动主触点（接电动机那三对）和辅助触点 13/14 <b>一起</b>动作。图上所有标 KM 的触点，动作都由这一个线圈决定。<b>这块板上线圈接在最前面</b>：4 号熔断器直接进 A1。'],
  fr:['热继电器 FR 的动断触点（95-96）',
      '主电路里的热元件受热弯曲，把这对触点顶开，电动机过载时这一下就把整个控制回路断了。用动断是<b>失效安全</b>：线断了、端子松了，效果和过载一样——设备停。<b>这块板上它接在回路末端</b>：5 号熔断器 → 95，96 → 端子排 12。'],
  l1:['电源 L1 侧','控制回路从 L1、L2 两相取电。这条竖线是 L1 侧，经 <b>4 号熔断器</b>进来，第一个碰到的就是线圈 A1。'],
  l2:['电源 L2 侧','回路的另一头经<b>热继电器和 5 号熔断器</b>回 L2。']
};

/* 每一段导线：id → [路径点, 有没有电流]。
   一律按「有没有电流」着色，不按「带不带电」——那样整张图上游永远是红的，
   反而看不出哪条支路在导通 */
function schemaSegs(){
  const s=S;
  return [
    /* 熔断器那四段用 13 不用 H：矩形是 26 高，画到 y±7 会被矩形的填充盖掉一截 */
    ['in-l1',  [[s.XL,s.yIn],[s.XL,s.yFu-13]],         function(r){return r.km;}],
    ['fu-coil',[[s.XL,s.yFu+13],[s.XL,s.yCoil-11]],    function(r){return r.km;}],
    ['coil-p', [[s.XL,s.yCoil+11],[s.XL,s.yP]],        function(r){return r.km;}],
    ['bus-top',[[s.XL,s.yP],[s.XC,s.yP]],              function(r){return r.km;}],
    ['a-up',   [[s.XL,s.yP],[s.XL,s.ySw-s.H]],         function(r){return r.a;}],
    ['a-dn',   [[s.XL,s.ySw+s.H],[s.XL,s.yQ]],         function(r){return r.a;}],
    ['b-up',   [[s.XB,s.yP],[s.XB,s.ySw-s.H]],         function(r){return r.b;}],
    ['b-dn',   [[s.XB,s.ySw+s.H],[s.XB,s.yQ]],         function(r){return r.b;}],
    ['c-up',   [[s.XC,s.yP],[s.XC,s.ySw-s.H]],         function(r){return r.c;}],
    ['c-mid',  [[s.XC,s.ySw+s.H],[s.XC,s.yC2-s.H]],    function(r){return r.c;}],
    ['c-dn',   [[s.XC,s.yC2+s.H],[s.XC,s.yQ]],         function(r){return r.c;}],
    ['bus-bot',[[s.XL,s.yQ],[s.XC,s.yQ]],              function(r){return r.km;}],
    ['q-stop', [[s.XL,s.yQ],[s.XL,s.ySb3-s.H]],        function(r){return r.km;}],
    ['stop-fr',[[s.XL,s.ySb3+s.H],[s.XL,s.yFr-s.H]],   function(r){return r.km;}],
    ['fr-bot', [[s.XL,s.yFr+s.H],[s.XL,s.yBot]],       function(r){return r.km;}],
    ['bot',    [[s.XL,s.yBot],[s.XR,s.yBot]],          function(r){return r.km;}],
    ['r-up',   [[s.XR,s.yBot],[s.XR,s.yFu+13]],        function(r){return r.km;}],
    ['r-in',   [[s.XR,s.yFu-13],[s.XR,s.yIn]],         function(r){return r.km;}]
  ];
}
let SEG_FN = {};

/* 一个触点：动臂按开合换角度；动断多画一条静触点横杠。
   引脚不用画——导线段已经画到 y±7 了 */
function drawContact(g, key, x, y, kind){
  /* 静触点横杠也要跟着导通变红：它跟动臂一样是电流经过的地方，
     只让动臂变红的话，红线中间会卡一道黑杠 */
  if(kind==='nc') g.appendChild(el('line',{class:'sw', 'data-bar':key,
    x1:x-6, y1:y-7, x2:x+10, y2:y-7}));
  /* 动合触点画一个静触点小圆。闭合时动臂是竖直的，跟上下导线连成一条直线——
     不画这个点的话，屏幕上那一截就是根普通导线，看不出这儿有触点
     （KM 自锁触点吸合后整条支路成了一根直线，截图才发现） */
  else g.appendChild(el('circle',{class:'sdot', 'data-dot':key, cx:x, cy:y-7, r:2.6}));
  g.appendChild(el('path',{class:'sw', 'data-arm':key}));
}
/* 动臂的四种画法。动断闭合时一定要画成「斜着顶在横杠上」，
   不能画成竖直——竖直的话动臂跟上下引线连成一条直线，屏幕上就是一根线穿过一道横杠，
   完全看不出这儿有个触点（截图才发现）。动合闭合才是竖直的：那时它就是一段导线 */
function setArm(key, closed, live){
  const p = svg.querySelector('path[data-arm="'+key+'"]');
  if(!p) return;
  const m = ARM_POS[key];
  const x=m.x, y=m.y;
  let d;
  if(m.kind==='nc') d = closed ? 'M'+x+','+(y+7)+'L'+(x+8)+','+(y-7)
                               : 'M'+x+','+(y+7)+'L'+(x+15)+','+(y-11);
  else              d = closed ? 'M'+x+','+(y+7)+'L'+x+','+(y-7)
                               : 'M'+x+','+(y+7)+'L'+(x+13)+','+(y-9);
  p.setAttribute('d', d);
  /* 闭合且真有电流流过时，动臂本身就是导线的一部分，要跟着红。
     不这么做的话红色回路中间会夹一截黑的动臂，看着像那儿断了（截图看出来的） */
  p.classList.toggle('live', !!live);
  const bar = svg.querySelector('[data-bar="'+key+'"]');
  if(bar) bar.classList.toggle('live', !!live);
  const dot = svg.querySelector('[data-dot="'+key+'"]');
  if(dot) dot.classList.toggle('live', !!live);
}
const ARM_POS = {};

/* 可点的符号热区：一个透明矩形 + 一圈选中才显示的虚线环 */
function symBox(key, x, y, w, h){
  const g = el('g',{class:'sym', 'data-sym':key});
  g.appendChild(el('rect',{class:'sym-ring', x:x, y:y, width:w, height:h, rx:6,
    'stroke-dasharray':'4 3'}));
  const hit = el('rect',{class:'sym-hit', x:x, y:y, width:w, height:h});
  g.appendChild(hit);
  hit.addEventListener('click', function(){ pickSym(key); });
  return g;
}

function buildSchema(){
  [gDev, gWire, gTerm, gLegend].forEach(function(g){
    while(g.firstChild) g.removeChild(g.firstChild);
  });
  svg.setAttribute('viewBox','0 0 360 466');
  const s=S;
  SEG_FN = {};

  /* 导线（先画，压在符号下面） */
  schemaSegs().forEach(function(sg){
    const d = sg[1].map(function(p,i){ return (i?'L':'M')+p[0]+','+p[1]; }).join('');
    gWire.appendChild(el('path',{class:'swire', d:d, 'data-seg':sg[0]}));
    SEG_FN[sg[0]] = sg[2];
  });

  /* 节点黑点：三线汇合的地方都要打点。XL 上那两个（P、Q）也是三线汇合
     —— 上游下来、横线右去、支路自己下去，漏掉的话「这里是相通的」就没画出来 */
  [[s.XL,s.yP],[s.XB,s.yP],[s.XC,s.yP],
   [s.XL,s.yQ],[s.XB,s.yQ],[s.XC,s.yQ]].forEach(function(p){
    gDev.appendChild(el('circle',{cx:p[0], cy:p[1], r:3.2, fill:'var(--tx)'}));
  });

  /* 两只熔断器：矩形高度写死 26，别跟着 H 走（H 现在只有 7） */
  [s.XL, s.XR].forEach(function(x){
    gDev.appendChild(el('rect',{class:'sbox', x:x-7, y:s.yFu-13, width:14, height:26, rx:2}));
  });

  /* 触点：位置先记进 ARM_POS，setArm 才知道该把动臂画在哪 */
  /* 支路 C 上两个触点的顺序照他的接线：从公共点数下来先是 KM 13-14，再是点动的动断
     （X → 13NO → KM → 14NO → 端子排7 → 点动动断 → 端子排8 → Y） */
  ARM_POS.fr    = {x:s.XL, y:s.yFr,  kind:'nc'};
  ARM_POS.stop  = {x:s.XL, y:s.ySb3, kind:'nc'};
  ARM_POS.cont  = {x:s.XL, y:s.ySw,  kind:'no'};
  ARM_POS.jogno = {x:s.XB, y:s.ySw,  kind:'no'};
  ARM_POS.km    = {x:s.XC, y:s.ySw,  kind:'no'};
  ARM_POS.jognc = {x:s.XC, y:s.yC2,  kind:'nc'};
  drawContact(gDev,'fr',    s.XL, s.yFr,  'nc');
  drawContact(gDev,'stop',  s.XL, s.ySb3, 'nc');
  drawContact(gDev,'cont',  s.XL, s.ySw,  'no');
  drawContact(gDev,'jogno', s.XB, s.ySw,  'no');
  drawContact(gDev,'km',    s.XC, s.ySw,  'no');
  drawContact(gDev,'jognc', s.XC, s.yC2,  'nc');

  /* 按钮帽（E 形）＋ 推杆虚线。SB1 那条虚线要一路连到右支路的动断触点上——
     那是「同一个按钮」的唯一视觉证据，也是原图上最容易看漏的一笔 */
  function cap(x,y){
    gDev.appendChild(el('path',{class:'sw', d:'M'+x+','+(y-8)+'L'+(x-7)+','+(y-8)+
      'L'+(x-7)+','+(y+8)+'L'+x+','+(y+8)}));
  }
  cap(s.XL-26, s.ySb3);
  gDev.appendChild(el('path',{class:'sdash', d:'M'+(s.XL-26)+','+s.ySb3+'L'+(s.XL-2)+','+s.ySb3}));
  cap(s.XL-26, s.ySw);
  gDev.appendChild(el('path',{class:'sdash', d:'M'+(s.XL-26)+','+s.ySw+'L'+(s.XL-2)+','+s.ySw}));
  /* 点动按钮的联动虚线：它的动合在 (XB,ySw)、动断在 (XC,yC2)，不在同一高度，
     所以走 L 形折下来。这条线是「这两个触点属于同一个按钮」的唯一视觉证据 */
  cap(s.XB-30, s.ySw);
  gDev.appendChild(el('path',{class:'sdash',
    d:'M'+(s.XB-30)+','+s.ySw+'L'+215+','+s.ySw+'L'+215+','+s.yC2+'L'+(s.XC-2)+','+s.yC2}));

  /* 线圈 */
  gDev.appendChild(el('rect',{class:'sbox', x:s.XL-19, y:s.yCoil-11, width:38, height:22, rx:2}));

  /* 标注 */
  function lab(x,y,t,cls,anchor){
    const e=el('text',{class:cls||'slbl', x:x, y:y});
    if(anchor) e.setAttribute('text-anchor', anchor);
    e.textContent=t; gDev.appendChild(e); return e;
  }
  /* 标签一律让开各自的点击热区（热区半宽 17，标签起点取 +19 以上），
     不然选中时那圈虚线环会压在字上。
     每个触点都配一行小字写它在端子排上的位号 —— 这一屏和接线图对得上全靠这个 */
  lab(s.XL, s.yIn-6, 'L1', 'slbl-b', 'middle');
  lab(s.XR, s.yIn-6, 'L2', 'slbl-b', 'middle');
  lab(s.XL+19, s.yFu-1, 'FU2', 'slbl');
  lab(s.XL+19, s.yFu+11, '4号', 'snote');
  lab(s.XR+19, s.yFu-1, 'FU2', 'slbl');
  lab(s.XR+19, s.yFu+11, '5号', 'snote');
  lab(s.XL+28, s.yCoil+1, 'KM 线圈', 'slbl-b');
  lab(s.XL+28, s.yCoil+13, 'A1-A2', 'snote');
  lab(s.XL-38, s.ySw+1,  '连续', 'slbl-b', 'end');
  lab(s.XL-38, s.ySw+13, '1、2', 'snote', 'end');
  lab(s.XB-38, s.ySw+1,  '点动', 'slbl-b', 'end');
  lab(s.XB-38, s.ySw+13, '5、6', 'snote', 'end');
  lab(s.XC+22, s.ySw+1,  'KM', 'slbl-b');
  lab(s.XC+22, s.ySw+13, '13-14', 'snote');
  lab(s.XC+22, s.yC2+1,  '点动', 'slbl-b');
  lab(s.XC+22, s.yC2+13, '7、8', 'snote');
  lab(s.XL-38, s.ySb3+1,  '停止', 'slbl-b', 'end');
  lab(s.XL-38, s.ySb3+13, '11、12', 'snote', 'end');
  lab(s.XL-34, s.yFr+1,  'FR', 'slbl-b', 'end');
  lab(s.XL-34, s.yFr+13, '95-96', 'snote', 'end');

  /* 可点热区（画最上面，别被导线挡掉）。两只熔断器同一个 key，
     点哪只都亮同一段说明——它们本来就是一回事 */
  gTerm.appendChild(symBox('l1',   s.XL-14, s.yIn-14, 28, 30));
  gTerm.appendChild(symBox('l2',   s.XR-14, s.yIn-14, 28, 30));
  gTerm.appendChild(symBox('fu',   s.XL-14, s.yFu-18, 28, 36));
  gTerm.appendChild(symBox('fu',   s.XR-14, s.yFu-18, 28, 36));
  gTerm.appendChild(symBox('coil', s.XL-22, s.yCoil-14, 44, 28));
  gTerm.appendChild(symBox('cont', s.XL-36, s.ySw-18, 54, 36));
  gTerm.appendChild(symBox('jogno',s.XB-38, s.ySw-18, 56, 36));
  gTerm.appendChild(symBox('km',   s.XC-16, s.ySw-18, 34, 36));
  gTerm.appendChild(symBox('jognc',s.XC-16, s.yC2-18, 34, 36));
  gTerm.appendChild(symBox('stop', s.XL-36, s.ySb3-18, 54, 36));
  gTerm.appendChild(symBox('fr',   s.XL-16, s.yFr-18, 34, 36));
}

function pickSym(key){
  symSel = (symSel===key) ? null : key;
  svg.querySelectorAll('.sym').forEach(function(g){
    g.classList.toggle('sel', g.dataset.sym===symSel);
  });
  const side = document.getElementById('side');
  if(!symSel){
    side.innerHTML = '<span class="empty">点原理图上任一个符号，看它是什么、为什么这么画。</span>';
    return;
  }
  const d = SYM_DESC[symSel];
  side.innerHTML = '<b>'+d[0]+'</b><br><span style="color:var(--tx2)">'+d[1]+'</span>';
}

function renderSchema(){
  const r = solve();
  svg.querySelectorAll('path.swire[data-seg]').forEach(function(p){
    const fn = SEG_FN[p.getAttribute('data-seg')];
    p.classList.toggle('live', fn ? !!fn(r) : false);
  });
  setArm('fr',    SW.fr,     r.km);
  setArm('stop',  SW.stopnc, r.km);
  setArm('cont',  SW.contno, r.a);
  setArm('jogno', SW.jogno,  r.b);
  setArm('km',    r.km,      r.c); /* 自锁触点跟着线圈动，这是「自锁」看得见的那一下 */
  setArm('jognc', SW.jognc,  r.c);

  /* 状态条：说清楚「现在靠哪条支路撑着」——松手之后那句话才是这一屏的全部价值 */
  let why;
  if(!SW.stopnc)     why = '停止按钮把整条回路断开了，三条支路一起没电。';
  else if(r.a && r.c)why = '电流走<b>连续</b>那条支路，同时 KM 的 13/14 已经闭合。<b>现在松手也不会停</b>。';
  else if(r.a)       why = '电流走<b>连续</b>那条支路（端子排 1、2）。';
  else if(r.b)       why = '电流走<b>点动</b>的动合触点（端子排 5、6）。注意右边那条自锁支路：' +
                           '<b>点动按钮的动断（7、8）已经被按开了</b>，锁不上——松手就停。';
  else if(r.c)       why = '按钮都松开了，电流走的是<b>自锁支路</b>：KM 13-14（线圈得电时闭合）→ ' +
                           '点动的动断（没按，闭合）。线圈自己把自己的电锁住了。';
  else if(SW.jognc===false) why = '松手瞬间：点动的动合先断开，线圈失电；此时它的动断还没恢复，' +
                           '自锁那条路也是断的。<b>这零点几秒的空档就是点动能停下来的原因。</b>';
  else               why = '三条支路都不通，线圈失电。按住「连续」或「点动」试试。';

  const box = document.getElementById('schemaState');
  box.className = 'srun ' + (r.km ? 'on' : 'off');
  box.innerHTML = '<div class="st">'+(r.km
      ? 'KM 线圈得电 → 主触点闭合 · 电动机转'
      : 'KM 线圈失电 · 电动机停')+'</div><div class="why">'+why+'</div>';
}

/* 按住 / 松手。复合按钮 SB1 的两对触点必须错开动作：
   按下＝动断先断、动合后合；松开＝动合先断、动断后合。
   写成同时动作的话，松手那一刻动断已经恢复、KM 又没来得及释放，
   自锁会当场接上——点动就变成连续了，整屏白做（11.6 那节同一个坑） */
function pressSB(which, down){
  if(swTimer){ clearTimeout(swTimer); swTimer=null; }
  if(which==='stop'){ SW.stopnc = !down; renderSchema(); return; }
  if(which==='cont'){ SW.contno = down;  renderSchema(); return; }
  /* 点动是复合按钮：按下＝动断先断、动合后合；松开＝动合先断、动断后合 */
  if(down){
    SW.jognc = false; renderSchema();
    swTimer = setTimeout(function(){ SW.jogno = true;  renderSchema(); }, SW_DELAY);
  } else {
    SW.jogno = false; renderSchema();
    swTimer = setTimeout(function(){ SW.jognc = true;  renderSchema(); }, SW_DELAY);
  }
}
function resetSchema(){
  if(swTimer){ clearTimeout(swTimer); swTimer=null; }
  SW.contno=false; SW.jogno=false; SW.jognc=true; SW.stopnc=true; SW.fr=true;
  kmOn=false; symSel=null;
  document.querySelectorAll('.sbtns button').forEach(function(b){ b.classList.remove('down'); });
}

(function(){
  document.querySelectorAll('.sbtns button').forEach(function(b){
    const k=b.dataset.sb;
    function down(e){ e.preventDefault(); b.classList.add('down');    pressSB(k,true);  }
    function up(e){   e.preventDefault(); b.classList.remove('down'); pressSB(k,false); }
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    /* 手指划出按钮范围也算松手，否则会卡在「一直按着」 */
    b.addEventListener('pointerleave', function(e){ if(b.classList.contains('down')) up(e); });
    b.addEventListener('pointercancel', up);
    b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  });
})();

/* ------------------------------------------------------------------
   状态与三种模式
------------------------------------------------------------------ */
const state = { mode:'browse', activeGroup:null, hoverTerm:null, schemaShown:false,
  step:{index:0, playing:false, timer:null},
  test:{order:[], idx:0, score:0, answers:[], awaiting:false, mistakes:[]} };

function setHint(gid){
  const g = GROUPS.find(function(x){ return x.id===gid; });
  document.getElementById('hintText').textContent = g ? ('第'+g.id+'组「'+g.name+'」：'+g.hint) : '点一个分组，看这组怎么记。';
}

/* ---- 浏览模式：分组高亮 + 悬停端子 ---- */
function renderBrowse(){
  const paths = gWire.querySelectorAll('path.wire');
  paths.forEach(function(p){
    const g = +p.getAttribute('data-group');
    const dim = state.hoverTerm ? true : (state.activeGroup!==null && g!==state.activeGroup);
    p.classList.toggle('dim', !!dim);
    p.classList.remove('hi');
  });
  if(state.hoverTerm){
    const id = state.hoverTerm;
    WIRES.forEach(function(w){
      if(w.from===id || w.to===id) wirePath(w.id).classList.remove('dim');
      wirePath(w.id).classList.toggle('hi', w.from===id || w.to===id);
    });
    const list = WIRES.filter(function(w){ return w.from===id||w.to===id; });
    const side = document.getElementById('side');
    side.innerHTML = '<b>'+(TLABEL[id]||id)+'</b> 接了 '+list.length+' 根：<br>'+
      list.map(function(w){ return '·　第 '+w.id+' 根　'+otherEndText(w, id); }).join('<br>');
  } else {
    document.getElementById('side').innerHTML =
      '<span class="empty">悬停任意端子，看它接了几根线；点击左侧分组，只看这一组的走线。</span>';
  }
}
function onTermHover(id){
  if(state.mode!=='browse') return;
  state.hoverTerm=id; renderBrowse();
}
function setGroup(gid){
  state.activeGroup = (state.activeGroup===gid) ? null : gid;
  document.querySelectorAll('.grpbtn').forEach(function(b){
    b.classList.toggle('on', +b.dataset.g===state.activeGroup);
  });
  setHint(state.activeGroup);
  renderBrowse();
}

/* ---- 逐根播放 ---- */
function renderStep(){
  const idx = state.step.index; // 0..14，已经画出的根数
  WIRES.forEach(function(w){
    const p=wirePath(w.id);
    p.classList.remove('dim');
    if(w.id<=idx){ p.style.opacity=1; p.classList.toggle('hi', w.id===idx); }
    else { p.style.opacity=0; p.classList.remove('hi'); }
  });
  const cur = document.getElementById('pCur');
  if(idx===0){ cur.innerHTML='点击「下一根」开始'; }
  else{
    const w=WIRES[idx-1];
    let html = '<b>'+idx+'.</b> '+wireDesc(w)+'　（第 '+w.group+' 组：'+GROUPS[w.group-1].name+'）';
    /* 某一端如果还挂着别的线，提醒「两个冷压端子一起压上再拧」，别拧一次松一次 */
    ['from','to'].forEach(function(end){
      const tid = w[end];
      if(TCOUNT[tid] > 1){
        WIRES.filter(function(o){ return o.id!==w.id && (o.from===tid || o.to===tid); })
          .forEach(function(o){
            html += '<span class="warnline">⚠ '+tid+' 还有第 '+o.id+' 根线，两个端子一起压上再拧螺丝</span>';
          });
      }
    });
    cur.innerHTML = html;
    setHint(w.group);
  }
  document.getElementById('pPrev').disabled = idx===0;
  document.getElementById('pNext').disabled = idx===WIRES.length;
}
function stepNext(){ if(state.step.index<WIRES.length){ state.step.index++; renderStep(); } else stepStopAuto(); }
function stepPrev(){ if(state.step.index>0){ state.step.index--; renderStep(); } }
function stepReset(){ state.step.index=0; stepStopAuto(); renderStep(); }
function stepStopAuto(){
  state.step.playing=false;
  if(state.step.timer){ clearInterval(state.step.timer); state.step.timer=null; }
  document.getElementById('pAuto').textContent='▶ 自动播放';
}
function stepToggleAuto(){
  if(state.step.playing){ stepStopAuto(); return; }
  state.step.playing=true;
  document.getElementById('pAuto').textContent='⏸ 暂停';
  state.step.timer=setInterval(function(){
    if(state.step.index>=WIRES.length){ stepStopAuto(); return; }
    stepNext();
  }, 1200);
}

/* ---- 自测模式 ---- */
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function startTest(order){
  state.test = { order: (order && order.length) ? order.slice() : shuffled(WIRES.map(function(w){return w.id;})),
    idx:0, score:0, answers:[], awaiting:true, mistakes:[] };
  WIRES.forEach(function(w){ wirePath(w.id).style.opacity=0; wirePath(w.id).classList.remove('dim','hi'); });
  renderTest();
}
function currentTestWire(){
  const t=state.test;
  if(t.idx>=t.order.length) return null;
  return WIRES.find(function(w){ return w.id===t.order[t.idx]; });
}
function renderTest(){
  const t=state.test;
  const head=document.getElementById('testHead');
  document.querySelectorAll('.term-dot').forEach(function(d){ d.classList.remove('wrong','right','hi'); });

  if(t.idx>=t.order.length){
    const wrong = t.mistakes;
    head.innerHTML =
      '<div class="result"><div>做完啦，共 '+t.order.length+' 题</div>'+
      '<div class="big">'+t.score+' / '+t.order.length+'</div>'+
      (wrong.length ? ('<table>'+wrong.map(function(m){
          const w=WIRES.find(function(x){return x.id===m;});
          return '<tr><td>第 '+w.id+' 根</td><td>'+wireDesc(w)+'</td></tr>';
        }).join('')+'</table>')
        : '<div style="margin-top:8px;color:#1e6b2e">全对，'+WIRES.length+' 根都记住了</div>') +
      '<div class="redo">'+
        (wrong.length ? '<button class="pri" id="redoWrong">只重做错题（'+wrong.length+'）</button>' : '') +
        '<button id="redoAll">重新开始（'+WIRES.length+' 题全做）</button>'+
      '</div></div>';
    document.getElementById('redoAll').addEventListener('click', function(){ startTest(); });
    if(wrong.length) document.getElementById('redoWrong').addEventListener('click', function(){ startTest(wrong); });
    document.getElementById('side').innerHTML = '<span class="empty">自测结束，点上面按钮重来。</span>';
    return;
  }

  const w = currentTestWire();
  head.innerHTML =
    '<div class="qcard"><div class="qn">第 '+(t.idx+1)+' / '+t.order.length+' 题　<span class="score">已答对 '+t.score+'</span></div>'+
    '<div class="qt">第 '+w.id+' 根：<b>'+TLABEL[w.from]+'</b> 接到哪里？</div>'+
    '<div id="qFeedback"></div></div>';
}
function answerAttempt(termId){
  const t=state.test;
  if(!t.awaiting) return;
  const w=currentTestWire();
  if(!w) return;
  t.awaiting=false;
  const dot = document.querySelector('circle[data-term-dot="'+termId+'"]');
  const ok = termId===w.to;
  if(ok){ t.score++; if(dot) dot.classList.add('right'); }
  else { t.mistakes.push(w.id); if(dot) dot.classList.add('wrong'); }
  t.answers.push({wireId:w.id, picked:termId, ok:ok});
  wirePath(w.id).style.opacity=1;
  const fb=document.getElementById('qFeedback');
  if(fb){
    fb.innerHTML = '<div class="fb '+(ok?'right':'wrong')+'">'+
      (ok ? '✓ 对了：' : '✗ 不对，正确答案是：')+TLABEL[w.to]+
      '<span class="hint">记法（第 '+w.group+' 组）：'+GROUPS[w.group-1].hint+'</span></div>'+
      '<button class="next" id="qNext">下一题 ›</button>';
    document.getElementById('qNext').addEventListener('click', testNext);
  }
  setHint(w.group);
}
function testNext(){
  state.test.idx++;
  state.test.awaiting=true;
  renderTest();
}
function onTermClick(id){
  if(state.mode!=='test') return;
  answerAttempt(id);
}

/* ---- 上螺丝顺序：按端子把 wires 合并成「一次拧螺丝能干完的动作」 ---- */
function renderScrew(){
  const steps = buildScrewSteps(CURRENT_CIRCUIT);
  const head = document.getElementById('screwHead');
  head.innerHTML = '<div class="qcard"><div class="qt">共 '+steps.length+' 步，按接线顺序排</div></div>' +
    steps.map(function(s,i){
      const label = TLABEL[s.terminal]+'（'+s.terminal+'）';
      const header = s.count>=2 ? label+'　——　同时压 '+s.count+' 个端子' : label+'　——　单独接';
      const lines = s.items.map(function(w){
        return '·　第 '+w.id+' 根　'+otherEndText(w, s.terminal);
      }).join('<br>');
      return '<div class="qcard"><div class="qn">步骤 '+(i+1)+' / '+steps.length+'</div>'+
        '<div class="qt">'+header+'</div>'+
        '<div style="margin-top:6px;color:var(--tx2);font-size:.82rem;line-height:1.6">'+lines+'</div></div>';
    }).join('');
}

/* ------------------------------------------------------------------
   模式切换 / UI 绑定
------------------------------------------------------------------ */
function setMode(m){
  state.mode=m;
  document.querySelectorAll('.modes button').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===m); });
  const wantSchema = (m==='schema');
  document.getElementById('schemaBar').style.display = wantSchema ? 'block' : 'none';
  document.getElementById('browseBar').style.display = m==='browse' ? 'flex' : 'none';
  document.getElementById('playBar').style.display   = m==='step' ? 'flex' : 'none';
  /* 上螺丝顺序是一长列步骤（K31 有 16 步），吸底的记法条会浮在列表中间盖住两三步；
     而这个模式本来也不显示分组记法，直接收起来。原理图那屏有自己的状态条，也不用它 */
  document.getElementById('hintbar').style.display = (m==='screw'||wantSchema) ? 'none' : 'block';
  document.getElementById('testHead').innerHTML = '';
  document.getElementById('screwHead').innerHTML = '';

  /* 两张图共用同一个 <svg>，只在「要换另一张」时才重建 */
  if(wantSchema !== state.schemaShown){
    if(wantSchema){ resetSchema(); buildSchema(); }
    else buildScene();
    state.schemaShown = wantSchema;
  }

  if(wantSchema){
    document.getElementById('side').innerHTML =
      '<span class="empty">点原理图上任一个符号，看它是什么、为什么这么画。</span>';
    resetSchema();
    renderSchema();
    return;      /* 下面全是接线图那套，原理图一概不走 */
  }

  document.getElementById('side').innerHTML = '<span class="empty">悬停任意端子，看它接了几根线；点击左侧分组，只看这一组的走线。</span>';
  WIRES.forEach(function(w){ const p=wirePath(w.id); if(p){ p.style.opacity=1; p.classList.remove('dim','hi'); } });
  document.querySelectorAll('.term-dot').forEach(function(d){ d.classList.remove('wrong','right','hi'); });
  state.activeGroup=null; state.hoverTerm=null;
  document.querySelectorAll('.grpbtn').forEach(function(b){ b.classList.remove('on'); });
  setHint(null);
  if(m==='step'){ state.step.index=0; stepStopAuto(); renderStep(); }
  if(m==='test'){ startTest(); }
  if(m==='browse'){ renderBrowse(); }
  if(m==='screw'){ renderScrew(); }
}

/* 分组按钮跟着电路重建：两块板的组数和颜色都不一样，
   留着上一块板的按钮会点出 undefined 的组 */
function buildGroupBtns(){
  const grpBtnsEl = document.getElementById('grpBtns');
  grpBtnsEl.innerHTML='';
  GROUPS.forEach(function(g){
    const btn=document.createElement('button');
    btn.className='grpbtn'; btn.dataset.g=g.id;
    btn.innerHTML='<span class="dot" style="background:'+GCOLOR_HEX[g.id]+'"></span>'+g.id+'. '+g.name;
    btn.addEventListener('click', function(){ setGroup(g.id); });
    grpBtnsEl.appendChild(btn);
  });
}

/* ---- 换电路：活动引用整组换掉，再把画面和按钮全部重建 ---- */
function loadCircuit(id){
  if(!CIRCUITS[id]) return;
  stepStopAuto();
  CUR = CIRCUITS[id];
  CURRENT_CIRCUIT = id;
  DEVICES = CUR.devices; WIRES = CUR.wires; GROUPS = CUR.groups;
  TPOS = CUR.tpos; TLABEL = CUR.labels; GCOLOR_HEX = CUR.colors;
  TCOUNT = getTerminalWireCount(id);      /* 每次重算，别沿用上一块板的 */
  document.getElementById('pgTitle').textContent = CUR.title;
  document.getElementById('pgSub').textContent   = CUR.sub;
  document.getElementById('warnBox').innerHTML =
    CUR.warns.map(function(w){ return '<div class="warn">'+w+'</div>'; }).join('');
  document.querySelectorAll('#circuitBtns button').forEach(function(b){
    b.classList.toggle('on', b.dataset.c===id);
  });
  /* 原理图目前只画了 K31 那一张；K32 的原理图是正反转，还没做，
     与其留一颗点了没反应的按钮，不如整个藏掉 */
  const sBtn = document.querySelector('.modes button[data-mode="schema"]');
  if(sBtn) sBtn.style.display = CUR.hasSchema ? '' : 'none';
  state.schemaShown = false;
  buildScene();
  buildGroupBtns();
  setMode('browse');
}

(function(){
  const box = document.getElementById('circuitBtns');
  CIRCUIT_ORDER.forEach(function(id){
    const c = CIRCUITS[id];
    const btn = document.createElement('button');
    btn.dataset.c = id;
    btn.innerHTML = '<span class="k">'+c.k+'　'+c.wires.length+' 根</span>'+c.name;
    btn.addEventListener('click', function(){ loadCircuit(id); });
    box.appendChild(btn);
  });
})();

document.querySelectorAll('.modes button').forEach(function(b){
  b.addEventListener('click', function(){ setMode(b.dataset.mode); });
});
document.getElementById('labelChk').addEventListener('change', function(e){
  svg.classList.toggle('hide-labels', !e.target.checked);
});
document.getElementById('pPrev').addEventListener('click', stepPrev);
document.getElementById('pNext').addEventListener('click', stepNext);
document.getElementById('pAuto').addEventListener('click', stepToggleAuto);
document.getElementById('pReset').addEventListener('click', stepReset);

loadCircuit('k31');

/* 供 jsdom 自测脚本用的最小调试接口，不影响正常使用。
   这几项必须走 getter：换电路时 DEVICES/WIRES… 会被整组重新赋值，
   写成 DEVICES:DEVICES 的话拿到的永远是页面初始化那一刻的旧数组 */
window.__MRW = {
  get DEVICES(){ return DEVICES; },
  get WIRES(){ return WIRES; },
  get GROUPS(){ return GROUPS; },
  get TPOS(){ return TPOS; },
  get TLABEL(){ return TLABEL; },
  get CURRENT_CIRCUIT(){ return CURRENT_CIRCUIT; },
  CIRCUITS: CIRCUITS, CIRCUIT_ORDER: CIRCUIT_ORDER,
  getTerminalWireCount: getTerminalWireCount, buildScrewSteps: buildScrewSteps,
  loadCircuit: loadCircuit,
  setMode: setMode, setGroup: setGroup,
  startTest: startTest, answer: answerAttempt,
  getState: function(){ return state; },
  wirePathEl: wirePath
};

})();
</script>
