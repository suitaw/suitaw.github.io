<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三相电让电动机转</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#d7dde3; --tx:#232a32; --tx2:#5b6570; --tx3:#8b96a1;
  --acc:#1a6fd4; --accbg:#e8f1fc; --wire:#2b3036;
  --L1:#e0b000; --L2:#2f9e44; --L3:#d62828;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{padding-bottom:30px}
.wrap{max-width:720px;margin:0 auto;padding:10px 12px 0}
.top{display:flex;align-items:center;gap:8px;padding:4px 2px 6px}
.top h1{font-size:1.05rem;margin:0;flex:1 1 auto;line-height:1.35}
.top a{font-size:.76rem;color:var(--tx3);text-decoration:none;border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;white-space:nowrap;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.card p{margin:4px 0;font-size:.86rem;line-height:1.65;color:var(--tx2)}
.card b{color:var(--tx)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.modes button,.ctl button{border:1px solid var(--line);background:var(--card);color:var(--tx2);border-radius:9px;
  padding:7px 4px;font-size:.84rem;font-weight:600;line-height:1.3;font-family:inherit}
.modes button span{display:block;font-size:.66rem;font-weight:400;color:var(--tx3)}
.modes button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.modes button.on span{color:inherit}
svg{display:block;width:100%;height:auto}
#mot{max-width:340px;margin:0 auto}
.now{text-align:center;font-size:.92rem;font-weight:600;min-height:1.5em;margin:2px 0 4px}
.ctl{display:flex;gap:6px;justify-content:center;margin:4px 0 2px}
.ctl button{padding:5px 14px;font-weight:400}
.ctl button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.say{font-size:.86rem;line-height:1.7;color:var(--tx2);margin:6px 2px 0}
.say b{color:var(--tx)}
h2{font-size:.9rem;margin:2px 0 4px}
.lab{font-size:9px;font-weight:700}
.sm{font-size:7.5px;fill:var(--tx3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>三相电为什么能让电动机转</h1>
    <a href="schema-to-wire.html#zf">正反转板 ›</a>
  </div>

  <div class="card">
    <p>电动机外圈有三组线圈，分别接 <b style="color:var(--L1)">L1</b>、<b style="color:var(--L2)">L2</b>、<b style="color:var(--L3)">L3</b> 三根火线。哪组线圈电流大，那一块就<b>亮</b>（磁性最强）。看<b>亮的那块</b>怎么走，中间的转子就跟着怎么走。</p>
  </div>

  <div class="modes" id="modes">
    <button class="on" data-m="0">三根火线<span>L1→L2→L3</span></button>
    <button data-m="1">对调 L1、L3<span>反转</span></button>
    <button data-m="2">只接两根<span>L1、L2</span></button>
  </div>

  <div class="card">
    <svg id="mot" viewBox="0 0 300 300"></svg>
    <div class="now" id="now"></div>
    <div class="ctl">
      <button id="pause">⏸ 暂停</button>
      <button id="slow">🐢 慢放</button>
    </div>
    <div class="say" id="say"></div>
  </div>

  <div class="card">
    <h2><span id="wt">三根火线的电压</span> <small style="font-weight:400;color:var(--tx3);font-size:.72rem">竖线 = 现在</small></h2>
    <svg id="wave" viewBox="0 0 320 120"></svg>
    <p id="wsay"></p>
  </div>

  <div class="card">
    <p><b>记住两句：</b></p>
    <p>① 电动机要自己转，得<b>三根火线</b>轮流推。</p>
    <p>② 对调其中两根，轮流的顺序反过来，电动机就<b>反转</b>。正反转电路里，KM2 主触点就是把 L1、L3 对调接上。</p>
    <p style="color:var(--tx3);font-size:.76rem">真实的电流每秒来回 50 次，磁场每秒转 50 圈；这里放慢了很多倍，好让眼睛跟得上。</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const COL = ['var(--L1)', 'var(--L2)', 'var(--L3)'];
const NAME = ['L1', 'L2', 'L3'];
const CX = 150, CY = 150, R = 112;
// 三个线圈的位置（度，0=右，逆时针为正）：上、右下、左下
const POS = [90, -30, 210];
const rad = d => d * Math.PI / 180;

let mode = 0, paused = false, slow = false;
let t = 0, rotA = 90, rotV = 0, last = 0, fieldA = 90;

// mode 0：线圈 k 接 L(k+1)；mode 1：上、左下两个线圈对调（接 L3 / L1）；mode 2：只接 L1、L2，同一股电流
const FEED = [[0, 1, 2], [2, 1, 0], [0, 1, -1]];
function volt(w, ph){ return Math.cos(ph - w * 2 * Math.PI / 3); }
function coilI(k, ph){
  const f = FEED[mode][k];
  if(f < 0) return 0;
  if(mode === 2) return (k === 0 ? 1 : -1) * Math.cos(ph);   // 从 L1 进、从 L2 出
  return volt(f, ph);
}

function pole(ang, s, col, lab, main){
  const a = rad(ang), x = CX + Math.cos(a) * R, y = CY - Math.sin(a) * R;
  const lx = CX + Math.cos(a) * (R + 22), ly = CY - Math.sin(a) * (R + 22);
  const op = Math.max(0, s);
  return '<g transform="rotate(' + (-ang + 90) + ' ' + x + ' ' + y + ')">' +
    '<rect x="' + (x - 17) + '" y="' + (y - 9) + '" width="34" height="18" rx="4" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1"/>' +
    '<rect x="' + (x - 17) + '" y="' + (y - 9) + '" width="34" height="18" rx="4" fill="' + col + '" opacity="' + op.toFixed(2) + '"/></g>' +
    '<text class="' + (main ? 'lab' : 'sm') + '" x="' + lx + '" y="' + (ly + 3) + '" text-anchor="middle" fill="' + (main ? col : '') + '">' + lab + '</text>';
}

function draw(){
  const ph = t;
  let h = '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R + 11) + '" fill="none" stroke="#ced4da" stroke-width="3"/>';
  let bx = 0, by = 0;
  for(let k = 0; k < 3; k++){
    const f = FEED[mode][k], i = coilI(k, ph);
    const col = f < 0 ? '#ced4da' : COL[f], nm = f < 0 ? 'L3' : NAME[f];
    h += pole(POS[k], i, col, nm, true);
    if(f < 0) h += '<text class="sm" x="34" y="232" text-anchor="middle">没接</text>';
    bx += i * Math.cos(rad(POS[k])); by += i * Math.sin(rad(POS[k]));
  }
  // 磁场方向箭头
  const bl = Math.hypot(bx, by), ba = Math.atan2(by, bx) * 180 / Math.PI;
  fieldA = ba;
  // 转子
  const ra = rad(rotA), nx = Math.cos(ra), ny = -Math.sin(ra);
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="62" fill="#e9ecef" stroke="#868e96" stroke-width="1.2"/>';
  h += '<polygon points="' + (CX + nx * 52) + ',' + (CY + ny * 52) + ' ' + (CX - ny * 10) + ',' + (CY + nx * 10) + ' ' + (CX + ny * 10) + ',' + (CY - nx * 10) + '" fill="#c92a2a"/>';
  h += '<polygon points="' + (CX - nx * 52) + ',' + (CY - ny * 52) + ' ' + (CX - ny * 10) + ',' + (CY + nx * 10) + ' ' + (CX + ny * 10) + ',' + (CY - nx * 10) + '" fill="#868e96"/>';
  h += '<circle cx="' + CX + '" cy="' + CY + '" r="5" fill="#fff" stroke="#495057"/>';
  h += '<text class="sm" x="' + CX + '" y="' + (CY + 76) + '" text-anchor="middle">转子</text>';
  $('mot').innerHTML = h;

  // 现在谁最高
  if(mode === 2){
    const c = Math.cos(ph);
    $('now').innerHTML = Math.abs(c) < .3 ? '电流正在换方向……' : (c > 0 ? '电流：L1 进 → L2 出' : '电流：L2 进 → L1 出');
  }else{
    let m = 0; for(let w = 1; w < 3; w++) if(volt(w, ph) > volt(m, ph)) m = w;
    $('now').innerHTML = '现在最高：<span style="color:' + COL[m] + '">' + NAME[m] + '</span>';
  }
  wave(ph);
}

function wave(ph){
  const X0 = 20, X1 = 312, YM = 58, A = 42, span = 4 * Math.PI;   // 两个来回
  const x0 = X1 - 60;                                               // “现在”画在偏右
  let h = '<line x1="' + X0 + '" y1="' + YM + '" x2="' + X1 + '" y2="' + YM + '" stroke="#dee2e6"/>';
  const show = mode === 2 ? [0] : [0, 1, 2];
  show.forEach(w => {
    let d = '';
    for(let x = X0; x <= X1; x += 3){
      const p = ph + (x - x0) / (X1 - X0) * span;
      const v = mode === 2 ? Math.cos(p) : volt(w, p);
      d += (d ? 'L' : 'M') + x + ',' + (YM - v * A).toFixed(1);
    }
    h += '<path d="' + d + '" fill="none" stroke="' + (mode === 2 ? 'var(--acc)' : COL[w]) + '" stroke-width="2"/>';
    const v0 = mode === 2 ? Math.cos(ph) : volt(w, ph);
    h += '<circle cx="' + x0 + '" cy="' + (YM - v0 * A) + '" r="4" fill="' + (mode === 2 ? 'var(--acc)' : COL[w]) + '" stroke="#fff"/>';
  });
  h += '<line x1="' + x0 + '" y1="8" x2="' + x0 + '" y2="108" stroke="#495057" stroke-width="1"/>';
  h += '<text class="sm" x="' + (x0 + 4) + '" y="116">现在</text><text class="sm" x="' + X0 + '" y="116">更早</text>';
  h += '<text class="sm" x="4" y="' + (YM - A + 3) + '">高</text><text class="sm" x="4" y="' + (YM + A + 3) + '">低</text>';
  $('wave').innerHTML = h;
}

const SAY = [
  '三根火线<b>一个接一个</b>到最高：L1 → L2 → L3 → L1……亮的那块就<b>绕着圈走</b>，红针（转子）被它拖着一起转。<br>就像三个人围着转盘<b>轮流推</b>。',
  '把 L1 和 L3 <b>对调</b>：最上面那组线圈现在接的是 L3。轮流的顺序变成 L3 → L2 → L1，亮的那块<b>倒着走</b>，转子跟着<b>反转</b>。<br>正反转电路里，KM2 干的就是这件事。',
  '只接 L1、L2 两根：电流从一根进、另一根出，<b>是同一股电流</b>，只会忽正忽负。亮的那块只在<b>两个位置之间来回跳</b>，不绕圈 —— 转子只会抖，<b>转不起来</b>。<br>就像两个人面对面推，转盘只会晃。'
];
const WSAY = [
  '三条线的山峰<b>一个接一个</b>经过竖线：黄（L1）→ 绿（L2）→ 红（L3）。这个先后顺序，就是磁场转圈的原因。',
  '电源那头的三根线没变，变的是<b>接到电动机上的位置</b>：上面线圈接到了 L3、左下接到了 L1，所以在电动机里看，轮流的顺序反过来了。',
  '两根火线之间只有<b>一条</b>电压曲线，只有高低、没有「谁先谁后」，排不出转圈的顺序。（K32 控制线圈就是接两根火线，它只要吸合，不用转，所以够用。）'
];

function setMode(m){
  mode = m;
  $('modes').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.m === m));
  $('wt').textContent = m === 2 ? 'L1、L2 之间的电压' : '三根火线的电压';
  $('say').innerHTML = SAY[m]; $('wsay').innerHTML = WSAY[m];
  draw();
}
$('modes').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setMode(+b.dataset.m); });
$('pause').addEventListener('click', () => { paused = !paused; $('pause').textContent = paused ? '▶ 继续' : '⏸ 暂停'; $('pause').classList.toggle('on', paused); });
$('slow').addEventListener('click', () => { slow = !slow; $('slow').classList.toggle('on', slow); });

function frame(ts){
  const dt = last ? Math.min(.05, (ts - last) / 1000) : 0; last = ts;
  if(!paused){
    const w = 2 * Math.PI / (slow ? 8 : 3.5);       // 一个来回 3.5 秒（慢放 8 秒）
    t += w * dt;
    // 磁场角速度：三相正序顺时针、对调逆时针、单相 0
    const fw = mode === 0 ? -w : mode === 1 ? w : 0;
    const fwd = fw * 180 / Math.PI;
    if(mode < 2){
      // 红针被亮的那块拖着走，落后 15°
      const d = ((fieldA - Math.sign(fwd) * 15 - rotA) % 360 + 540) % 360 - 180;
      rotV += (6 * d + 2.5 * (fwd - rotV)) * dt;
    }else{
      rotV -= rotV * Math.min(1, dt * 2.5);
      if(Math.abs(rotV) < 3) rotA += Math.cos(t) * 25 * dt;   // 只会抖
    }
    rotA += rotV * dt;
  }
  draw();
  requestAnimationFrame(frame);
}
setMode(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
