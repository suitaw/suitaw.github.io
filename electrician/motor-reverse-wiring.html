<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>正反转控制电路 · 实物接线图</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#d7dde3; --tx:#232a32; --tx2:#5b6570; --tx3:#8b96a1;
  --acc:#1a6fd4; --accbg:#e8f1fc;
  --red:#c0392b; --green:#2f9e44; --blue:#2b6cb0; --orange:#e67e22;
  --redbg:#fbe9e7; --greenbg:#e8f7ea; --bluebg:#e9f0f8; --orangebg:#fdf1e3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:12px 12px 0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 2px 10px}
.top h1{font-size:1.05rem;margin:0;flex:1 1 auto;line-height:1.35}
.top .back{font-size:.78rem;color:var(--tx3);text-decoration:none;border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;white-space:nowrap}
.sub{width:100%;font-size:.76rem;color:var(--tx3);margin-top:2px}

.modes{display:flex;gap:6px;margin-bottom:8px}
.modes button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:9px;padding:9px 6px;font-size:.82rem;font-weight:600}
.modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}

.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.grpbtns{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;padding-bottom:2px}
.grpbtn{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);border-radius:8px;padding:7px 10px;font-size:.76rem;white-space:nowrap}
.grpbtn .dot{width:9px;height:9px;border-radius:50%;flex:none}
.grpbtn.on{border-color:var(--acc);background:var(--accbg);color:var(--acc);font-weight:700}
.chk{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--tx2);white-space:nowrap;
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card)}

.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}

.term-hit{fill:transparent;cursor:pointer}
.term-dot,.tlabel,.badge-c,.badge-t{pointer-events:none}
.term-dot{fill:#fff;stroke:#333;stroke-width:1.6}
.term-dot.hi{stroke:var(--acc);stroke-width:2.4}
.term-dot.wrong{fill:var(--red);stroke:var(--red)}
.term-dot.right{fill:var(--green);stroke:var(--green)}
.tlabel{font-size:9.5px;fill:var(--tx2);font-family:ui-monospace,Menlo,Consolas,monospace}
.badge-c{fill:#fff;stroke:var(--tx2);stroke-width:1}
.badge-t{font-size:8px;fill:var(--tx2);text-anchor:middle;dominant-baseline:middle;font-weight:700}
.hide-labels .tlabel{display:none}

.dev-box{fill:#eef1f4;stroke:#98a3ad;stroke-width:1.6}
.dev-km{fill:#5a6472;stroke:#2e343c}
.dev-name{font-size:11px;fill:var(--tx2);text-anchor:middle}
.dev-name-in{font-size:11px;fill:#eef1f4;text-anchor:middle;font-weight:700}
.dev-sub-in{font-size:8.5px;fill:#c4cad2;text-anchor:middle}
.tb-strip{fill:#e2e7eb;stroke:#98a3ad;stroke-width:1.6}
.aux-strip{fill:#4a525c}
.fuse-body{fill:#f6e7b0;stroke:#a98a2e;stroke-width:1.2}

.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:miter;
  transition:opacity .25s,stroke-width .2s}
.wire.dim{opacity:.15}
.wire.hi{stroke-width:4.4}

.legend rect{stroke:var(--line);stroke-width:1}
.legend text{font-size:10.5px;fill:var(--tx2)}
.legend .lt{font-size:10.5px;fill:var(--tx3);font-weight:700}

.side{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:.82rem;color:var(--tx2);min-height:20px;line-height:1.55}
.side b{color:var(--tx)}
.side .empty{color:var(--tx3)}

.playbar,.testbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.playbar button,.testbar button{border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:8px;padding:7px 11px;font-size:.8rem}
.playbar button:disabled{opacity:.4}
.playbar .cur{flex:1 1 100%;font-size:.85rem;color:var(--tx);background:var(--accbg);
  border-radius:8px;padding:8px 10px}
.playbar .cur b{color:var(--acc)}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.qcard .qn{font-size:.72rem;color:var(--tx3);margin-bottom:4px}
.qcard .qt{font-size:.95rem;font-weight:700}
.qcard .qt b{color:var(--acc)}
.qcard .fb{margin-top:8px;font-size:.82rem;border-radius:8px;padding:8px 10px}
.qcard .fb.right{background:var(--greenbg);color:#1e6b2e}
.qcard .fb.wrong{background:var(--redbg);color:#9a2c1f}
.qcard .fb .hint{display:block;margin-top:4px;color:var(--tx2)}
.qcard .next{margin-top:8px;background:var(--acc);color:#fff;border:none;border-radius:8px;
  padding:8px 14px;font-size:.85rem;font-weight:600}
.score{font-size:.78rem;color:var(--tx3)}

.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.result .big{font-size:1.6rem;font-weight:800;color:var(--acc)}
.result table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.8rem;min-width:0}
.result td{border-top:1px solid var(--line);padding:6px 4px}
.result .redo{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.result .redo button{border:1px solid var(--line);background:var(--card2,#f7f9fb);color:var(--tx2);
  border-radius:8px;padding:8px 12px;font-size:.8rem}
.result .redo button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

.hintbar{position:sticky;bottom:0;margin-top:14px;background:var(--card);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));font-size:.8rem;color:var(--tx2);line-height:1.5}
.hintbar .g{color:var(--tx3);font-size:.72rem}
.hintbar .t{margin-top:2px}
.hintbar .warn{margin-top:6px;color:#a86200;background:#fdf1de;border-radius:8px;padding:6px 9px;font-size:.76rem}
.foot-pad{height:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>正反转控制电路 · 实物接线图</h1>
    <a class="back" href="index.html">‹ 电工课</a>
    <div class="sub">CJX2s 双接触器互锁正反转控制柜 · 14 根导线 · 配 11.6 正反转控制</div>
  </div>

  <div class="modes">
    <button data-mode="browse" class="on">浏览模式</button>
    <button data-mode="step">逐根播放</button>
    <button data-mode="test">自测</button>
  </div>

  <div class="toolbar" id="browseBar">
    <div class="grpbtns" id="grpBtns"></div>
    <label class="chk"><input type="checkbox" id="labelChk" checked> 显示端子号</label>
  </div>

  <div id="testHead"></div>

  <div class="stage">
    <svg id="svg" viewBox="0 0 860 700" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="playbar" id="playBar" style="display:none">
    <button id="pPrev">‹ 上一根</button>
    <button id="pNext">下一根 ›</button>
    <button id="pAuto">▶ 自动播放</button>
    <button id="pReset">重置</button>
    <div class="cur" id="pCur">点击「下一根」开始</div>
  </div>

  <div class="side" id="side"><span class="empty">悬停任意端子，看它接了几根线；点击左侧分组，只看这一组的走线。</span></div>

  <div class="hintbar" id="hintbar">
    <div class="g">记法</div>
    <div class="t" id="hintText">点一个分组，看这组怎么记。</div>
    <div class="warn">⚠ 第 3 组端子号是交叉的 —— 1 配 5，2 配 1</div>
    <div class="warn">⚠ 每个接触器的辅助端子按 22NC → 21NC → 14NO → 13NO 的顺序接，先常闭后常开</div>
  </div>
  <div class="foot-pad"></div>
</div>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------
   数据（唯一真相）：元件外框 + 端子相对偏移 / 导线 from-to / 分组记忆法
   渲染只读这三个常量，不倒过来写死坐标 —— 改布局只改 DEVICES
------------------------------------------------------------------ */
const DEVICES = [
  {id:'fu4', name:'4号熔断器', sub:'RT18-32X', kind:'fuse', x:90, y:40, w:60, h:90,
   terminals:[ {id:'fu4-out', label:'出', x:30, y:90} ]},
  {id:'fu5', name:'5号熔断器', sub:'RT18-32X', kind:'fuse', x:520, y:40, w:60, h:90,
   terminals:[ {id:'fu5-out', label:'出', x:30, y:90} ]},
  {id:'fr', name:'JR36 热继电器', sub:'', kind:'fr', x:230, y:70, w:110, h:60,
   terminals:[ {id:'fr-96', label:'96', x:0, y:30}, {id:'fr-95', label:'95', x:110, y:30} ]},
  {id:'km1', name:'1号接触器', sub:'CJX2s-0911', kind:'km', x:150, y:220, w:160, h:260,
   terminals:[
     {id:'km1-a1', label:'A1', x:160, y:20},
     {id:'km1-a2', label:'A2', x:160, y:160},
     {id:'km1-14', label:'14', x:40,  y:260},
     {id:'km1-22', label:'22', x:65,  y:260},
     {id:'km1-21', label:'21', x:95,  y:260},
     {id:'km1-13', label:'13', x:120, y:260}
   ]},
  {id:'km2', name:'2号接触器', sub:'CJX2s-0911', kind:'km', x:470, y:220, w:160, h:260,
   terminals:[
     {id:'km2-a1', label:'A1', x:0,   y:20},
     {id:'km2-a2', label:'A2', x:0,   y:180},
     {id:'km2-14', label:'14', x:40,  y:260},
     {id:'km2-22', label:'22', x:65,  y:260},
     {id:'km2-21', label:'21', x:95,  y:260},
     {id:'km2-13', label:'13', x:120, y:260}
   ]},
  {id:'tb', name:'端子排', sub:'TB', kind:'tb', x:90, y:620, w:680, h:40,
   terminals:(function(){
     const out=[];
     for(let i=0;i<12;i++) out.push({id:'tb-'+(i+1), label:String(i+1), x:20+i*(640/12), y:20});
     out.push({id:'tb-last', label:'末', x:20+12*(640/12), y:20});
     return out;
   })()}
];

/* 端子绝对坐标表：{id:{x,y,device,label}} —— WIRES 的 from/to 全靠它解析，
   waypoints 里需要「跟某个端子对齐」的拐点也靠它取，不写死数字 */
const TPOS = {};
DEVICES.forEach(function(d){
  d.terminals.forEach(function(t){
    TPOS[t.id] = {x:d.x+t.x, y:d.y+t.y, device:d.id, label:t.label};
  });
});
function X(id){ return TPOS[id].x; }
function Y(id){ return TPOS[id].y; }

/* 端子的人话说法，自测出题 / 逐根播放 / 悬停面板都用它 */
const TLABEL = {
  'fu4-out':'4号熔断器', 'fu5-out':'5号熔断器',
  'fr-96':'热继电器96', 'fr-95':'热继电器95',
  'km1-a1':'1号接触器A1', 'km1-a2':'1号接触器A2',
  'km1-13':'1号接触器13', 'km1-14':'1号接触器14', 'km1-21':'1号接触器21', 'km1-22':'1号接触器22',
  'km2-a1':'2号接触器A1', 'km2-a2':'2号接触器A2',
  'km2-13':'2号接触器13', 'km2-14':'2号接触器14', 'km2-21':'2号接触器21', 'km2-22':'2号接触器22'
};
for(let i=1;i<=12;i++) TLABEL['tb-'+i] = '端子排'+i;
TLABEL['tb-last'] = '端子排（末端）';

const GROUPS = [
  {id:1, name:'电源进线',         hint:'两个熔断器各管一路，4 号走热继电器，5 号串两个线圈 A1'},
  {id:2, name:'常闭对线圈（交叉）', hint:'我的 22NC 管对方的命'},
  {id:3, name:'常闭对常开（交叉）', hint:'我的 21NC 接对方的 14NO，这个点再引一根下端子排'},
  {id:4, name:'常开对常开',       hint:'13NO 对 13NO，再引一根去公共点'},
  {id:5, name:'端子排跳线',       hint:'端子排 2-6-11 并成一个公共点'}
];
const GCOLOR = {1:'var(--red)', 2:'var(--blue)', 3:'var(--blue)', 4:'var(--green)', 5:'var(--orange)'};
const GCOLOR_HEX = {1:'#c0392b', 2:'#2b6cb0', 3:'#2b6cb0', 4:'#2f9e44', 5:'#e67e22'};

/* WIRES：from/to 是端子 id，waypoints 只写「中间拐点」，起止点由 from/to 自动取。
   14 根，数组顺序＝实际接线顺序（先常闭后常开：21NC/13NO 在接触器右侧相邻，
   22NC/14NO 在左侧相邻，先接常开会挡住旁边常闭的螺丝，2026-09-06 改的） */
const WIRES = [
  {id:1,  from:'fu4-out', to:'fr-96',   group:1, waypoints:[[X('fu4-out'),150],[X('fr-96'),150]]},
  {id:2,  from:'fr-95',   to:'tb-last', group:1, waypoints:[[X('fr-95'),180],[X('tb-last'),180]]},
  {id:3,  from:'fu5-out', to:'km2-a1',  group:1, waypoints:[[X('fu5-out'),170],[X('km2-a1'),170]]},
  {id:4,  from:'km2-a1',  to:'km1-a1',  group:1, waypoints:[]},
  {id:5,  from:'km1-22',  to:'km2-a2',  group:2, waypoints:[[X('km1-22'),505],[390,505],[390,Y('km2-a2')]]},
  {id:6,  from:'km2-22',  to:'km1-a2',  group:2, waypoints:[[X('km2-22'),515],[430,515],[430,Y('km1-a2')]]},
  {id:7,  from:'km1-21',  to:'km2-14',  group:3, waypoints:[[X('km1-21'),540],[X('km2-14'),540]]},
  {id:8,  from:'km2-14',  to:'tb-5',    group:3, waypoints:[[X('km2-14'),560],[X('tb-5'),560]]},
  {id:9,  from:'km2-21',  to:'km1-14',  group:3, waypoints:[[X('km2-21'),580],[X('km1-14'),580]]},
  {id:10, from:'km2-21',  to:'tb-1',    group:3, waypoints:[[X('km2-21'),600],[X('tb-1'),600]]},
  {id:11, from:'km1-13',  to:'km2-13',  group:4, waypoints:[[X('km1-13'),500],[X('km2-13'),500]]},
  {id:12, from:'km2-13',  to:'tb-2',    group:4, waypoints:[[X('km2-13'),520],[X('tb-2'),520]]},
  {id:13, from:'tb-2',    to:'tb-6',    group:5, waypoints:[[X('tb-2'),610],[X('tb-6'),610]]},
  {id:14, from:'tb-6',    to:'tb-11',   group:5, waypoints:[[X('tb-6'),610],[X('tb-11'),610]]}
];
WIRES.forEach(function(w){ w.color = GCOLOR_HEX[w.group]; });

function wireDesc(w){ return TLABEL[w.from]+' → '+TLABEL[w.to]; }
function wirePathD(w){
  const p0=TPOS[w.from], p1=TPOS[w.to];
  const pts=[[p0.x,p0.y]].concat(w.waypoints||[]).concat([[p1.x,p1.y]]);
  return pts.map(function(p,i){ return (i===0?'M':'L')+p[0]+','+p[1]; }).join(' ');
}
function termCount(id){
  let n=0;
  WIRES.forEach(function(w){ if(w.from===id||w.to===id) n++; });
  return n;
}

/* ------------------------------------------------------------------
   渲染：元件（静态画一次）+ 导线 path（14 条，各带 data-group/data-idx）
------------------------------------------------------------------ */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const svg = document.getElementById('svg');
const gDev = el('g',{id:'gDevices'});
const gWire = el('g',{id:'gWires'});
const gTerm = el('g',{id:'gTerms'});
const gLegend = el('g',{id:'gLegend'});
svg.appendChild(gDev); svg.appendChild(gWire); svg.appendChild(gTerm); svg.appendChild(gLegend);

function drawDevice(d){
  if(d.kind==='tb'){
    gDev.appendChild(el('rect',{class:'tb-strip', x:d.x, y:d.y, width:d.w, height:d.h, rx:4}));
    const t=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-8});
    t.textContent = d.name+'（'+d.sub+'）'; gDev.appendChild(t);
    return;
  }
  if(d.kind==='fuse'){
    gDev.appendChild(el('rect',{class:'dev-box', x:d.x, y:d.y, width:d.w, height:d.h, rx:6}));
    gDev.appendChild(el('rect',{class:'fuse-body', x:d.x+d.w/2-9, y:d.y+16, width:18, height:d.h-32, rx:9}));
    gDev.appendChild(el('line',{x1:d.x+d.w/2, y1:d.y, x2:d.x+d.w/2, y2:d.y+16, stroke:'#98a3ad','stroke-width':1.6}));
    const t1=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-22}); t1.textContent=d.name; gDev.appendChild(t1);
    const t2=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-9, style:'font-size:9px;fill:var(--tx3)'});
    t2.textContent=d.sub; gDev.appendChild(t2);
    return;
  }
  if(d.kind==='fr'){
    gDev.appendChild(el('rect',{class:'dev-box', x:d.x, y:d.y, width:d.w, height:d.h, rx:6}));
    gDev.appendChild(el('circle',{cx:d.x+d.w/2, cy:d.y+d.h-14, r:6, fill:'#c0392b'}));
    const t=el('text',{class:'dev-name', x:d.x+d.w/2, y:d.y-8}); t.textContent=d.name; gDev.appendChild(t);
    return;
  }
  /* km：接触器，深灰机身 + 白字铭牌 + 底部辅助端子条 */
  gDev.appendChild(el('rect',{class:'dev-box dev-km', x:d.x, y:d.y, width:d.w, height:d.h, rx:8}));
  gDev.appendChild(el('rect',{class:'aux-strip', x:d.x+18, y:d.y+d.h-46, width:d.w-36, height:26, rx:4}));
  const n1=el('text',{class:'dev-name-in', x:d.x+d.w/2, y:d.y+30}); n1.textContent=d.name; gDev.appendChild(n1);
  const n2=el('text',{class:'dev-sub-in', x:d.x+d.w/2, y:d.y+44}); n2.textContent=d.sub; gDev.appendChild(n2);
}
DEVICES.forEach(drawDevice);

function drawTerminal(id){
  const p=TPOS[id];
  const g=el('g',{'data-term':id});
  const hit=el('circle',{class:'term-hit', cx:p.x, cy:p.y, r:14});
  const dot=el('circle',{class:'term-dot', cx:p.x, cy:p.y, r:6, 'data-term-dot':id});
  g.appendChild(hit); g.appendChild(dot);
  const lbl=el('text',{class:'tlabel', x:p.x+9, y:p.y-8});
  lbl.textContent=p.label; g.appendChild(lbl);
  const n=termCount(id);
  if(n>=2){
    g.appendChild(el('circle',{class:'badge-c', cx:p.x+9, cy:p.y+9, r:7}));
    const bt=el('text',{class:'badge-t', x:p.x+9, y:p.y+9}); bt.textContent=n; g.appendChild(bt);
  }
  gTerm.appendChild(g);
  hit.addEventListener('mouseenter', function(){ onTermHover(id); });
  hit.addEventListener('mouseleave', function(){ onTermHover(null); });
  hit.addEventListener('click', function(){ onTermClick(id); });
}
Object.keys(TPOS).forEach(drawTerminal);

WIRES.forEach(function(w){
  const p=el('path',{class:'wire', d:wirePathD(w), stroke:w.color,
    'data-idx':w.id, 'data-group':w.group});
  gWire.appendChild(p);
});
function wirePath(idx){ return gWire.querySelector('path[data-idx="'+idx+'"]'); }

/* 图例：右上角，按功能区分颜色（不是按分组） */
(function(){
  const items=[['电源进线','#c0392b'],['常开支路','#2f9e44'],['常闭 / 互锁','#2b6cb0'],['跳线','#e67e22']];
  const bx=612, by=14;
  gLegend.appendChild(el('rect',{x:bx, y:by, width:230, height:14+items.length*18+6, rx:8, fill:'#fff', stroke:'#d7dde3'}));
  const lt=el('text',{class:'lt', x:bx+10, y:by+16}); lt.textContent='图例（按功能）'; gLegend.appendChild(lt);
  items.forEach(function(it,i){
    const y=by+34+i*18;
    gLegend.appendChild(el('line',{x1:bx+12, y1:y-4, x2:bx+34, y2:y-4, stroke:it[1], 'stroke-width':3}));
    const t=el('text',{x:bx+42, y:y}); t.textContent=it[0]; gLegend.appendChild(t);
  });
})();

/* ------------------------------------------------------------------
   状态与三种模式
------------------------------------------------------------------ */
const state = { mode:'browse', activeGroup:null, hoverTerm:null,
  step:{index:0, playing:false, timer:null},
  test:{order:[], idx:0, score:0, answers:[], awaiting:false, mistakes:[]} };

function setHint(gid){
  const g = GROUPS.find(function(x){ return x.id===gid; });
  document.getElementById('hintText').textContent = g ? ('第'+g.id+'组「'+g.name+'」：'+g.hint) : '点一个分组，看这组怎么记。';
}

/* ---- 浏览模式：分组高亮 + 悬停端子 ---- */
function renderBrowse(){
  const paths = gWire.querySelectorAll('path.wire');
  paths.forEach(function(p){
    const g = +p.getAttribute('data-group');
    const dim = state.hoverTerm ? true : (state.activeGroup!==null && g!==state.activeGroup);
    p.classList.toggle('dim', !!dim);
    p.classList.remove('hi');
  });
  if(state.hoverTerm){
    const id = state.hoverTerm;
    WIRES.forEach(function(w){
      if(w.from===id || w.to===id) wirePath(w.id).classList.remove('dim');
      wirePath(w.id).classList.toggle('hi', w.from===id || w.to===id);
    });
    const list = WIRES.filter(function(w){ return w.from===id||w.to===id; });
    const side = document.getElementById('side');
    side.innerHTML = '<b>'+(TLABEL[id]||id)+'</b> 接了 '+list.length+' 根：<br>'+
      list.map(function(w){ return '·　'+wireDesc(w); }).join('<br>');
  } else {
    document.getElementById('side').innerHTML =
      '<span class="empty">悬停任意端子，看它接了几根线；点击左侧分组，只看这一组的走线。</span>';
  }
}
function onTermHover(id){
  if(state.mode!=='browse') return;
  state.hoverTerm=id; renderBrowse();
}
function setGroup(gid){
  state.activeGroup = (state.activeGroup===gid) ? null : gid;
  document.querySelectorAll('.grpbtn').forEach(function(b){
    b.classList.toggle('on', +b.dataset.g===state.activeGroup);
  });
  setHint(state.activeGroup);
  renderBrowse();
}

/* ---- 逐根播放 ---- */
function renderStep(){
  const idx = state.step.index; // 0..14，已经画出的根数
  WIRES.forEach(function(w){
    const p=wirePath(w.id);
    p.classList.remove('dim');
    if(w.id<=idx){ p.style.opacity=1; p.classList.toggle('hi', w.id===idx); }
    else { p.style.opacity=0; p.classList.remove('hi'); }
  });
  const cur = document.getElementById('pCur');
  if(idx===0){ cur.innerHTML='点击「下一根」开始'; }
  else{
    const w=WIRES[idx-1];
    cur.innerHTML = '<b>'+idx+'.</b> '+wireDesc(w)+'　（第 '+w.group+' 组：'+GROUPS[w.group-1].name+'）';
    setHint(w.group);
  }
  document.getElementById('pPrev').disabled = idx===0;
  document.getElementById('pNext').disabled = idx===14;
}
function stepNext(){ if(state.step.index<14){ state.step.index++; renderStep(); } else stepStopAuto(); }
function stepPrev(){ if(state.step.index>0){ state.step.index--; renderStep(); } }
function stepReset(){ state.step.index=0; stepStopAuto(); renderStep(); }
function stepStopAuto(){
  state.step.playing=false;
  if(state.step.timer){ clearInterval(state.step.timer); state.step.timer=null; }
  document.getElementById('pAuto').textContent='▶ 自动播放';
}
function stepToggleAuto(){
  if(state.step.playing){ stepStopAuto(); return; }
  state.step.playing=true;
  document.getElementById('pAuto').textContent='⏸ 暂停';
  state.step.timer=setInterval(function(){
    if(state.step.index>=14){ stepStopAuto(); return; }
    stepNext();
  }, 1200);
}

/* ---- 自测模式 ---- */
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function startTest(order){
  state.test = { order: (order && order.length) ? order.slice() : shuffled(WIRES.map(function(w){return w.id;})),
    idx:0, score:0, answers:[], awaiting:true, mistakes:[] };
  WIRES.forEach(function(w){ wirePath(w.id).style.opacity=0; wirePath(w.id).classList.remove('dim','hi'); });
  renderTest();
}
function currentTestWire(){
  const t=state.test;
  if(t.idx>=t.order.length) return null;
  return WIRES.find(function(w){ return w.id===t.order[t.idx]; });
}
function renderTest(){
  const t=state.test;
  const head=document.getElementById('testHead');
  document.querySelectorAll('.term-dot').forEach(function(d){ d.classList.remove('wrong','right','hi'); });

  if(t.idx>=t.order.length){
    const wrong = t.mistakes;
    head.innerHTML =
      '<div class="result"><div>做完啦，共 14 题</div>'+
      '<div class="big">'+t.score+' / '+t.order.length+'</div>'+
      (wrong.length ? ('<table>'+wrong.map(function(m){
          const w=WIRES.find(function(x){return x.id===m;});
          return '<tr><td>第 '+w.id+' 根</td><td>'+wireDesc(w)+'</td></tr>';
        }).join('')+'</table>')
        : '<div style="margin-top:8px;color:#1e6b2e">全对，14 根都记住了</div>') +
      '<div class="redo">'+
        (wrong.length ? '<button class="pri" id="redoWrong">只重做错题（'+wrong.length+'）</button>' : '') +
        '<button id="redoAll">重新开始（14 题全做）</button>'+
      '</div></div>';
    document.getElementById('redoAll').addEventListener('click', function(){ startTest(); });
    if(wrong.length) document.getElementById('redoWrong').addEventListener('click', function(){ startTest(wrong); });
    document.getElementById('side').innerHTML = '<span class="empty">自测结束，点上面按钮重来。</span>';
    return;
  }

  const w = currentTestWire();
  head.innerHTML =
    '<div class="qcard"><div class="qn">第 '+(t.idx+1)+' / '+t.order.length+' 题　<span class="score">已答对 '+t.score+'</span></div>'+
    '<div class="qt">第 '+w.id+' 根：<b>'+TLABEL[w.from]+'</b> 接到哪里？</div>'+
    '<div id="qFeedback"></div></div>';
}
function answerAttempt(termId){
  const t=state.test;
  if(!t.awaiting) return;
  const w=currentTestWire();
  if(!w) return;
  t.awaiting=false;
  const dot = document.querySelector('circle[data-term-dot="'+termId+'"]');
  const ok = termId===w.to;
  if(ok){ t.score++; if(dot) dot.classList.add('right'); }
  else { t.mistakes.push(w.id); if(dot) dot.classList.add('wrong'); }
  t.answers.push({wireId:w.id, picked:termId, ok:ok});
  wirePath(w.id).style.opacity=1;
  const fb=document.getElementById('qFeedback');
  if(fb){
    fb.innerHTML = '<div class="fb '+(ok?'right':'wrong')+'">'+
      (ok ? '✓ 对了：' : '✗ 不对，正确答案是：')+TLABEL[w.to]+
      '<span class="hint">记法（第 '+w.group+' 组）：'+GROUPS[w.group-1].hint+'</span></div>'+
      '<button class="next" id="qNext">下一题 ›</button>';
    document.getElementById('qNext').addEventListener('click', testNext);
  }
  setHint(w.group);
}
function testNext(){
  state.test.idx++;
  state.test.awaiting=true;
  renderTest();
}
function onTermClick(id){
  if(state.mode!=='test') return;
  answerAttempt(id);
}

/* ------------------------------------------------------------------
   模式切换 / UI 绑定
------------------------------------------------------------------ */
function setMode(m){
  state.mode=m;
  document.querySelectorAll('.modes button').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===m); });
  document.getElementById('browseBar').style.display = m==='browse' ? 'flex' : 'none';
  document.getElementById('playBar').style.display   = m==='step' ? 'flex' : 'none';
  document.getElementById('testHead').innerHTML = '';
  document.getElementById('side').innerHTML = '<span class="empty">悬停任意端子，看它接了几根线；点击左侧分组，只看这一组的走线。</span>';
  WIRES.forEach(function(w){ const p=wirePath(w.id); p.style.opacity=1; p.classList.remove('dim','hi'); });
  document.querySelectorAll('.term-dot').forEach(function(d){ d.classList.remove('wrong','right','hi'); });
  state.activeGroup=null; state.hoverTerm=null;
  document.querySelectorAll('.grpbtn').forEach(function(b){ b.classList.remove('on'); });
  setHint(null);
  if(m==='step'){ state.step.index=0; stepStopAuto(); renderStep(); }
  if(m==='test'){ startTest(); }
  if(m==='browse'){ renderBrowse(); }
}

const grpBtnsEl = document.getElementById('grpBtns');
GROUPS.forEach(function(g){
  const btn=document.createElement('button');
  btn.className='grpbtn'; btn.dataset.g=g.id;
  btn.innerHTML='<span class="dot" style="background:'+GCOLOR_HEX[g.id]+'"></span>'+g.id+'. '+g.name;
  btn.addEventListener('click', function(){ setGroup(g.id); });
  grpBtnsEl.appendChild(btn);
});

document.querySelectorAll('.modes button').forEach(function(b){
  b.addEventListener('click', function(){ setMode(b.dataset.mode); });
});
document.getElementById('labelChk').addEventListener('change', function(e){
  svg.classList.toggle('hide-labels', !e.target.checked);
});
document.getElementById('pPrev').addEventListener('click', stepPrev);
document.getElementById('pNext').addEventListener('click', stepNext);
document.getElementById('pAuto').addEventListener('click', stepToggleAuto);
document.getElementById('pReset').addEventListener('click', stepReset);

renderBrowse();

/* 供 jsdom 自测脚本用的最小调试接口，不影响正常使用 */
window.__MRW = {
  DEVICES: DEVICES, WIRES: WIRES, GROUPS: GROUPS, TPOS: TPOS,
  setMode: setMode, setGroup: setGroup,
  startTest: startTest, answer: answerAttempt,
  getState: function(){ return state; },
  wirePathEl: wirePath
};

})();
</script>
