const TLABEL = {

/* 分组照便签重写版的 6 组 + 地线 */
const GROUPS = {
  1:['电能表进出线','电能表 1 进火、2 出火、3 进零、4 出零：1 ← 进线 L，3 ← 进线 N（第 3 孔）；2 → 空开① 上方 L（第 2 孔），4 → 空开① 上方 N（第 1 孔）'],
  2:['空开① 分给 ②③','空开① 下方 L、N → 空开② 上方；再从空开② 上方 L、N 跳线到空开③ 上方'],
  3:['空开② → 插座','空开② 下方 L → 插座 L（右），N → 插座 N（左）。插座「左零右火上接地」'],
  4:['空开③ 火 → 双控 → 灯泡','空开③ 下方 L → 双控① L（公共端）；① L1—② L1、① L2—② L2 两根联络线；双控② L → 灯具端子排 4（灯泡红线）'],
  5:['空开③ 火 → 单控 → 日光灯','空开③ 下方 L → 单控 L1；单控 L → 灯具端子排 2（日光灯红线）'],
  6:['空开③ 零 → 两盏灯','空开③ 下方 N → 灯具端子排 3（灯泡蓝线）、→ 灯具端子排 1（日光灯蓝线）。开关只断相线，零线直接去灯'],
  7:['地线（推测）','电源进线 PE → 接地排，接地排 → 插座 PE。⚠ 便签里没有地线（你当时还没接），这两根是按常规补的']
};
const WIRES = [
  {id:1, from:'src-l', to:'mt-1',  group:1, waypoints:[[216,226],[47,226]]},
  {id:2, from:'src-n', to:'mt-3',  group:1, waypoints:[[288,238],[111,238]]},
  {id:3, from:'mt-2',  to:'qf1-li',group:1, waypoints:[[79,254],[96,254]]},
  {id:4, from:'mt-4',  to:'qf1-ni',group:1, waypoints:[[143,266],[60,266]]},
  {id:5, from:'qf1-lo',to:'qf2-li',group:2, waypoints:[[96,460],[128,460],[128,280],[196,280]]},
  {id:6, from:'qf1-no',to:'qf2-ni',group:2, waypoints:[[60,468],[122,468],[122,273],[160,273]]},

  {id:12,from:'s1-l1', to:'s2-l1', group:4, waypoints:[[258,546],[368,546]]},
  {id:13,from:'s1-l2', to:'s2-l2', group:4, waypoints:[[314,538],[424,538]]},
  {id:14,from:'s2-l',  to:'lt-4',  group:4, waypoints:[[396,524],[440,524],[440,251]]},
  {id:15,from:'qf3-lo',to:'s3-l1', group:5, waypoints:[[332,508],[490,508]]},
  {id:16,from:'s3-l',  to:'lt-2',  group:5, waypoints:[[522,516],[456,516],[456,195]]},
  {id:17,from:'qf3-no',to:'lt-3',  group:6, waypoints:[[296,450],[372,450],[372,223]]},
  {id:18,from:'qf3-no',to:'lt-1',  group:6, waypoints:[[296,456],[380,456],[380,167]]},
  {id:19,from:'src-pe',to:'pe-1',  group:7, waypoints:[[252,144],[183,144],[183,246],[10,246],[10,661],[36,661]]},
  {id:20,from:'pe-2',  to:'xs-pe', group:7, waypoints:[[66,552],[174,552]]}
];
const NW = WIRES.length;
/* 线色照板上规矩：相线红、零线蓝、PE 黄绿 */
const NWIRE = {2:1,4:1,6:1,8:1,10:1,17:1,18:1}, PEWIRE = {19:1,20:1};
WIRES.forEach(function(w){ w.color = PEWIRE[w.id] ? 0x8fbf2f : NWIRE[w.id] ? 0x1c6dd0 : 0xd42f2f; });
/* 负载（当线圈用）：灯泡在灯具端子排 4-3 之间，日光灯在 2-1 之间；插座 L-N 之间算「有电」 */
const SPEC = {
  src:['src-l','src-n'],
  coils:[{id:'el',a:'lt-4',b:'lt-3',name:'白炽灯'},{id:'fl',a:'lt-2',b:'lt-1',name:'日光灯'},{id:'xs',a:'xs-l',b:'xs-n',name:'插座'}],
  contacts:[
    {a:'mt-1',b:'mt-2',by:'fix'},{a:'mt-3',b:'mt-4',by:'fix'},{a:'pe-1',b:'pe-2',by:'fix'},{a:'pe-2',b:'pe-3',by:'fix'},
    {a:'qf1-li',b:'qf1-lo',by:'qf1'},{a:'qf1-ni',b:'qf1-no',by:'qf1'},
    {a:'qf2-li',b:'qf2-lo',by:'qf2'},{a:'qf2-ni',b:'qf2-no',by:'qf2'},
    {a:'qf3-li',b:'qf3-lo',by:'qf3'},{a:'qf3-ni',b:'qf3-no',by:'qf3'},
    {a:'s1-l',b:'s1-l1',by:'s1',when:0},{a:'s1-l',b:'s1-l2',by:'s1',when:1},
    {a:'s2-l',b:'s2-l1',by:'s2',when:0},{a:'s2-l',b:'s2-l2',by:'s2',when:1},
    {a:'s3-l1',b:'s3-l',by:'s3',when:1}],
  toggles:['qf1','qf2','qf3','s1','s2','s3'],
  buttons:[]
};
let ACTIVE = WIRES;
function setActive(a){ ACTIVE = a; }
/* SIM.qf：试车台送电（平时点试车台总开关；考场里要总开关合 + 电源线接好）。tog：盘上空开、开关的位置 */
const SIM = {qf:false, sup:true, blown:'', tog:{}, km:{}, ev:[], last:null, motor:0, btn:{}};
function simReset(){
  SIM.qf=false; SIM.blown=''; SIM.ev=[]; SIM.last=null;
  SIM.tog = {qf1:0, qf2:0, qf3:0, s1:0, s2:1, s3:0};      /* 起始 S1 在 L1、S2 在 L2：灯灭，才能照考场「左开、右关、右开、左关」走 */
  SPEC.coils.forEach(function(c){ SIM.km[c.id]={on:false}; });
}
function contactClosed(c, tog){
  const T = tog || SIM.tog;
  if(c.by==='fix') return true;
  return c.when===undefined ? !!T[c.by] : T[c.by]===c.when;
}
function srcBlock(E){
  /* 跟电源两端在同一个「双连通块」里的边＝真有电流的边（死支路带电但没电流，不算） */
  const adj={}; E.forEach(function(e,i){ (adj[e.a]=adj[e.a]||[]).push([e.b,i]); (adj[e.b]=adj[e.b]||[]).push([e.a,i]); });
  const disc={}, low={}, st=[], comps=[]; let t=0;
  function dfs(u, pe){
    disc[u]=low[u]=++t;
    (adj[u]||[]).forEach(function(x){ const v=x[0], i=x[1]; if(i===pe) return;
      if(!disc[v]){ st.push(i); dfs(v, i); low[u]=Math.min(low[u], low[v]);
        if(low[v]>=disc[u]){ const c=[]; let k; do{ k=st.pop(); c.push(k); }while(k!==i); comps.push(c); } }
      else if(disc[v]<disc[u]){ st.push(i); low[u]=Math.min(low[u], disc[v]); } });
  }
  Object.keys(adj).forEach(function(u){ if(!disc[u]) dfs(u, -1); });
  const si = E.findIndex(function(e){ return e.k==='s'; });
  const c = comps.filter(function(c){ return c.indexOf(si)>=0; })[0] || [];
  return c.map(function(i){ return E[i]; }).filter(function(e){ return e.k!=='s'; });
}
function solveNet(ws, closedFn){
  const res={coil:{}, cur:{}, pot:{}, short:false};
  SPEC.coils.forEach(function(c){ res.coil[c.id]=false; });
  const E=[];
  ws.forEach(function(w){ E.push({id:'w'+w.id,a:w.from,b:w.to,k:'w'}); });
  SPEC.contacts.forEach(function(c,i){ if(closedFn(c)) E.push({id:'c'+i,a:c.a,b:c.b,k:'c'}); });
  const P={};
  function fd(x){ if(P[x]===undefined) P[x]=x; while(P[x]!==x){ P[x]=P[P[x]]; x=P[x]; } return x; }
  E.forEach(function(e){ P[fd(e.a)]=fd(e.b); });

let AC=null, sndOn=true, humNode=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function click(f, dur, vol){
  if(!sndOn || !ac()) return;
  const n=AC.sampleRate*dur|0, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n, 2);
  const s=AC.createBufferSource(), bp=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=buf; bp.type='bandpass'; bp.frequency.value=f; g.gain.value=vol; s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start();
}
function hum(on){
  if(humNode){ const h=humNode; humNode=null; try{ h.g.gain.setTargetAtTime(0, AC.currentTime, 0.15); h.os.forEach(function(o){ o.stop(AC.currentTime+0.8); }); }catch(e){} }
  if(!on || !sndOn || !ac()) return;
  /* 纯音叠在一起像汽笛（11-10 他说像火车鸣笛）。真电动机主要是风扇的呼呼声：噪声过带通，再加一点很轻的 100Hz 电磁嗡 */
  const n=AC.sampleRate*2, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  let b=0; for(let i=0;i<n;i++){ b = b*0.97 + (Math.random()*2-1)*0.25; d[i]=b; }           /* 偏低频的噪声 */
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.6;
  const g=AC.createGain(); g.gain.value=0; g.gain.setTargetAtTime(0.9, AC.currentTime, 0.35);
  const o=AC.createOscillator(), og=AC.createGain(), lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=100; lp.type='lowpass'; lp.frequency.value=420; og.gain.value=0.1;
  src.connect(bp); bp.connect(g); o.connect(lp); lp.connect(og); og.connect(g); g.connect(AC.destination);
  src.start(); o.start(); humNode={g:g, os:[src, o]};
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  if(!hs.length) return null;

  for(const id in ANIM.tog){ const o = ANIM.tog[id]; o.v += ((SIM.tog[id] ? 1 : 0) - o.v)*Math.min(1, dt*18);
    if(o.rocker) o.piv.rotation.x = (o.v-0.5)*0.32; else o.piv.rotation.x = 0.5 - o.v; }
  if(ANIM.rcd){ ANIM.rcd.v = Math.max(0, ANIM.rcd.v - dt*5); ANIM.rcd.mesh.position.z = ANIM.rcd.z0 - ANIM.rcd.v*3; }
  { const b = SIM.km.el.on ? 1 : 0, B = ANIM.bulb; B.v = (B.v||0) + (b - (B.v||0))*Math.min(1, dt*10);
    B.mat.emissiveIntensity = B.v*2.2; B.light.intensity = B.v*60000; B.fil.material.color.setHex(b ? 0xfff2c0 : 0x8a6a3a); }
  { const f = SIM.km.fl.on ? 1 : 0, G = ANIM.tubeGlow; G.v += (f - G.v)*Math.min(1, dt*8);
    ANIM.tubeMat.emissiveIntensity = G.v*3; ANIM.tubeMat.color.setHex(f ? 0xffffff : 0xbfc4c8);
    G.m.opacity = G.v*0.35; G.light.intensity = G.v*90000; }
  if(ANIM.sockLed) ANIM.sockLed.material.color.setHex(SIM.km.xs.on ? 0xff3b30 : 0x552222);
  { const m = ANIM.meter, p = (SIM.km.el.on ? 60 : 0) + (SIM.km.fl.on ? 36 : 0);   /* 灯 60W、日光灯 36W；读数加速演示 */
    m.disc.rotation.z -= p*dt*0.05; m.kwh += p*dt*0.0004;
    const sh = Math.floor(m.kwh*10); if(sh!==m.shown){ m.shown = sh; const g = m.c.getContext('2d');
      g.fillStyle = '#111'; g.fillRect(0, 0, 256, 64); g.font = '700 46px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
      const s = (sh/10).toFixed(1).padStart(7, '0'); g.fillStyle = '#f4f4f4'; g.fillText(s.slice(0, 5), 104, 34); g.fillStyle = '#e04030'; g.fillText(s.slice(5), 214, 34);
      m.tx.needsUpdate = true; } }
  { const ma = (EX.on ? EX.main : SIM.qf) ? -0.5 : 0.5;   /* 平时模式：手柄跟着送电状态（11-26 他发现扳了不动） */ ANIM.main.rotation.x += (ma-ANIM.main.rotation.x)*Math.min(1, dt*20);
    const sa = signUp() ? 1.0 : 0; ANIM.sign.g.rotation.x += (sa-ANIM.sign.g.rotation.x)*Math.min(1, dt*14); }
  if(fly){ fly.k = Math.min(1, fly.k+dt/0.45); const k = fly.k*fly.k*(3-2*fly.k);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if(fly.k>=1) fly=null; }
  controls.update(); if(!fly) camUI(); drawDots(now);
  const near = H/(2*camera.position.distanceTo(controls.target)*Math.tan(camera.fov/2*Math.PI/180)) > 0.66;   /* 每个板面单位占多少像素 */
  if(near!==UI.near){ UI.near = near; SMALL.forEach(function(m){ m.visible = near; }); }
  const s = sig(); if(s!==UI.sig){ UI.sig = s; refresh(); hlApply(); }
  hlFrame(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
flushScrews();
/* 全景按「实际有东西的范围」装满屏幕（11-26 他嫌板子四周空地占地方）：看得见的零件外框 + 一点边；考场才出现的外部电源线不算 */
let CONTENT = null;
(function(){
  /* 只按元件外框 + 电动机 + 试车台算；伸到板边的进线、按钮盒出厂线不算（裁掉一点点不影响看） */
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  function add(a, b, c, d){ x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); }
  DEVICES.forEach(function(d){ add(d.x, d.y, d.x+d.W, d.y+d.H); });
  if(MOT.y > 0) add(MOT.x-60, MOT.y-60, MOT.x+100, MOT.y+56);
  const bb = new THREE.Box3(), tmp = new THREE.Box3(); EXG.updateMatrixWorld(true);
  EXG.traverse(function(o){ if(!o.isMesh || !o.visible || (o.material && o.material.opacity===0)) return;
    for(let p=o; p && p!==EXG; p=p.parent) if(!p.visible) return; tmp.setFromObject(o); if(isFinite(tmp.min.x)) bb.union(tmp); });
  if(!bb.isEmpty()) add(bb.min.x+BW/2, BH/2-bb.max.y, bb.max.x+BW/2, BH/2-bb.min.y);
  const m = 14;
  CONTENT = {x:(x0+x1)/2, y:(y0+y1)/2, w:x1-x0+2*m, h:y1-y0+2*m};
})();
resize(); stretchBoard(); view(VIEWS[Q.get('v')] ? Q.get('v') : 'front', true);
if(Q.get('sel')) stepTo(+Q.get('sel'));
if(Q.has('wire')) setMode(true);
if(Q.has('exam')) exEnter();
window.K3 = {SIM:SIM, UI:UI, EX:EX, view:view, tog:simTog, qf:simQF};
refresh(); requestAnimationFrame(frame);
</script>
