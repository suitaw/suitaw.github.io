<text x="246" y="20" text-anchor="middle">手握这一段（护环以上）</text>
<text x="96" y="24" text-anchor="middle" class="sm">氖泡：亮 = 有电</text>
<line x1="30" y1="56" x2="30" y2="76" class="ln"></line><text x="12" y="90" class="r bd">笔尖金属：严禁触碰</text>
