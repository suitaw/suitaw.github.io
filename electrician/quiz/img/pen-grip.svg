<line x1="106" y1="158" x2="97" y2="163" stroke="#9e9e9e" stroke-width="3"></line>
<text x="150" y="160">左孔、右孔各测一次</text>
<text x="150" y="176">灯亮说「有电」，不亮说「无电」</text>
