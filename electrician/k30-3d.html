/* 标准接法之外的线：自动排直角走线，取不压任何元件、最短的那条 */
function autoRoute(a, b, id){
  const A = TPOS[a], B = TPOS[b], off = 10 + (id % 5)*3, lane = (id % 6)*3;
  const R = DEVICES.map(function(d){ return [d.x, d.y, d.x+(d.W||d.w), d.y+(d.H||d.h)]; });
  function out(T){
    const d = dev(T.device), x0 = d.x, y0 = d.y, x1 = d.x+(d.W||d.w), y1 = d.y+(d.H||d.h);
    const e = [[T.x-x0, -1, 0], [x1-T.x, 1, 0], [T.y-y0, 0, -1], [y1-T.y, 0, 1]].sort(function(p, q){ return p[0]-q[0]; })[0];
    const inside = function(p){ return R.some(function(r){ return p[0]>r[0] && p[0]<r[2] && p[1]>r[1] && p[1]<r[3]; }); };
    for(const o of [off, 10, 7, 5, 3]){ const p = e[1] ? [e[1]<0 ? x0-o : x1+o, T.y] : [T.x, e[2]<0 ? y0-o : y1+o]; if(!inside(p)) return p; }
    return e[1] ? [e[1]<0 ? x0-3 : x1+3, T.y] : [T.x, e[2]<0 ? y0-3 : y1+3];
  }
  function clear(p, q){
    const mx = Math.min(p[0], q[0]), Mx = Math.max(p[0], q[0]), my = Math.min(p[1], q[1]), My = Math.max(p[1], q[1]);
    return R.every(function(r){ return Mx <= r[0]+1 || mx >= r[2]-1 || My <= r[1]+1 || my >= r[3]-1; });
  }
  function ok(path){ for(let i=0;i<path.length-1;i++) if(!clear(path[i], path[i+1])) return false; return true; }
  function len(path){ let s = 0; for(let i=0;i<path.length-1;i++) s += Math.abs(path[i][0]-path[i+1][0]) + Math.abs(path[i][1]-path[i+1][1]); return s; }
  const pa = out(A), pb = out(B), C = [[pa[0], pb[1]], [pb[0], pa[1]]];
  const cand = [[pa, C[0], pb], [pa, C[1], pb]];
  const xs = [], ys = [];
  R.forEach(function(r){ xs.push(r[0]-8-lane, r[2]+8+lane); ys.push(r[1]-8-lane, r[3]+8+lane); });
  xs.forEach(function(x){ cand.push([pa, [x, pa[1]], [x, pb[1]], pb]); });
  ys.forEach(function(y){ cand.push([pa, [pa[0], y], [pb[0], y], pb]); });
  xs.forEach(function(x){ ys.forEach(function(y){ cand.push([pa, [pa[0], y], [x, y], [x, pb[1]], pb]); cand.push([pa, [x, pa[1]], [x, y], [pb[0], y], pb]); }); });
  let best = null, bl = 1e9;

}

/* 11-28 他要说明栏能收起，给板面腾地方：收起只留第一行（最新提示），点那一行或把手再展开；记住选择 */
const botEl = document.querySelector('.bot'), foldB = document.getElementById('fold');
function setFold(m){ botEl.classList.toggle('min', m); foldB.lastChild.textContent = m ? '展开说明' : '收起说明'; try{ localStorage.setItem('elec_k3_fold', m ? '1' : ''); }catch(e){} refit(); }
foldB.onclick = function(){ setFold(!botEl.classList.contains('min')); };
try{ if(localStorage.getItem('elec_k3_fold')) botEl.classList.add('min'), foldB.lastChild.textContent = '展开说明'; }catch(e){}
info.onclick = function(){ if(botEl.classList.contains('min')) return setFold(false); if(EX.on) exStepMenu(); };   /* 点说明栏：看全部步骤（里面能开关提示） */
ov.onclick = function(e){ if(e.target===ov && !menuFresh()) closeMenu(); };
document.getElementById('mode').onclick = function(){ revExit(); if(UI.wire) return setMode(false); UI.free = true; setMode(true); };   /* 11-28 他说边接边判取消：自己接一律自由接，接完点「检查」 */
document.getElementById('chk').onclick = fwCheck;
document.getElementById('meter').onclick = function(){ meterOn(!UI.meter); };
document.getElementById('rev').onclick = function(){ if(UI.rev) revExit(); else revEnter(); };
document.getElementById('hint').onclick = function(){
  if(inMount()){ const p = PARTS.filter(function(x){ return x.k===UI.part && partLeft(x); })[0] || PARTS.filter(partLeft)[0];
    UI.part = p.k; UI.hintSlot = p.fits.filter(function(k){ return !UI.mount[k]; })[0]; UI.msg = '提示：<b>'+p.name+'</b> 装在橙色那个位置'; return; }
  const w = WIRES.filter(function(w){ return inScope(w) && (UI.free ? !FW.some(function(f){ return wkey(f.from, f.to)===wkey(w.from, w.to); }) : !DONE[w.id]); })[0];
  UI.pend=null; UI.sel=0; UI.mark=null;
  if(!w){ UI.msg=scopeW().length+' 根都接完了，点「检查」，或者上试车台送电、先合 QF1 再合支路'; return; }
  UI.hint=w.id; UI.msg='提示 · <b>第 '+w.id+' 根</b>（'+GROUPS[w.group][0]+'）：'+tname(w.from)+' → '+tname(w.to)+'<div class="st">'+GROUPS[w.group][1]+'</div>';
};
document.getElementById('del').onclick = function(){   /* 撤销：拆掉最后接对的那根 */
  if(SIM.qf){ UI.msg='⚠ <b>带电不能拆线</b>：先分闸'; UI.sel=0; return; }
  if(UI.free){ const w = FW[FW.length-1]; if(w){ fwDel(w.id); UI.msg = '撤销了：'+tname(w.from)+' → '+tname(w.to); UI.sel = 0; } return; }
  let id = 0; while(DORD.length && !id){ const k = DORD.pop(); if(DONE[k]) id = k; }
  if(!id){ const ks = Object.keys(DONE).map(Number); if(!ks.length) return; id = Math.max.apply(null, ks); }
  delete DONE[id]; UI.msg='撤销了第 '+id+' 根'; UI.sel=0; applyDone();
};
/* 11-28 他要：重来可以只拆线、元件留着（「重来」挪到顶栏，底栏放回「撤销」） */
document.getElementById('reset').onclick = function(){
  const nW = UI.free ? FW.length : doneN(), nM = Object.keys(UI.mount).length;
  if(!nW && !nM){ UI.msg = '还没接线、也没装元件'; return; }
  const wipe = function(){ simQF(false, performance.now()); fwReset(); for(const k in DONE) delete DONE[k]; UI.err=0; UI.sel=0; UI.pend=null; UI.hint=0; applyDone(); };
  menu('重来', (nW ? [['只拆线（'+nW+' 根），元件留着', function(){ wipe(); UI.msg = '线全拆了，元件还装着：接着接线'; }]] : [])
    .concat(nM ? [['全部重来：线拆掉，元件也卸下来', function(){ wipe(); UI.mount = {}; UI.part = null; UI.hintSlot = null; try{ localStorage.removeItem(LSM); }catch(e){} UI.msg = ''; }]] : []));
};
document.getElementById('snd').onclick = function(){ sndOn = !sndOn; this.innerHTML = sndOn ? IC.son : IC.soff; if(!sndOn) hum(false); else if(SIM.motor) hum(true); };
/* 屏幕尺寸变了（全屏、转屏）：没手动放大过就按新尺寸重新摆全景 */
function refit(){ const keep = CAM==='front' && !zoomedIn() && !rotOn; resize(); stretchBoard(); if(keep) view('front', true); }
/* 屏幕比板子细长时，灰色底板上下加长到正好贴住顶栏和底栏（全景下看不到留白） */
function stretchBoard(){
  const v = VIEWS.front(), t = Math.tan(camera.fov/2*Math.PI/180);
  const visH = 2*t*(v.D+20)*(H-topH-botH)/H;           /* 全景下顶栏到底栏之间，板面 z=0 处看得见的高度 */
  BOARD.scale.y = Math.max(1, (visH+4)/(BH+20));
}
window.addEventListener('resize', refit);

/* ══ 循环 ══ */
let tPrev = performance.now(), omega = 0;
function ease(o, target, dt){ o.v += (target-o.v)*Math.min(1, dt*22); }
function frame(now){
  const dt = Math.min(0.1, (now-tPrev)/1000); tPrev = now;
  simAdvance(now); drainEvents(); mountFrame(now);
  for(const id in ANIM.tog){ const o = ANIM.tog[id]; o.v += ((SIM.tog[id] ? 1 : 0) - o.v)*Math.min(1, dt*18);
    if(o.rocker) o.piv.rotation.x = (o.v-0.5)*0.32; else o.piv.rotation.x = 0.5 - o.v; }
  for(const k in ANIM.rcds||{}){ const r = ANIM.rcds[k]; r.v = Math.max(0, r.v - dt*5); r.mesh.position.z = r.z0 - r.v*3; }
  for(const k in ANIM.led){ const l = ANIM.led[k]; l.m.material.color.setHex(SIM.km[l.load].on ? 0xff3b30 : 0x552222); }
  { const ma = (EX.on ? EX.main : SIM.qf) ? -0.5 : 0.5;   /* 平时模式：手柄跟着送电状态（11-26 他发现扳了不动） */ ANIM.main.rotation.x += (ma-ANIM.main.rotation.x)*Math.min(1, dt*20);
    const sa = signUp() ? 1.0 : 0; ANIM.sign.g.rotation.x += (sa-ANIM.sign.g.rotation.x)*Math.min(1, dt*14); }
  if(fly){ fly.k = Math.min(1, fly.k+dt/0.45); const k = fly.k*fly.k*(3-2*fly.k);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if(fly.k>=1) fly=null; }
  controls.update(); if(!fly) camUI(); drawDots(now);
  const near = H/(2*camera.position.distanceTo(controls.target)*Math.tan(camera.fov/2*Math.PI/180)) > 0.66;   /* 每个板面单位占多少像素 */
  if(near!==UI.near){ UI.near = near; SMALL.forEach(function(m){ m.visible = near; }); }
  const s = sig()+(UI.rev ? '|rev'+UI.rev.k : ''); if(s!==UI.sig){ UI.sig = s; refresh(); hlApply(); }
  hlFrame(now); rippleFrame(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
flushScrews();
/* 全景按「实际有东西的范围」装满屏幕（11-26 他嫌板子四周空地占地方）：看得见的零件外框 + 一点边；考场才出现的外部电源线不算 */
let CONTENT = null, CONTENT_B = null, BENCH = true;   /* CONTENT_B：不算试车台（接线时收起试车台，板子放大） */
(function(){
  /* 只按元件外框 + 电动机 + 试车台算；伸到板边的进线、按钮盒出厂线不算（裁掉一点点不影响看） */
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  function add(a, b, c, d){ x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); }
  DEVICES.forEach(function(d){ add(d.x, d.y, d.x+d.W, d.y+d.H); });
  DUCTS.H.forEach(function(h){ add(h.x0-13, h.y-13, h.x1+13, h.y+13); }); DUCTS.V.forEach(function(v){ add(v.x-13, v.y0-13, v.x+13, v.y1+13); });   /* 线槽也算进取景：左右留白才对称 */
  if(MOT.y > 0) add(MOT.x-60, MOT.y-60, MOT.x+100, MOT.y+56);
  CONTENT_B = {x:(x0+x1)/2, y:(y0+y1)/2, w:x1-x0+28, h:y1-y0+28};
  const bb = new THREE.Box3(), tmp = new THREE.Box3(); EXG.updateMatrixWorld(true);
  EXG.traverse(function(o){ if(!o.isMesh || !o.visible || (o.material && o.material.opacity===0)) return;
    for(let p=o; p && p!==EXG; p=p.parent) if(!p.visible) return; tmp.setFromObject(o); if(isFinite(tmp.min.x)) bb.union(tmp); });
  if(!bb.isEmpty()) add(bb.min.x+BW/2, BH/2-bb.max.y, bb.max.x+BW/2, BH/2-bb.min.y);
  const m = 14;
  CONTENT = {x:(x0+x1)/2, y:(y0+y1)/2, w:x1-x0+2*m, h:y1-y0+2*m};
})();
resize(); stretchBoard(); view(VIEWS[Q.get('v')] ? Q.get('v') : 'front', true);
if(Q.get('sel')) stepTo(+Q.get('sel'));
if(Q.has('wire')) setMode(true);
if(Q.has('exam')) exEnter();
window.K3 = {SIM:SIM, UI:UI, EX:EX, view:view, tog:simTog, qf:simQF, tt:termTap, chk:fwCheck};   /* tt、chk：截图脚本模拟接线、检查用 */
refresh(); requestAnimationFrame(frame);
</script>
</body>
</html>
