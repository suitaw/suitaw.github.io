<title>K3 实操 · 3D 接线板</title>
<style>
:root{--bg:#dfe3e8;--ink:#1f2328;--mut:#5b6470;--card:#fff;--line:#c5ccd5;--blue:#1c6fd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
.back{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}
h1{font-size:22px;margin:14px 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.grid{display:grid;gap:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card:active{border-color:var(--blue)}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.k{font-size:24px;font-weight:700;color:var(--blue)}
.n{color:var(--mut);font-size:14px}
.name{font-weight:600;margin:2px 0 4px}
.desc{color:var(--mut);font-size:13.5px}
.todo{opacity:.55;pointer-events:none}
.todo .k{color:var(--mut)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mut)}
.note{color:var(--mut);font-size:13px;margin-top:16px}
</style>
</head>

<h1>K3 实操 · 3D 接线板</h1>
<p class="sub">每块板都能：看线、自己接线、通电试车、考场模拟（流程照背诵材料）</p>
<div class="grid">
  <a class="card" href="k31-3d.html">
    <div class="top"><span class="k">K31</span><span class="n">控制线 10 根</span></div>
    <div class="name">电动机单向连续运转（带点动控制）</div>
    <div class="desc">一只接触器；绿连续、黄点动、红停止</div>
  </a>
  <a class="card" href="k32-3d.html">
    <div class="top"><span class="k">K32</span><span class="n">控制线 14 根</span></div>
    <div class="name">三相异步电动机正反转运行</div>
    <div class="desc">两只接触器，接触器互锁；绿正转、黄反转、红停止</div>
  </a>
  <div class="card todo">
    <div class="top"><span class="k">K33</span><span class="n">20 根</span><span class="tag">制作中</span></div>
    <div class="name">单相电能表带照明设备的接线</div>
    <div class="desc">电能表、空开、漏保、双控开关、灯泡、日光灯、插座</div>
  </div>
  <a class="card" href="k34-3d.html">
    <div class="top"><span class="k">K34</span><span class="n">16 根</span></div>
    <div class="name">带熔断器、仪表、电流互感器的电动机运行控制</div>
    <div class="desc">控制线 7 根 + 互感器二次线 9 根；电流表、电压表会摆</div>
  </a>
</div>
<p class="note">2D 版（原理图、逐根播放、上螺丝顺序）在 <a href="wiring-trainer.html" style="color:var(--blue)">接线训练器</a></p>
