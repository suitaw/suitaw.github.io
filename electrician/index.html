<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跟着《零基础学电工》学 —— 课程首页</title>
<link rel="stylesheet" href="elec-page.css">
<style>
/* 这一页只有这一个自己的颜色，其余全部来自 elec-page.css 的两套 :root */
:root, :root[data-theme="dark"]{ --hero:#121a24 }
:root[data-theme="light"]{ --hero:#e9eef5 }
/* 首页自己的版式（2026-08-28 深色仪表台改版）
   —— 别的课页用不到，就不进 elec-page.css。
   色板全部走 elec-page.css 的 :root 变量，改一处两边一起变。

   版式用的是**电气单线图**那套隐喻：一章是一条母线（.bus 那条竖线），
   一节是挂在母线上的一条分支回路（.item 左边那个节点 + 一小段横线）。
   学过的节点亮绿、正在学的琥珀色呼吸闪 —— 一眼看出走到哪儿了。
   这不只是好看：母线图本身就是第 4 章「电工识图」要认的东西。 */
svg{display:block}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- 顶部：仪表面板 ---------- */
.hd{position:relative;overflow:hidden;padding:16px 15px 18px;
  /* 渐变的起点跟着主题走：写死 #121a24 的话，白天模式下这一块还是深的，
     而标题用的是 var(--tx)（深色字）—— 深字压深底，标题直接读不出来 */
  background:linear-gradient(180deg,var(--hero),var(--bg));
  border-bottom:1px solid var(--line)}
/* 背景一条淡正弦，像示波器余晖 */
.hd::before{content:'';position:absolute;left:0;right:0;top:56px;height:90px;opacity:.15;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='90' viewBox='0 0 240 90'><path d='M0 45c15-40 30-40 45 0s30 40 45 0 30-40 45 0 30 40 45 0 30-40 45 0' fill='none' stroke='%234ea3ff' stroke-width='2'/></svg>") repeat-x center/240px 90px}
.hd>*{position:relative;z-index:1}
.hd .kick{display:flex;align-items:center;gap:6px;
  font-size:.7rem;letter-spacing:.16em;color:var(--acc);font-weight:600}
.hd .kick::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 8px var(--acc);animation:blink 2.4s infinite}
@keyframes blink{0%,72%,100%{opacity:1}80%,92%{opacity:.28}}
.hd h1{margin:6px 0 0;font-size:1.3rem;font-weight:700}
.hd .sub{margin-top:4px;font-size:.78rem;color:var(--tx3);line-height:1.6}

.gauge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.gauge .g{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px}
.gauge .k{font-size:.66rem;color:var(--tx3);letter-spacing:.06em}
.gauge .v{font-size:1.12rem;font-weight:700;color:var(--acc);line-height:1.35}
.gauge .g.amb .v{color:var(--warn)}
.gauge .g.ok .v{color:var(--ok)}
.gauge .u{font-size:.7rem;color:var(--tx3);font-weight:400;margin-left:2px}

.go{display:flex;align-items:center;gap:11px;margin-top:10px;padding:12px 13px;
  background:linear-gradient(90deg,rgba(78,163,255,.16),rgba(78,163,255,.05));
  border:1px solid var(--accln);border-radius:12px;
  text-decoration:none;color:var(--tx);transition:transform .14s}
.go:active{transform:scale(.99)}
.go .ic{flex:none;width:34px;height:34px;border-radius:9px;background:rgba(78,163,255,.18);
  color:var(--acc);display:flex;align-items:center;justify-content:center}
.go .b{flex:1;min-width:0}
.go .b>span{display:block}
.go .k{font-size:.68rem;color:var(--acc);letter-spacing:.08em}
.go .t{font-size:.94rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go .arw{flex:none;color:var(--acc)}

/* ---------- 篇 ---------- */
.sec{margin:18px 12px 0}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.sec-h .t{font-size:.82rem;font-weight:700;letter-spacing:.1em;color:var(--tx2)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h .d{font-size:.7rem;color:var(--tx3)}

/* ---------- 章卡 ---------- */
.chap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:10px}
.chap.live{border-color:var(--accln);
  box-shadow:0 0 0 1px rgba(78,163,255,.1),0 8px 24px -12px rgba(78,163,255,.5)}
.chap-t{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--card2)}
.chap-t .ic{flex:none;width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(78,163,255,.12);color:var(--acc);border:1px solid rgba(78,163,255,.24)}
.chap.off .chap-t .ic{background:var(--line2);color:var(--tx3);border-color:var(--line)}
.chap-t .b{flex:1;min-width:0}
.chap-t .b>span{display:block}
.chap-t .n{font-size:.66rem;font-weight:700;letter-spacing:.14em;color:var(--tx3)}
.chap-t .t{font-size:.96rem;font-weight:700;line-height:1.35;margin-top:1px}
.chap-t .d{font-size:.73rem;color:var(--tx3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap-t .pg{flex:none;align-self:flex-start;font-size:.68rem;color:var(--tx3);padding-top:2px}

/* ---------- 母线 + 分支回路 ---------- */
.bus{position:relative;padding:6px 0 8px}
.bus::before{content:'';position:absolute;left:30px;top:0;bottom:14px;width:2px;
  background:linear-gradient(180deg,var(--acc),rgba(78,163,255,.18))}
.item{position:relative;display:flex;align-items:center;gap:10px;
  min-height:56px;padding:6px 13px 6px 46px;
  text-decoration:none;color:inherit;transition:background .16s}
.item:active{background:var(--card2)}
.item::before{content:'';position:absolute;left:31px;top:50%;width:13px;height:2px;
  background:var(--line);transform:translateY(-1px)}
.item::after{content:'';position:absolute;left:26px;top:50%;width:10px;height:10px;
  border-radius:50%;margin-top:-5px;background:var(--bg);
  border:2px solid var(--line);box-sizing:border-box}
.item.done::after{background:var(--ok);border-color:var(--ok);
  box-shadow:0 0 9px rgba(62,207,142,.65)}
.item.now::after{background:var(--warn);border-color:var(--warn);
  box-shadow:0 0 10px rgba(240,160,32,.75);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 3px rgba(240,160,32,.3)}}
.item.done::before,.item.now::before{background:var(--acc)}
.item .ic{flex:none;width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.item.done .ic{color:var(--ok);border-color:rgba(62,207,142,.3)}
.item .b{flex:1;min-width:0}
.item .b>span{display:block}
.item .id{font-size:.66rem;font-weight:700;color:var(--acc);letter-spacing:.06em}
.item .t{font-size:.89rem;font-weight:600;line-height:1.4}
.item .d{font-size:.73rem;color:var(--tx3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .go2{flex:none;color:var(--tx3)}
.item .ok{flex:none;color:var(--ok)}
.item .half{flex:none;font-size:.66rem;color:var(--tx3);
  border:1px solid var(--line);border-radius:6px;padding:1px 5px}

/* ---------- 还没做的章 ---------- */
.row{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 13px;
  border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .ic{flex:none;width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card2);color:var(--tx3);border:1px solid var(--line)}
.row .b{flex:1;min-width:0}
.row .b>span{display:block}
.row .t{font-size:.85rem;font-weight:600;color:var(--tx2);line-height:1.35}
.row .d{font-size:.71rem;color:var(--tx3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pg{flex:none;font-size:.68rem;color:var(--tx3)}

/* ---------- 配套 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{display:block;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px;text-decoration:none;color:inherit;
  transition:border-color .16s,transform .14s}
.tile:active{transform:scale(.975)}
.tile .ic{width:32px;height:32px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;margin-bottom:8px;
  background:var(--tb);color:var(--tc);border:1px solid var(--tl)}
.tile .t{display:block;font-size:.86rem;font-weight:700}
.tile .d{display:block;font-size:.72rem;color:var(--tx3);margin-top:3px;line-height:1.5}

.honest{margin:18px 12px 0;background:var(--warnbg);
  border:1px solid rgba(240,160,32,.28);border-radius:var(--r);
  padding:12px 13px;font-size:.82rem;line-height:1.75;color:var(--tx2);
  display:flex;gap:11px}
.honest .ic{flex:none;color:var(--warn)}
.honest b{color:var(--warn)}

.fade{animation:up .5s cubic-bezier(.2,.85,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){
  .fade{animation:none}.item.now::after,.hd .kick::before{animation:none}
}
</style>
<!-- 主题要在解析 body 之前定下来，否则选了白天模式也会先闪一下深色 -->
<script src="elec-theme.js"></script>
</head>
<body>
<div class="wrap" id="w"></div>

<script src="elec-icons.js"></script>
<script src="elec-nav.js"></script>
<script>
'use strict';
/* 课表数据全部来自 elec-nav.js 的 BOOK —— 加新课只改那一处 */
const BOOK = ElecNav.BOOK;

/* 哪几节的课末练习全做完了：读 elec-ui.js 存的那份（每节四道题） */
function doneSet(){
  let q = {};
  try{ q = JSON.parse(localStorage.getItem('elec_quiz') || '{}') || {}; }catch(e){}
  const out = {};
  Object.keys(q).forEach(function(k){
    const p = (q[k] && q[k].picks) || [];
    let n = 0;
    for(let i=0;i<p.length;i++) if(p[i] !== undefined && p[i] !== null) n++;
    if(n >= 4) out[k] = true;
  });
  return out;
}
/* 哪几节读过、读到第几屏：读 book.html 存的那份（一节四屏） */
function seenMap(){
  try{ return JSON.parse(localStorage.getItem('elec_book_seen') || '{}') || {}; }
  catch(e){ return {}; }
}

(function(){
  const done = doneSet(), seen = seenMap();
  const live = [];                       /* 已经做好的节，按书序 */
  BOOK.forEach(function(P){ P.chs.forEach(function(ch){
    (ch.secs||[]).forEach(function(s){ if(s.f) live.push(s); });
  }); });

  const key = function(id){ return 'c' + id.replace('.', '-'); };
  const readCnt = live.filter(function(s){ return (seen[s.id]||[]).length >= 4; }).length;
  const doneCnt = live.filter(function(s){ return done[key(s.id)]; }).length;

  /* 「接着上次」＝ 第一节还没读完的；全读完了就指向最后一节 */
  const nextSec = live.find(function(s){ return (seen[s.id]||[]).length < 4; })
               || live[live.length-1];
  const NOW = nextSec ? nextSec.id : '';

  let h = '';
  h += '<div class="hd">'+
    '<div class="kick">跟着教材学</div>'+
    '<h1>零基础学电工</h1>'+
    '<div class="sub">韩雪涛主编 · 机械工业出版社 · 全 16 章<br>'+
      '书内页码 + 14 = PDF 页码</div>'+
    '<div class="gauge">'+
      '<div class="g"><div class="k">读过</div>'+
        '<div class="v mono">'+readCnt+'<span class="u">/ '+live.length+' 节</span></div></div>'+
      '<div class="g ok"><div class="k">练习做完</div>'+
        '<div class="v mono">'+doneCnt+'<span class="u">/ '+live.length+' 节</span></div></div>'+
      '<div class="g amb"><div class="k">在学</div>'+
        '<div class="v mono">'+(NOW||'—')+'</div></div>'+
    '</div>'+
    (nextSec ? '<a class="go" href="book.html#'+nextSec.id+'">'+
      '<span class="ic">'+EI.svg('book',19)+'</span>'+
      '<span class="b"><span class="k">接着上次</span>'+
      '<span class="t">'+nextSec.id+'　'+nextSec.t+'</span></span>'+
      '<span class="arw">'+EI.svg('right',20)+'</span></a>' : '')+
  '</div>';

  let di = 0;
  BOOK.forEach(function(P){
    h += '<div class="sec fade" style="animation-delay:'+(di++*.05)+'s">'+
      '<div class="sec-h"><span class="t">'+P.part+'</span>'+
      '<span class="ln"></span><span class="d">'+P.chs.length+' 章</span></div>';

    /* 已经拆到节的章：画成一条母线 + 若干分支 */
    P.chs.forEach(function(ch){
      if(!(ch.secs && ch.secs.length)) return;
      h += '<div class="chap live"><div class="chap-t">'+
        '<span class="ic">'+EI.svg(EI.forChapter(ch.n),21)+'</span>'+
        '<span class="b"><span class="n mono">CH '+String(ch.n).padStart(2,'0')+'</span>'+
        '<span class="t">'+ch.t+'</span><span class="d">'+ch.d+'</span></span>'+
        '<span class="pg mono">P'+ch.p+'</span></div><div class="bus">';
      ch.secs.forEach(function(s){
        const ok = !!done[key(s.id)];
        const rd = (seen[s.id]||[]).length;
        const st = ok ? ' done' : (s.id === NOW ? ' now' : '');
        let right;
        if(ok)            right = '<span class="ok">'+EI.svg('check',19)+'</span>';
        else if(rd > 0)   right = '<span class="half mono">'+rd+'/4 屏</span>';
        else              right = '<span class="go2">'+EI.svg('right',17)+'</span>';
        const inner = '<span class="ic">'+EI.svg(EI.forSection(s.id),18)+'</span>'+
          '<span class="b"><span class="id mono">'+s.id+'</span>'+
          '<span class="t">'+s.t+'</span>'+
          '<span class="d">'+s.d+'　P'+s.p+'</span></span>'+right;
        h += s.f ? '<a class="item'+st+'" href="'+s.f+'">'+inner+'</a>'
                 : '<div class="item" style="opacity:.5">'+inner+'</div>';
      });
      h += '</div></div>';
    });

    /* 还没拆到节的章：塌成一张卡里的若干行 */
    const rest = P.chs.filter(function(c){ return !(c.secs && c.secs.length); });
    if(rest.length){
      h += '<div class="chap off">';
      rest.forEach(function(c){
        h += '<div class="row"><span class="ic">'+EI.svg(EI.forChapter(c.n),17)+'</span>'+
          '<span class="b"><span class="t">'+
            '<span class="mono" style="color:var(--tx3)">CH '+String(c.n).padStart(2,'0')+'</span>　'+
            c.t+'</span><span class="d">'+c.d+'</span></span>'+
          '<span class="pg mono">P'+c.p+'</span></div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });

  /* 配套的几块 —— 不按章节走 */
  const TOOLS = [
   ['c00.html','symbol','#4ea3ff','第 0 课 · 读懂符号','I 和 A、P 和 W 到底差在哪'],
   ['circuit-basics.html','shock','#ff6b6b','回路 · 大地 · 触电','鸟站电线上为什么没事'],
   ['magnet-field.html','magnet','#b07ce8','磁场与磁力线','撒铁粉看通电导线周围'],
   ['lab-circuit.html','lab','#3ecf8e','电路实验室','自己搭电路，里面是真求解器'],
   ['quiz/quiz.html','quiz','#f0a020','考证题库','单选 537 + 判断 290 题'],
   ['parts.html','target','#9fadbd','元件设计规范图','元件长什么样、有哪些状态']
  ];
  h += '<div class="sec fade" style="animation-delay:.3s">'+
    '<div class="sec-h"><span class="t">配套的几块</span><span class="ln"></span>'+
    '<span class="d">不按章节走</span></div><div class="grid">';
  TOOLS.forEach(function(t){
    h += '<a class="tile" href="'+t[0]+'" style="--tc:'+t[2]+
      ';--tb:'+t[2]+'22;--tl:'+t[2]+'4d">'+
      '<span class="ic">'+EI.svg(t[1],19)+'</span>'+
      '<span class="t">'+t[3]+'</span><span class="d">'+t[4]+'</span></a>';
  });
  h += '</div></div>';

  h += '<div class="honest fade" style="animation-delay:.35s">'+
    '<span class="ic">'+EI.svg('warn',19)+'</span><span>'+
    '<b>网页教不了实操。</b>压接、穿线、用钳形表卡在带电导线上、按力矩拧端子 —— '+
    '这些只有真上手才学得会。这个站能给的是<b>原理看得懂、图看得明白、'+
    '故障有思路、笔试答得上</b>这四样。<br>'+
    '<b>低压电工作业操作证是法律硬门槛</b>，无证上岗违法，这条不是靠自学能替代的。'+
    '</span></div>';

  h += '<div class="foot" style="margin:16px 12px 24px">'+
    '内容全部按教材原创改写，公式和数值逐条核对过<br>'+
    '出现具体数字的地方都标了出处；涉及标准和规范的数值以现行规范为准</div>';

  document.getElementById('w').innerHTML = h;
})();
</script>
</body>
</html>
