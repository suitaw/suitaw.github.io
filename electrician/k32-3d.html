<script type="module">

/*__CORE_BEGIN__  数据 + 电路仿真：不碰 THREE / DOM，测试脚本把这一段抠出来在 node 里跑。
  全部照 wiring-trainer.html 的 defK32()（Notion「实训接线记录」版）搬，坐标系也是它的 560×830 板面。 */
const KM_W = 200, KM_H = 150, BOARD_H = 920;   /* BOARD_H：板面高度（11-26 元件放大 1.3 倍后加长） */
const KM_PINS = [[34,18,'1/L1'],[72,18,'3/L2'],[110,18,'5/L3'],[34,132,'2/T1'],[72,132,'4/T2'],[110,132,'6/T3']];
function kmTerms(p){ return [
  {id:p+'-13',label:'13',x:142,y:18},{id:p+'-21',label:'21',x:168,y:18},{id:p+'-a1',label:'A1',x:190,y:18},
  {id:p+'-a2t',label:'A2',x:34,y:33},   /* 11-27 他说：上方也有个 A2，在最左上接线口正下面，跟下方 A2 内部通 */
  {id:p+'-14',label:'14',x:142,y:132},{id:p+'-22',label:'22',x:168,y:132},{id:p+'-a2',label:'A2',x:190,y:132}]; }
const FR_PINS = [[28,18,'1'],[60,18,'3'],[92,18,'5'],[28,78,'2'],[60,78,'4'],[92,78,'6']];
/* 11-27 照他拍的考场正反转盘重排（/sdcard/DCIM/Camera/IMG_20261127_113533.jpg）：
   上导轨 QF + FU1 三只，右边隔开 4、5 号；中导轨 KM1、KM2 左右并排；下面热继电器（盘上固定）；最下面横端子排（左 L1 L2 L3 进电源、右 U V W 去电动机），左下角接地排；
   右边竖端子排，按钮盒在右上（绿正转、黄反转、红停止）；四周和层间是线槽。只有空开、熔断器、接触器自己装 */
const DEVICES = [
  {id:'qf', tag:'QF 断路器', kind:'mcb', x:42, y:49, w:96, h:92, s:1.2,
   pins:[[18,6,'1'],[48,6,'3'],[78,6,'5'],[18,86,'2'],[48,86,'4'],[78,86,'6']], terminals:[]},
  {id:'fu1', tag:'FU1', kind:'fuse3', x:163, y:49, w:96, h:92, s:1.2,
   pins:[[16,6,''],[48,6,''],[80,6,''],[16,86,''],[48,86,''],[80,86,'']], terminals:[]},
  {id:'fu4', tag:'4号', kind:'fuse', x:318, y:49, w:32, h:92, s:1.2, pins:[[16,6,'']], terminals:[{id:'fu4-out',label:'',x:16,y:84}]},
  {id:'fu5', tag:'5号', kind:'fuse', x:359, y:49, w:32, h:92, s:1.2, pins:[[16,6,'']], terminals:[{id:'fu5-out',label:'',x:16,y:84}]},
  {id:'km1', tag:'KM1', kind:'km', x:28, y:222, w:KM_W, h:KM_H, s:1.0, pins:KM_PINS, terminals:kmTerms('km1')},
  {id:'km2', tag:'KM2', kind:'km', x:234, y:222, w:KM_W, h:KM_H, s:1.0, pins:KM_PINS, terminals:kmTerms('km2')},
  {id:'fr', tag:'FR 热继电器', kind:'fr', x:150, y:440, w:154, h:104, s:1.2, pins:FR_PINS,
   terminals:[{id:'fr-96',label:'96',x:145,y:64},{id:'fr-95',label:'95',x:145,y:88}]},
  {id:'tb', tag:'端子排', kind:'tb', x:472, y:196, w:62, h:336, s:1.2,
   terminals:(function(){ const o=[]; for(let i=0;i<12;i++) o.push({id:'tb-'+(i+1),label:String(i+1),x:14,y:22+i*24});
     return o; })()},
  /* 底部横端子排：左三位进电源，空一位，右三位去电动机（pins 顺序 U V W L1 L2 L3：考场代码 P('tbm',0..2) 是 U V W） */
  {id:'tbm', tag:'接线排', kind:'tbm', x:40, y:682, w:210, h:44, s:1.3, pins:[[135,14,'U'],[165,14,'V'],[195,14,'W'],[15,14,'L1'],[45,14,'L2'],[75,14,'L3']], terminals:[]},
  {id:'pe', tag:'PE', kind:'pe', x:40, y:752, w:100, h:26, s:1.3, terminals:[]},
  {id:'sb', tag:'按钮盒', kind:'sb', x:466, y:12, w:116, h:176, s:0.8, terminals:[]}
];
const TPOS = {};
DEVICES.forEach(function(d){ const s=d.s||1; d.W=d.w*s; d.H=d.h*s; d.terminals.forEach(function(t){ TPOS[t.id]={x:d.x+t.x*s,y:d.y+t.y*s,device:d.id,label:t.label}; }); });   /* s：元件放大倍数；W/H 放大后的外框 */
/* 11-27 他说：接地排上哪个孔都行。跟标准接法比对时，接地排各孔当同一个点 */
function tk(id){ return /^pe-\d+$/.test(id) ? 'pe' : id; }
function wkey(a, b){ return [tk(a), tk(b)].sort().join('|'); }
/* 新规（11-27）：主电路也自己接 —— 主触点、出线端子也登记成能点的端子。PHASE：这个端子本来属于哪一相（自己接线时按它给线上色） */
const MTERM = {qf:['qf-1','qf-3','qf-5','qf-2','qf-4','qf-6'], fu1:['fu1-i1','fu1-i2','fu1-i3','fu1-o1','fu1-o2','fu1-o3'], fu4:['fu4-in'], fu5:['fu5-in'],
  km1:['km1-1','km1-3','km1-5','km1-2','km1-4','km1-6'], km2:['km2-1','km2-3','km2-5','km2-2','km2-4','km2-6'], fr:['fr-1','fr-3','fr-5','fr-2','fr-4','fr-6'], tbm:['x-U','x-V','x-W','x-L1','x-L2','x-L3']};
const PHASE = {'fu4-in':1, 'fu5-in':2, 'km2-1':2, 'km2-5':0};   /* KM2 进线 L1、L3 对调：1/L1 接的是 L3（红）、5/L3 接的是 L1（黄） */
Object.keys(MTERM).forEach(function(k){ const d = dev(k), s = d.s||1;
  MTERM[k].forEach(function(id, i){ const p = d.pins[i]; TPOS[id] = {x:d.x+p[0]*s, y:d.y+p[1]*s, device:k, label:p[2], main:true}; if(PHASE[id]===undefined) PHASE[id] = i%3; }); });

const TLABEL = {
  'fu4-out':'4号熔断器（L2）','fu5-out':'5号熔断器（L3）','fr-96':'热继电器96','fr-95':'热继电器95',
  'km1-a1':'KM1 A1','km1-a2':'KM1 A2','km1-13':'KM1 13NO','km1-14':'KM1 14NO','km1-21':'KM1 21NC','km1-22':'KM1 22NC',
  'km2-a1':'KM2 A1','km2-a2':'KM2 A2','km2-13':'KM2 13NO','km2-14':'KM2 14NO','km2-21':'KM2 21NC','km2-22':'KM2 22NC',
  'tb-1':'端子排1（正转·动合）','tb-2':'端子排2（正转·动合）','tb-3':'端子排3（正转·动断·不用）','tb-4':'端子排4（正转·动断·不用）',
  'tb-5':'端子排5（反转·动合）','tb-6':'端子排6（反转·动合）','tb-7':'端子排7（反转·动断·不用）','tb-8':'端子排8（反转·动断·不用）',
  'tb-9':'端子排9（停止·动合·不用）','tb-10':'端子排10（停止·动合·不用）','tb-11':'端子排11（停止·动断）','tb-12':'端子排12（停止·动断）',
  'qf-1':'断路器 1（上口 L1）','qf-3':'断路器 3（上口 L2）','qf-5':'断路器 5（上口 L3）','qf-2':'断路器 2（下口 L1）','qf-4':'断路器 4（下口 L2）','qf-6':'断路器 6（下口 L3）',
  'fu1-i1':'FU1 上口 L1','fu1-i2':'FU1 上口 L2','fu1-i3':'FU1 上口 L3','fu1-o1':'FU1 下口 L1','fu1-o2':'FU1 下口 L2','fu1-o3':'FU1 下口 L3',
  'fu4-in':'4号熔断器上口','fu5-in':'5号熔断器上口',
  'km1-1':'KM1 1/L1','km1-3':'KM1 3/L2','km1-5':'KM1 5/L3','km1-2':'KM1 2/T1','km1-4':'KM1 4/T2','km1-6':'KM1 6/T3',
  'km2-1':'KM2 1/L1','km2-3':'KM2 3/L2','km2-5':'KM2 5/L3','km2-2':'KM2 2/T1','km2-4':'KM2 4/T2','km2-6':'KM2 6/T3',
  'fr-1':'热继电器 1','fr-3':'热继电器 3','fr-5':'热继电器 5','fr-2':'热继电器 2','fr-4':'热继电器 4','fr-6':'热继电器 6',
  'x-L1':'接线排 L1（进电源）','x-L2':'接线排 L2（进电源）','x-L3':'接线排 L3（进电源）','x-U':'接线排 U（去电动机）','x-V':'接线排 V（去电动机）','x-W':'接线排 W（去电动机）'
};
const PH = [0xe0a92e, 0x3fa845, 0xcf4436];   /* 三相线色：黄 绿 红 */
/* 分组：主电路照电流走向一段一段；控制回路照他记录时的分法（Notion「实训接线记录」K32：电源进线 / 常闭对线圈 / 常闭对常开 / 常开对常开 / 端子排跳线） */
const GROUPS = {
  1:['主电路·电源进线', '接线排 L1 L2 L3 → 断路器上口 1、3、5（黄、绿、红）'],
  2:['主电路·断路器 → FU1', '断路器下口 2、4、6 → 熔断器 FU1 上口'],
  3:['主电路·FU1 → KM1', 'FU1 下口 → KM1 主触点上口 1/L1、3/L2、5/L3'],
  4:['主电路·KM1 → KM2 进线（换相）', 'KM1 上口 → KM2 上口，L1、L3 对调：KM1 1 → KM2 5、3 → 3、5 → 1（这一对调就是反转的来源）'],
  5:['主电路·KM1 出线 ↔ KM2 出线', 'KM1 下口 2、4、6 → KM2 下口 2、4、6（同名并联，不换相）'],
  6:['主电路·KM2 → 热继', 'KM2 下口 2/T1、4/T2、6/T3 → 热继电器 1、3、5'],
  7:['主电路·热继 → 出线', '热继电器 2、4、6 → 接线排 U、V、W（去电动机）'],
  8:['控制电源', 'FU1 第 2 只下口（L2）→ 4 号熔断器上口，第 3 只下口（L3）→ 5 号熔断器上口（控制回路 380V 取两相）'],
  9:['电源进线','4 号走热继电器（96 进、95 出去端子排 12 = 停止），5 号串两个线圈 A1'],
  10:['常闭对线圈','交叉接：我的 22NC 管对方的命 —— KM1 22 → KM2 A2，KM2 22 → KM1 A2'],
  11:['常闭对常开','交叉接：我的 21NC 接对方的 14NO，再引一根下端子排。KM1 配 5，KM2 配 1'],
  12:['常开对常开','同名接：KM1 13NO → KM2 13NO，再引一根去端子 2（公共点）'],

/* 37 根：主电路 21 + 控制电源 2 + 控制回路 14。数组顺序＝接线顺序；线都自动走线槽（routeWire） */
const WIRES = [];
(function(){
  const mw = function(g, a, b, c){ [0,1,2].forEach(function(i){ WIRES.push({from:a[i], to:b[i], group:g, color:PH[c ? c[i] : i]}); }); };
  mw(1, ['x-L1','x-L2','x-L3'], ['qf-1','qf-3','qf-5']);
  mw(2, ['qf-2','qf-4','qf-6'], ['fu1-i1','fu1-i2','fu1-i3']);
  mw(3, ['fu1-o1','fu1-o2','fu1-o3'], ['km1-1','km1-3','km1-5']);
  mw(4, ['km1-1','km1-3','km1-5'], ['km2-5','km2-3','km2-1']);
  mw(5, ['km1-2','km1-4','km1-6'], ['km2-2','km2-4','km2-6']);
  mw(6, ['km2-2','km2-4','km2-6'], ['fr-1','fr-3','fr-5']);
  mw(7, ['fr-2','fr-4','fr-6'], ['x-U','x-V','x-W']);

  [['fu4-out','fr-96',9],['fr-95','tb-12',9],['fu5-out','km2-a1',9],['km2-a1','km1-a1',9],
   ['km1-22','km2-a2',10],['km2-22','km1-a2',10],
   ['km1-21','km2-14',11],['km2-14','tb-5',11],['km2-21','km1-14',11],['km2-21','tb-1',11],
   ['km1-13','km2-13',12],['km2-13','tb-2',12],
   ['tb-2','tb-6',13],['tb-6','tb-11',13]].forEach(function(a){ WIRES.push({from:a[0], to:a[1], group:a[2], color:0x22262b}); });
  WIRES.forEach(function(w, i){ w.id = i+1; });
})();
const NW = WIRES.length;
const SPEC = {
  src:['fu4-out','fu5-out'],
  coils:[{id:'km1',a:'km1-a1',b:'km1-a2',name:'KM1'},{id:'km2',a:'km2-a1',b:'km2-a2',name:'KM2'}],
  contacts:[

function exitPt(p, q, d){
  const L = Math.hypot(q[0]-p[0], q[1]-p[1]); if(!d || L<0.01) return p;

  const tx = dx>0 ? (d.x+d.W+m-p[0])/dx : dx<0 ? (d.x-m-p[0])/dx : 1e9;
  const ty = dy>0 ? (d.y+d.H+m-p[1])/dy : dy<0 ? (d.y-m-p[1])/dy : 1e9;
  const t = Math.min(Math.max(0, Math.min(tx, ty)), L);
  return [p[0]+dx*t, p[1]+dy*t];
}
function toward(p, q, s){ const L=Math.hypot(q[0]-p[0], q[1]-p[1])||1; return [p[0]+(q[0]-p[0])/L*s, p[1]+(q[1]-p[1])/L*s]; }
function d2(p, q){ return Math.hypot(q[0]-p[0], q[1]-p[1]); }
function path3(p2, za, zb, lane, da, db){

  if(za!=null){ push(p2[0], za); const e=exitPt(p2[0], p2[1], da); push(e, za); if(d2(e, p2[1])>8) push(toward(e, p2[1], 6), lane); }
  else push(p2[0], lane);
  for(let i=1;i<n-1;i++) push(p2[i], lane);
  if(zb!=null){ const e=exitPt(p2[n-1], p2[n-2], db); if(d2(e, p2[n-2])>8) push(toward(e, p2[n-2], 6), lane); push(e, zb); push(p2[n-1], zb); }

}

/* 考场里接的「标准接法之外」的线：自动排直角走线，不再两点拉斜线穿过元件（11-26 他发现 KM1-21→KM2-13 从 KM1 底下钻过去）。
   1) 从端子朝最近的元件边出头；2) 试「先竖后横」「先横后竖」和经过元件旁空道的三段走法；3) 取不压任何元件、最短的那条。
   每根线按编号错开几个单位，几根错线不叠成一根 */
function autoRoute(a, b, id){
  const A = TPOS[a], B = TPOS[b], off = 10 + (id % 5)*3, lane = (id % 6)*3;
  const R = DEVICES.map(function(d){ return [d.x, d.y, d.x+(d.W||d.w), d.y+(d.H||d.h)]; });
  function out(T){                                                     /* 朝最近的那条边出头 */
    const d = dev(T.device), x0 = d.x, y0 = d.y, x1 = d.x+(d.W||d.w), y1 = d.y+(d.H||d.h);
    const e = [[T.x-x0, -1, 0], [x1-T.x, 1, 0], [T.y-y0, 0, -1], [y1-T.y, 0, 1]].sort(function(p, q){ return p[0]-q[0]; })[0];
    const inside = function(p){ return R.some(function(r){ return p[0]>r[0] && p[0]<r[2] && p[1]>r[1] && p[1]<r[3]; }); };
    for(const o of [off, 10, 7, 5, 3]){ const p = e[1] ? [e[1]<0 ? x0-o : x1+o, T.y] : [T.x, e[2]<0 ? y0-o : y1+o]; if(!inside(p)) return p; }
    return e[1] ? [e[1]<0 ? x0-3 : x1+3, T.y] : [T.x, e[2]<0 ? y0-3 : y1+3];
  }
  function clear(p, q){                                                /* 一段直线不压任何元件（元件框往里缩 1） */
    const mx = Math.min(p[0], q[0]), Mx = Math.max(p[0], q[0]), my = Math.min(p[1], q[1]), My = Math.max(p[1], q[1]);
    return R.every(function(r){ return Mx <= r[0]+1 || mx >= r[2]-1 || My <= r[1]+1 || my >= r[3]-1; });
  }
  function ok(path){ for(let i=0;i<path.length-1;i++) if(!clear(path[i], path[i+1])) return false; return true; }
  function len(path){ let s = 0; for(let i=0;i<path.length-1;i++) s += Math.abs(path[i][0]-path[i+1][0]) + Math.abs(path[i][1]-path[i+1][1]); return s; }
  const pa = out(A), pb = out(B), C = [[pa[0], pb[1]], [pb[0], pa[1]]];
  const cand = [[pa, C[0], pb], [pa, C[1], pb]];
  const xs = [], ys = [];
  R.forEach(function(r){ xs.push(r[0]-8-lane, r[2]+8+lane); ys.push(r[1]-8-lane, r[3]+8+lane); });
  xs.forEach(function(x){ cand.push([pa, [x, pa[1]], [x, pb[1]], pb]); });
  ys.forEach(function(y){ cand.push([pa, [pa[0], y], [pb[0], y], pb]); });
  xs.forEach(function(x){ ys.forEach(function(y){ cand.push([pa, [pa[0], y], [x, y], [x, pb[1]], pb]); cand.push([pa, [x, pa[1]], [x, y], [pb[0], y], pb]); }); });
  let best = null, bl = 1e9;
  cand.forEach(function(c){ if(ok(c)){ const l = len(c); if(l < bl){ bl = l; best = c; } } });
  if(!best) best = [pa, C[0], pb];                                     /* 实在找不到就退回先竖后横 */
  return [[A.x, A.y]].concat(best, [[B.x, B.y]]);
}

let AC=null, sndOn=true, humNode=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function click(f, dur, vol){
  if(!sndOn || !ac()) return;
  const n=AC.sampleRate*dur|0, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n, 2);
  const s=AC.createBufferSource(), bp=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=buf; bp.type='bandpass'; bp.frequency.value=f; g.gain.value=vol; s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start();
}
function hum(on){
  if(humNode){ const h=humNode; humNode=null; try{ h.g.gain.setTargetAtTime(0, AC.currentTime, 0.15); h.os.forEach(function(o){ o.stop(AC.currentTime+0.8); }); }catch(e){} }
  if(!on || !sndOn || !ac()) return;
  /* 纯音叠在一起像汽笛（11-10 他说像火车鸣笛）。真电动机主要是风扇的呼呼声：噪声过带通，再加一点很轻的 100Hz 电磁嗡 */
  const n=AC.sampleRate*2, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  let b=0; for(let i=0;i<n;i++){ b = b*0.97 + (Math.random()*2-1)*0.25; d[i]=b; }           /* 偏低频的噪声 */
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.6;
  const g=AC.createGain(); g.gain.value=0; g.gain.setTargetAtTime(0.9, AC.currentTime, 0.35);
  const o=AC.createOscillator(), og=AC.createGain(), lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=100; lp.type='lowpass'; lp.frequency.value=420; og.gain.value=0.1;
  src.connect(bp); bp.connect(g); o.connect(lp); lp.connect(og); og.connect(g); g.connect(AC.destination);
  src.start(); o.start(); humNode={g:g, os:[src, o]};
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

const _tv = new THREE.Vector3();
function nearTerm(e){ let best = null, bd = 26*26;
  for(const id in TERMS){ const p = TERMS[id].pick; if(p.userData.off || !shown(p)) continue;
    p.getWorldPosition(_tv).project(camera); const dx = (_tv.x+1)/2*W-e.clientX, dy = (1-_tv.y)/2*H-e.clientY, d = dx*dx+dy*dy;
    if(d<bd){ bd = d; best = p.userData.act; } }
  return best; }
function hit(e){
  ndc.set(e.clientX/W*2-1, -(e.clientY/H*2-1)); ray.setFromCamera(ndc, camera);
  const hs = ray.intersectObjects(picks, false).filter(function(h){ return !h.object.userData.off && shown(h.object); });
  const nt = nearTerm(e);
  if(nt && !(hs.length && hs[0].object.userData.act.type==='btn')) return nt;
  if(!hs.length) return null;
  const hard = hs.filter(function(h){ return h.object.userData.act.type!=='wire'; });   /* 按钮/开关优先于线 */
  return (hard[0] && hard[0].distance < hs[0].distance+60 ? hard[0] : hs[0]).object.userData.act;

};
document.getElementById('del').onclick = function(){   /* 撤销：拆掉最后接对的那根 */
  if(SIM.qf){ UI.msg='⚠ <b>带电不能拆线</b>：先分闸'; UI.sel=0; return; }
  let id = 0; while(DORD.length && !id){ const k = DORD.pop(); if(DONE[k]) id = k; }
  if(!id){ const ks = Object.keys(DONE).map(Number); if(!ks.length) return; id = Math.max.apply(null, ks); }
  delete DONE[id]; UI.msg='撤销了第 '+id+' 根'; UI.sel=0; applyDone();
};
document.getElementById('reset').onclick = function(){
  if((!doneN() && !Object.keys(UI.mount).length) || !confirm('把接好的线全部拆掉、元件也卸下来，重新来？')) return;
  simQF(false, performance.now()); for(const k in DONE) delete DONE[k]; UI.err=0; UI.sel=0; UI.pend=null; UI.hint=0; UI.msg=''; applyDone();
  UI.mount = {}; UI.part = null; UI.hintSlot = null; try{ localStorage.removeItem(LSM); }catch(e){}
};
document.getElementById('snd').onclick = function(){ sndOn = !sndOn; this.textContent = sndOn ? '🔊' : '🔇'; if(!sndOn) hum(false); else if(SIM.motor) hum(true); };
/* 屏幕尺寸变了（全屏、转屏）：没手动放大过就按新尺寸重新摆全景 */
function refit(){ const keep = CAM==='front' && !zoomedIn() && !rotOn; resize(); stretchBoard(); if(keep) view('front', true); }
/* 屏幕比板子细长时，灰色底板上下加长到正好贴住顶栏和底栏（全景下看不到留白） */
function stretchBoard(){
  const v = VIEWS.front(), t = Math.tan(camera.fov/2*Math.PI/180);
  const visH = 2*t*(v.D+20)*(H-topH-botH)/H;           /* 全景下顶栏到底栏之间，板面 z=0 处看得见的高度 */
  BOARD.scale.y = Math.max(1, (visH+4)/(BH+20));
}
window.addEventListener('resize', refit);

/* ══ 循环 ══ */
let tPrev = performance.now(), omega = 0;
function ease(o, target, dt){ o.v += (target-o.v)*Math.min(1, dt*22); }
function frame(now){
  const dt = Math.min(0.1, (now-tPrev)/1000); tPrev = now;
  simAdvance(now); drainEvents(); mountFrame(now);
  for(const id in ANIM.btn){ const o=ANIM.btn[id]; ease(o, SIM.btn[id].pressed ? 1 : 0, dt); o.mesh.position.z = o.z0 - o.v*7; }
  for(const id in ANIM.km){ const o=ANIM.km[id]; ease(o, (SIM.km[id].on||SIM.km[id].man) ? 1 : 0, dt); o.mesh.position.z = o.z0 - o.v*8; }
  ease(ANIM.fr, SIM.frTrip ? 1 : 0, dt); ANIM.fr.press = Math.max(0, (ANIM.fr.press||0) - dt*5);
  ANIM.fr.mesh.position.z = ANIM.fr.z0 + ANIM.fr.v*6 - ANIM.fr.press*4;      /* 按下去一下；脱扣后红钮弹出来 */
  ANIM.frReset.v = Math.max(0, ANIM.frReset.v - dt*5); ANIM.frReset.mesh.position.z = ANIM.frReset.z0 - ANIM.frReset.v*4;
  ANIM.frDial.rotation.z += (frDialAng(FR_SET.indexOf(SIM.frSet)) - ANIM.frDial.rotation.z)*Math.min(1, dt*12);
  for(const id in ANIM.fu){ const o = ANIM.fu[id]; o.v += ((SIM.fu[id] ? 0 : 1) - o.v)*Math.min(1, dt*10); o.pv.rotation.x = o.v*0.75; }
  const qa = SIM.qf ? -0.5 : 0.5; ANIM.qf.rotation.x += (qa-ANIM.qf.rotation.x)*Math.min(1, dt*20);
  { const ma = EX.on && EX.main ? -0.5 : 0.5; ANIM.main.rotation.x += (ma-ANIM.main.rotation.x)*Math.min(1, dt*20);
    const sa = !EX.on || EX.sign==='stand' ? 1.0 : 0; ANIM.sign.g.rotation.x += (sa-ANIM.sign.g.rotation.x)*Math.min(1, dt*14); }
  omega += (SIM.motor*14-omega)*Math.min(1, dt*1.8); fan.rotation.z -= omega*dt;
  if(fly){ fly.k = Math.min(1, fly.k+dt/0.45); const k = fly.k*fly.k*(3-2*fly.k);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if(fly.k>=1) fly=null; }
  controls.update(); if(!fly) camUI(); drawDots(now);
  const near = H/(2*camera.position.distanceTo(controls.target)*Math.tan(camera.fov/2*Math.PI/180)) > 0.66;   /* 每个板面单位占多少像素 */
  if(near!==UI.near){ UI.near = near; SMALL.forEach(function(m){ m.visible = near; }); }
  const s = sig()+(UI.rev ? '|rev'+UI.rev.k : ''); if(s!==UI.sig){ UI.sig = s; refresh(); hlApply(); }
  hlFrame(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
flushScrews();
/* 全景按「实际有东西的范围」装满屏幕（11-26 他嫌板子四周空地占地方）：看得见的零件外框 + 一点边；考场才出现的外部电源线不算 */
let CONTENT = null;
(function(){
  /* 只按元件外框 + 电动机 + 试车台算；伸到板边的进线、按钮盒出厂线不算（裁掉一点点不影响看） */
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  function add(a, b, c, d){ x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); }
  DEVICES.forEach(function(d){ add(d.x, d.y, d.x+d.W, d.y+d.H); });
  DUCTS.H.forEach(function(h){ add(h.x0-13, h.y-13, h.x1+13, h.y+13); }); DUCTS.V.forEach(function(v){ add(v.x-13, v.y0-13, v.x+13, v.y1+13); });   /* 线槽也算进取景：左右留白才对称 */
  if(MOT.y > 0) add(MOT.x-60, MOT.y-60, MOT.x+100, MOT.y+56);
  const bb = new THREE.Box3(), tmp = new THREE.Box3(); EXG.updateMatrixWorld(true);
  EXG.traverse(function(o){ if(!o.isMesh || !o.visible || (o.material && o.material.opacity===0)) return;
    for(let p=o; p && p!==EXG; p=p.parent) if(!p.visible) return; tmp.setFromObject(o); if(isFinite(tmp.min.x)) bb.union(tmp); });
  if(!bb.isEmpty()) add(bb.min.x+BW/2, BH/2-bb.max.y, bb.max.x+BW/2, BH/2-bb.min.y);
  const m = 14;
  CONTENT = {x:(x0+x1)/2, y:(y0+y1)/2, w:x1-x0+2*m, h:y1-y0+2*m};
})();
resize(); stretchBoard(); view(VIEWS[Q.get('v')] ? Q.get('v') : 'front', true);
if(Q.get('sel')) stepTo(+Q.get('sel'));
if(Q.has('wire')) setMode(true);
if(Q.has('exam')) exEnter();
if(Q.get('run')){ simQF(true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), false, performance.now()); }, 600); }, 300); }
window.K3 = {SIM:SIM, UI:UI, EX:EX, view:view, press:function(id, d){ simPress(id, d, performance.now()); }, qf:function(on){ simQF(on, performance.now()); }};
refresh(); requestAnimationFrame(frame);
</script>
</body>
