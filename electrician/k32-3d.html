DEVICES.forEach(function(d){ d.terminals.forEach(function(t){ TPOS[t.id]={x:d.x+t.x,y:d.y+t.y,device:d.id,label:t.label}; }); });
const TLABEL = {

  'km1-a1':'1号接触器A1','km1-a2':'1号接触器A2','km1-13':'1号接触器13','km1-14':'1号接触器14','km1-21':'1号接触器21','km1-22':'1号接触器22',
  'km2-a1':'2号接触器A1','km2-a2':'2号接触器A2','km2-13':'2号接触器13','km2-14':'2号接触器14','km2-21':'2号接触器21','km2-22':'2号接触器22',
  'tb-1':'端子排1（正转·动合）','tb-2':'端子排2（正转·动合）','tb-5':'端子排5（反转·动合）','tb-6':'端子排6（反转·动合）',
  'tb-11':'端子排11（停止·动断）','tb-12':'端子排12（停止·动断）',
  'tb-3':'端子排3（正转·动断）','tb-4':'端子排4（正转·动断）','tb-7':'端子排7（反转·动断）','tb-8':'端子排8（反转·动断）',
  'tb-9':'端子排9（停止·动合）','tb-10':'端子排10（停止·动合）','tb-last':'端子排最后一位'
};
const GROUPS = {
  1:['电源进线','4 号走热继电器（96 进、95 出去端子排 12 = 停止），5 号串两个线圈 A1'],
  2:['常闭对线圈','交叉接：我的 22NC 管对方的命 —— 1 号 22 → 2 号 A2，2 号 22 → 1 号 A2'],
  3:['常闭对常开','交叉接：我的 21NC 接对方的 14NO，再引一根下端子排。1 配 5，2 配 1'],
  4:['常开对常开','同名接：1 号 13NO → 2 号 13NO，再引一根去端子 2（公共点）'],
  5:['端子排跳线','2—6、6—11：都是公共点']
};
/* 14 根，数组顺序＝实际接线顺序；waypoints 是板面上手排的专用通道 */
const WIRES = [
  {id:1, from:'fu4-out',to:'fr-96', group:1,waypoints:[[160,258],[234,258],[234,614]]},
  {id:2, from:'fr-95',  to:'tb-12', group:1,waypoints:[[451,638],[451,522]]},
  {id:3, from:'fu5-out',to:'km2-a1',group:1,waypoints:[[202,266],[434,266]]},
  {id:4, from:'km2-a1', to:'km1-a1',group:1,waypoints:[[434,330],[220,330]]},
  {id:5, from:'km1-22', to:'km2-a2',group:2,waypoints:[[198,522],[434,522]]},
  {id:6, from:'km2-22', to:'km1-a2',group:2,waypoints:[[412,528],[220,528]]},
  {id:7, from:'km1-21', to:'km2-14',group:3,waypoints:[[198,274],[446,274],[446,534],[386,534]]},
  {id:8, from:'km2-14', to:'tb-5',  group:3,waypoints:[[386,516],[456,516],[456,354]]},
  {id:9, from:'km2-21', to:'km1-14',group:3,waypoints:[[412,282],[240,282],[240,540],[172,540]]},
  {id:10,from:'km2-21', to:'tb-1',  group:3,waypoints:[[412,348],[418,348],[418,258]]},
  {id:11,from:'km1-13', to:'km2-13',group:4,waypoints:[[172,320],[386,320]]},
  {id:12,from:'km2-13', to:'tb-2',  group:4,waypoints:[[386,310],[468,310],[468,282]]},
  {id:13,from:'tb-2',   to:'tb-6',  group:5,waypoints:[[481,282],[481,378]]},
  {id:14,from:'tb-6',   to:'tb-11', group:5,waypoints:[[484,378],[484,498]]}
];
const SPEC = {
  src:['fu4-out','fu5-out'],
  coils:[{id:'km1',a:'km1-a1',b:'km1-a2',name:'KM1'},{id:'km2',a:'km2-a1',b:'km2-a2',name:'KM2'}],
  contacts:[
    {a:'tb-1',b:'tb-2',no:true,by:'sb2'},{a:'tb-3',b:'tb-4',no:false,by:'sb2'},
    {a:'tb-5',b:'tb-6',no:true,by:'sb3'},{a:'tb-7',b:'tb-8',no:false,by:'sb3'},
    {a:'tb-9',b:'tb-10',no:true,by:'sb1'},{a:'tb-11',b:'tb-12',no:false,by:'sb1'},
    {a:'km1-13',b:'km1-14',no:true,by:'km1'},{a:'km1-21',b:'km1-22',no:false,by:'km1'},
    {a:'km2-13',b:'km2-14',no:true,by:'km2'},{a:'km2-21',b:'km2-22',no:false,by:'km2'},
    {a:'fr-95',b:'fr-96',no:false,by:'fr'}],
  buttons:[{id:'sb2',name:'正转',color:'#2f9e44'},{id:'sb3',name:'反转',color:'#e0a92e'},{id:'sb1',name:'停止',color:'#c0392b'}],
  motor:{km1:1,km2:-1}
};
let ACTIVE = WIRES;                 /* 仿真跑哪些线：看线时是全部 14 根，自己接时是已经接上的那几根 */
function setActive(a){ ACTIVE = a; }
const SW_DELAY=260, PICK=150, DROP=150, MIN_PRESS=SW_DELAY+PICK+80, STEP=10;
const SIM = {qf:false, frTrip:false, frSet:2, fu:{}, blown:'', motor:0, phaseLoss:false, btn:{}, km:{}, tLast:0, last:null, ev:[], sup:true, noMotor:false};   /* sup：考场里试车台没送电时 QF 上口是空的 */
function simReset(){
  SIM.qf=false; SIM.frTrip=false; SIM.blown=''; SIM.motor=0; SIM.phaseLoss=false; SIM.tLast=0; SIM.last=null; SIM.ev=[];
  SIM.fu = {'fu1-0':true, 'fu1-1':true, 'fu1-2':true, 'fu4-0':true, 'fu5-0':true};   /* 熔断器盒合着＝true，翻开＝那一相断 */
  SPEC.buttons.forEach(function(b){ SIM.btn[b.id]={pressed:false,no:false,nc:true,t:0,relAt:0}; });
  SPEC.coils.forEach(function(c){ SIM.km[c.id]={coil:false,on:false,man:false,t:0}; });   /* man：手按着推杆 */
}
function contactClosed(c){
  const k=SIM.km[c.by]; if(k) return c.no ? (k.on||k.man) : !(k.on||k.man);
  if(c.by==='fr') return c.no ? SIM.frTrip : !SIM.frTrip;
  const b=SIM.btn[c.by]; return c.no ? b.no : b.nc;
}
/* 电源边所在的双连通分量 = 这一刻真有电流的边（死支路带电但没电流，不算） */
function srcBlock(E){
  const adj={};
  E.forEach(function(e){ (adj[e.a]=adj[e.a]||[]).push([e,e.b]); (adj[e.b]=adj[e.b]||[]).push([e,e.a]); });
  const disc={}, low={}, stk=[]; let t=0, found=null;
  function dfs(u,pid){
    disc[u]=low[u]=++t;
    (adj[u]||[]).forEach(function(pr){
      const e=pr[0], v=pr[1];
      if(e.id===pid) return;
      if(disc[v]===undefined){
        stk.push(e); dfs(v,e.id); low[u]=Math.min(low[u],low[v]);
        if(low[v]>=disc[u]){ const comp=[]; let x; do{ x=stk.pop(); comp.push(x); }while(x!==e);
          if(!found && comp.some(function(y){ return y.k==='s'; })) found=comp; }
      } else if(disc[v]<disc[u]){ stk.push(e); low[u]=Math.min(low[u],disc[v]); }
    });
  }
  const s=E.filter(function(e){ return e.k==='s'; })[0];
  if(s) dfs(s.a,null);
  return found||[];
}
function solveNet(ws, closedFn){
  const res={coil:{}, cur:{}, pot:{}, short:false};
  SPEC.coils.forEach(function(c){ res.coil[c.id]=false; });
  const E=[];
  ws.forEach(function(w){ E.push({id:'w'+w.id,a:w.from,b:w.to,k:'w'}); });
  SPEC.contacts.forEach(function(c,i){ if(closedFn(c)) E.push({id:'c'+i,a:c.a,b:c.b,k:'c'}); });
  const P={};
  function fd(x){ if(P[x]===undefined) P[x]=x; while(P[x]!==x){ P[x]=P[P[x]]; x=P[x]; } return x; }
  E.forEach(function(e){ P[fd(e.a)]=fd(e.b); });
  const s0=fd(SPEC.src[0]), s1=fd(SPEC.src[1]);
  ws.forEach(function(w){ const r=fd(w.from); res.pot['w'+w.id]= r===s0 ? 1 : (r===s1 ? 2 : 0); });
  if(s0===s1){ res.short=true; return res; }      /* 不经过线圈就把 L1、L2 连上了＝控制回路短路 */
  SPEC.coils.forEach(function(c){ E.push({id:'k'+c.id,a:c.a,b:c.b,k:'k',coil:c}); });
  E.push({id:'src',a:SPEC.src[0],b:SPEC.src[1],k:'s'});
  const blk = srcBlock(E);
  blk.forEach(function(e){ res.cur[e.id]=true; if(e.k==='k') res.coil[e.coil.id]=true; });
  /* 电位：把整张网（线、闭合的触点、全部线圈）当电阻网络解一遍：线/触点 1Ω，线圈 1000Ω，L1=1、L2=0。
     用途两个：①光点方向（电流从电位高往低走，并联的自锁支路也判得对）；
     ②外皮颜色（带电＝跟 L1 或 L2 连着，哪怕中间隔着一个没电流的线圈，验电笔照样亮；悬空的才算不带电） */
  const EV = E.filter(function(e){ return e.k!=='s'; });
  const Q = {}; function fq(x){ if(Q[x]===undefined) Q[x]=x; while(Q[x]!==x){ Q[x]=Q[Q[x]]; x=Q[x]; } return x; }
  EV.forEach(function(e){ Q[fq(e.a)] = fq(e.b); });
  const live = fq(SPEC.src[0]);
  const ns = [], ix = {}; EV.forEach(function(e){ [e.a, e.b].forEach(function(n){ if(ix[n]===undefined && fq(n)===live){ ix[n]=ns.length; ns.push(n); } }); });
  const N = ns.length, A = [], B = new Array(N).fill(0), isSrc = function(n){ return n===SPEC.src[0] || n===SPEC.src[1]; };
  for(let i=0;i<N;i++) A.push(new Array(N).fill(0));
  ns.forEach(function(n, i){ if(isSrc(n)){ A[i][i] = 1; B[i] = n===SPEC.src[0] ? 1 : 0; } });
  EV.forEach(function(e){ const i = ix[e.a], j = ix[e.b]; if(i===undefined || j===undefined) return; const g = e.k==='k' ? 0.001 : 1;
    if(!isSrc(ns[i])){ A[i][i] += g; A[i][j] -= g; }
    if(!isSrc(ns[j])){ A[j][j] += g; A[j][i] -= g; } });
  for(let c=0;c<N;c++){                                   /* 高斯消元（节点就二三十个） */
    let pv = c; for(let r=c+1;r<N;r++) if(Math.abs(A[r][c])>Math.abs(A[pv][c])) pv = r;
    [A[c], A[pv]] = [A[pv], A[c]]; [B[c], B[pv]] = [B[pv], B[c]];
    if(Math.abs(A[c][c]) < 1e-12) continue;
    for(let r=0;r<N;r++){ if(r===c) continue; const f = A[r][c]/A[c][c]; if(!f) continue;
      for(let k=c;k<N;k++) A[r][k] -= f*A[c][k]; B[r] -= f*B[c]; }
  }
  const volt = {}; ns.forEach(function(n, i){ volt[n] = Math.abs(A[i][i])>1e-12 ? B[i]/A[i][i] : 0.5; });
  res.volt = volt;
  ws.forEach(function(w){ const v = volt[w.from]; res.pot['w'+w.id] = v===undefined ? 0 : v>=0.5 ? 1 : 2; });
  return res;
}
function powered(){ return SIM.qf && !SIM.blown && SIM.sup && SIM.fu['fu4-0']!==false && SIM.fu['fu5-0']!==false; }   /* 控制回路电：QF 合、4/5 号熔断器盒都合着 */
function simSolve(){
  if(powered()) return solveNet(ACTIVE, contactClosed);
  const res={coil:{}, cur:{}, pot:{}, short:false};
  SPEC.coils.forEach(function(c){ res.coil[c.id]=false; });
  return res;
}
/* 不带时间的测试台：判「这套线接得对不对」用。按下＝动断先断再动合接通，每一下等电路稳定 */
function makeTester(ws){
  const st={btn:{}, km:{}, fr:false, stuck:{}, bad:''};
  function closed(c){
    if(st.km[c.by]!==undefined){ const on = st.stuck[c.by] || st.km[c.by]; return c.no ? on : !on; }
    if(c.by==='fr') return c.no ? st.fr : !st.fr;
    const b=st.btn[c.by]; return c.no ? b.no : b.nc;
  }
  function settle(){
    let i=0;
    for(; i<20; i++){
      const r = solveNet(ws, closed);
      if(r.short){ if(!st.bad) st.bad='short'; SPEC.coils.forEach(function(c){ st.km[c.id]=false; }); return; }
      const c = SPEC.coils.filter(function(c){ return st.km[c.id]!==r.coil[c.id]; })[0];
      if(!c) break;
      st.km[c.id] = r.coil[c.id];
      if(!st.bad && st.km.km1 && st.km.km2) st.bad='both';       /* 中间两只同时合过一下也算相间短路 */
    }

/* ══ 导线 ══ 线头落在端子面上，出了元件就抬到自己那一层（每根线一层高度，转过来看互不穿插） */
function exitPt(p, q, d){
  const L = Math.hypot(q[0]-p[0], q[1]-p[1]); if(!d || L<0.01) return p;
  const dx=(q[0]-p[0])/L, dy=(q[1]-p[1])/L, m=5;
  const tx = dx>0 ? (d.x+d.w+m-p[0])/dx : dx<0 ? (d.x-m-p[0])/dx : 1e9;
  const ty = dy>0 ? (d.y+d.h+m-p[1])/dy : dy<0 ? (d.y-m-p[1])/dy : 1e9;
  const t = Math.min(Math.max(0, Math.min(tx, ty)), L);
  return [p[0]+dx*t, p[1]+dy*t];
}
function toward(p, q, s){ const L=Math.hypot(q[0]-p[0], q[1]-p[1])||1; return [p[0]+(q[0]-p[0])/L*s, p[1]+(q[1]-p[1])/L*s]; }
function d2(p, q){ return Math.hypot(q[0]-p[0], q[1]-p[1]); }
function path3(p2, za, zb, lane, da, db){
  const n=p2.length, out=[];
  function push(p, z){ const v=V(p[0], p[1], z); if(!out.length || out[out.length-1].distanceTo(v)>0.5) out.push(v); }
  if(za!=null){ push(p2[0], za); const e=exitPt(p2[0], p2[1], da); push(e, za); if(d2(e, p2[1])>8) push(toward(e, p2[1], 6), lane); }
  else push(p2[0], lane);
  for(let i=1;i<n-1;i++) push(p2[i], lane);
  if(zb!=null){ const e=exitPt(p2[n-1], p2[n-2], db); if(d2(e, p2[n-2])>8) push(toward(e, p2[n-2], 6), lane); push(e, zb); push(p2[n-1], zb); }
  else push(p2[n-1], lane);
  return out;
}

function exScan(){

  let main=false, qf=false, chk={}, n1=0, n2=0; const con={};
  function ord(t){ if(F.order.indexOf(t)<0) F.order.push(t); }
  EX.ev.forEach(function(e){
    const nCon = Object.keys(con).length;
    if(e.k==='chk') chk[e.id]=1;
    if(e.k==='rep'){
      if(e.id==='env' && !F.conSeq.length) F.repEnv = true;
      else if(e.id==='wired' && nCon===11 && !F.everOn) F.repWired = true;
      else if(e.id==='done' && F.everOff && nCon===0) F.repDone = true;
      else F.repWrong.push(REPS[e.id]);
    }
    if(e.k==='con' || e.k==='dis'){
      if(main || qf) F.hot = true;
      if(e.k==='con'){ if(F.chkAtCon===null) F.chkAtCon = !!(chk.main && chk.qf); if(!F.everOn) F.conSeq.push(e.id); con[e.id]=1; }
      else { if(F.everOff){ F.disSeq.push(e.id); if(n2===0) F.disBeforeProbe2 = true; } delete con[e.id]; }
    }
    if(e.k==='sw'){
      if(e.hand==='L') F.left.push((e.on ? '合' : '分')+(e.id==='main' ? '试车台总开关' : '盘上开关'));
      if(e.id==='main'){
        if(e.on){ if(qf) ord('送电先合了盘上开关（应该先总闸、再盘上）'); if(F.signAtOn===null) F.signAtOn = e.sign; }
        else if(qf) ord('断电先断了试车台总开关（应该先盘上、再总闸）');
        main = e.on;
      } else qf = e.on;
      if(main && qf) F.everOn = true;
      if(F.everOn && !main && !qf) F.everOff = true;
    }
    if(e.k==='sign'){ if(e.hand==='L') F.left.push(e.to==='flat' ? '扣放标识牌' : '立牌'); if(e.to==='stand' && F.everOff) F.standAfterOff = true; }

function click(f, dur, vol){

  document.addEventListener('fullscreenchange', function(){
    b.textContent = document.fullscreenElement ? '退出全屏' : '全屏'; setTimeout(refit, 150);
  });
})();

document.querySelectorAll('.views button[data-v]').forEach(function(b){ b.onclick = function(){ view(b.dataset.v); }; });
function stepTo(n){ UI.sel = Math.max(1, Math.min(14, n)); UI.step = true; }
document.getElementById('prev').onclick = function(){ stepTo(UI.sel ? UI.sel-1 : 14); };
document.getElementById('next').onclick = function(){ stepTo(UI.sel+1); };
cnt.onclick = function(){ UI.sel = 0; UI.step = false; };
document.getElementById('exam').onclick = function(){ if(EX.on) exExit(); else exEnter(); };
/* 拆线：选中了线就直接拆；没选中就进「拆线模式」，点端子列出接在它上面的线挑着拆（线细不好点中，端子好点） */
document.getElementById('edel').onclick = function(){
  if(UI.sel){ exDelWire(UI.sel); exSave(); EX.msg = '拆掉了'; UI.sel = 0; EX.delMode = false; return; }
  EX.delMode = !EX.delMode; UI.pend = null;
  EX.msg = EX.delMode ? '拆线：点要拆的那根线<b>任意一头的端子</b>（再点「拆这根」退出）' : '';
};
document.getElementById('edone').onclick = exWireDone;
document.getElementById('epen').onclick = function(){ EX.pen = !EX.pen; EX.msg = EX.pen ? '验电笔拿在手上了：点要验的位置' : '验电笔放下了'; };
document.getElementById('eglove').onclick = function(){ EX.glove = !EX.glove; exLog('glove', {on:EX.glove}); EX.msg = EX.glove ? '戴上了手套' : '摘下了手套'; };
document.getElementById('erep').onclick = function(){
  menu('向考官报告：说哪一句？', ['env','x1','wired','x2','done'].map(function(k){ return ['「'+REPS[k]+'」', function(){ EX.rep[k]=1; exLog('rep', {id:k}); EX.msg = '你报告了：「'+REPS[k]+'」'; }]; }));
};
document.getElementById('esub').onclick = function(){ menu('交卷？', [['交卷，看成绩单', exSheet]]); };
info.onclick = function(){ if(EX.on) EX.guide = !EX.guide; };
ov.onclick = function(e){ if(e.target===ov) closeMenu(); };
document.getElementById('mode').onclick = function(){ setMode(!UI.wire); };
document.getElementById('hint').onclick = function(){
  const w = WIRES.filter(function(w){ return !DONE[w.id]; })[0];
  UI.pend=null; UI.sel=0;
  if(!w){ UI.msg='14 根都接完了，点断路器 QF 合闸试车'; return; }
  UI.hint=w.id; UI.msg='提示 · <b>第 '+w.id+' 根</b>（'+GROUPS[w.group][0]+'）：'+tname(w.from)+' → '+tname(w.to)+'<div class="st">'+GROUPS[w.group][1]+'</div>';
};
document.getElementById('del').onclick = function(){
  if(SIM.qf){ UI.msg='⚠ <b>带电不能拆线</b>：先分闸'; UI.sel=0; return; }
  if(UI.sel && DONE[UI.sel]){ delete DONE[UI.sel]; UI.msg='拆掉了第 '+UI.sel+' 根'; UI.sel=0; applyDone(); }
};
document.getElementById('reset').onclick = function(){
  if(!doneN() || !confirm('把接好的线全部拆掉，重新来？')) return;
  simQF(false, performance.now()); for(const k in DONE) delete DONE[k]; UI.err=0; UI.sel=0; UI.pend=null; UI.hint=0; UI.msg=''; applyDone();
};
document.getElementById('snd').onclick = function(){ sndOn = !sndOn; this.textContent = sndOn ? '🔊' : '🔇'; if(!sndOn) hum(false); else if(SIM.motor) hum(true); };
/* 屏幕尺寸变了（全屏、转屏）：没手动放大过就按新尺寸重新摆全景 */
function refit(){ const keep = CAM==='front' && !zoomedIn() && !rotOn; resize(); stretchBoard(); if(keep) view('front', true); }
/* 屏幕比板子细长时，灰色底板上下加长到正好贴住顶栏和底栏（全景下看不到留白） */
function stretchBoard(){
  const v = VIEWS.front(), t = Math.tan(camera.fov/2*Math.PI/180);
  const visH = 2*t*(v.D+20)*(H-topH-botH)/H;           /* 全景下顶栏到底栏之间，板面 z=0 处看得见的高度 */
  BOARD.scale.y = Math.max(1, (visH+4)/(BH+20));
}
window.addEventListener('resize', refit);

/* ══ 循环 ══ */
let tPrev = performance.now(), omega = 0;
function ease(o, target, dt){ o.v += (target-o.v)*Math.min(1, dt*22); }
function frame(now){
  const dt = Math.min(0.1, (now-tPrev)/1000); tPrev = now;
  simAdvance(now); drainEvents();
  for(const id in ANIM.btn){ const o=ANIM.btn[id]; ease(o, SIM.btn[id].pressed ? 1 : 0, dt); o.mesh.position.z = o.z0 - o.v*7; }
  for(const id in ANIM.km){ const o=ANIM.km[id]; ease(o, (SIM.km[id].on||SIM.km[id].man) ? 1 : 0, dt); o.mesh.position.z = o.z0 - o.v*8; }
  ease(ANIM.fr, SIM.frTrip ? 1 : 0, dt); ANIM.fr.press = Math.max(0, (ANIM.fr.press||0) - dt*5);
  ANIM.fr.mesh.position.z = ANIM.fr.z0 + ANIM.fr.v*6 - ANIM.fr.press*4;      /* 按下去一下；脱扣后红钮弹出来 */
  ANIM.frReset.v = Math.max(0, ANIM.frReset.v - dt*5); ANIM.frReset.mesh.position.z = ANIM.frReset.z0 - ANIM.frReset.v*4;
  ANIM.frDial.rotation.z += (frDialAng(FR_SET.indexOf(SIM.frSet)) - ANIM.frDial.rotation.z)*Math.min(1, dt*12);
  for(const id in ANIM.fu){ const o = ANIM.fu[id]; o.v += ((SIM.fu[id] ? 0 : 1) - o.v)*Math.min(1, dt*10); o.pv.rotation.x = o.v*0.75; }
  const qa = SIM.qf ? -0.5 : 0.5; ANIM.qf.rotation.x += (qa-ANIM.qf.rotation.x)*Math.min(1, dt*20);
  { const ma = EX.on && EX.main ? -0.5 : 0.5; ANIM.main.rotation.x += (ma-ANIM.main.rotation.x)*Math.min(1, dt*20);
    const sa = !EX.on || EX.sign==='stand' ? 1.0 : 0; ANIM.sign.g.rotation.x += (sa-ANIM.sign.g.rotation.x)*Math.min(1, dt*14); }
  omega += (SIM.motor*14-omega)*Math.min(1, dt*1.8); fan.rotation.z -= omega*dt;
  if(fly){ fly.k = Math.min(1, fly.k+dt/0.45); const k = fly.k*fly.k*(3-2*fly.k);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if(fly.k>=1) fly=null; }
  controls.update(); if(!fly) camUI(); drawDots(now);
  const near = H/(2*camera.position.distanceTo(controls.target)*Math.tan(camera.fov/2*Math.PI/180)) > 0.66;   /* 每个板面单位占多少像素 */
  if(near!==UI.near){ UI.near = near; SMALL.forEach(function(m){ m.visible = near; }); }
  const s = sig(); if(s!==UI.sig){ UI.sig = s; refresh(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
flushScrews();
resize(); stretchBoard(); view(VIEWS[Q.get('v')] ? Q.get('v') : 'front', true);
if(Q.get('sel')) stepTo(+Q.get('sel'));
if(Q.has('wire')) setMode(true);
if(Q.has('exam')) exEnter();
if(Q.get('run')){ simQF(true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), false, performance.now()); }, 600); }, 300); }
window.K3 = {SIM:SIM, UI:UI, EX:EX, view:view, press:function(id, d){ simPress(id, d, performance.now()); }, qf:function(on){ simQF(on, performance.now()); }};
refresh(); requestAnimationFrame(frame);
</script>
</body>
</html>
