  'km2-a1':'2号接触器A1','km2-a2':'2号接触器A2','km2-13':'2号接触器13','km2-14':'2号接触器14','km2-21':'2号接触器21','km2-22':'2号接触器22',

const WIRES = [

  {id:2, from:'fr-95',  to:'tb-12', group:1,waypoints:[[451,638],[451,522]]},

  {id:5, from:'km1-22', to:'km2-a2',group:2,waypoints:[[198,522],[434,522]]},
  {id:6, from:'km2-22', to:'km1-a2',group:2,waypoints:[[412,528],[220,528]]},
  {id:7, from:'km1-21', to:'km2-14',group:3,waypoints:[[198,274],[446,274],[446,534],[386,534]]},
  {id:8, from:'km2-14', to:'tb-5',  group:3,waypoints:[[386,516],[456,516],[456,354]]},
  {id:9, from:'km2-21', to:'km1-14',group:3,waypoints:[[412,282],[240,282],[240,540],[172,540]]},
  {id:10,from:'km2-21', to:'tb-1',  group:3,waypoints:[[412,348],[418,348],[418,258]]},
  {id:11,from:'km1-13', to:'km2-13',group:4,waypoints:[[172,320],[386,320]]},
  {id:12,from:'km2-13', to:'tb-2',  group:4,waypoints:[[386,310],[468,310],[468,282]]},
  {id:13,from:'tb-2',   to:'tb-6',  group:5,waypoints:[[481,282],[481,378]]},
  {id:14,from:'tb-6',   to:'tb-11', group:5,waypoints:[[484,378],[484,498]]}
];
const SPEC = {
  src:['fu4-out','fu5-out'],
  coils:[{id:'km1',a:'km1-a1',b:'km1-a2',name:'KM1'},{id:'km2',a:'km2-a1',b:'km2-a2',name:'KM2'}],
  contacts:[
    {a:'tb-1',b:'tb-2',no:true,by:'sb2'},{a:'tb-3',b:'tb-4',no:false,by:'sb2'},
    {a:'tb-5',b:'tb-6',no:true,by:'sb3'},{a:'tb-7',b:'tb-8',no:false,by:'sb3'},
    {a:'tb-9',b:'tb-10',no:true,by:'sb1'},{a:'tb-11',b:'tb-12',no:false,by:'sb1'},
    {a:'km1-13',b:'km1-14',no:true,by:'km1'},{a:'km1-21',b:'km1-22',no:false,by:'km1'},
    {a:'km2-13',b:'km2-14',no:true,by:'km2'},{a:'km2-21',b:'km2-22',no:false,by:'km2'},
    {a:'fr-95',b:'fr-96',no:false,by:'fr'}],
  buttons:[{id:'sb2',name:'正转',color:'#2f9e44'},{id:'sb3',name:'反转',color:'#e0a92e'},{id:'sb1',name:'停止',color:'#c0392b'}],
  motor:{km1:1,km2:-1}
};
let ACTIVE = WIRES;                 /* 仿真跑哪些线：看线时是全部 14 根，自己接时是已经接上的那几根 */
function setActive(a){ ACTIVE = a; }
const SW_DELAY=260, PICK=150, DROP=150, MIN_PRESS=SW_DELAY+PICK+80, STEP=10;
const SIM = {qf:false, frTrip:false, blown:'', motor:0, btn:{}, km:{}, tLast:0, last:null, ev:[], sup:true, noMotor:false};   /* sup：考场里试车台没送电时 QF 上口是空的 */
function simReset(){
  SIM.qf=false; SIM.frTrip=false; SIM.blown=''; SIM.motor=0; SIM.tLast=0; SIM.last=null; SIM.ev=[];
  SPEC.buttons.forEach(function(b){ SIM.btn[b.id]={pressed:false,no:false,nc:true,t:0,relAt:0}; });
  SPEC.coils.forEach(function(c){ SIM.km[c.id]={coil:false,on:false,t:0}; });
}
function contactClosed(c){
  const k=SIM.km[c.by]; if(k) return c.no ? k.on : !k.on;
  if(c.by==='fr') return c.no ? SIM.frTrip : !SIM.frTrip;
  const b=SIM.btn[c.by]; return c.no ? b.no : b.nc;
}
/* 电源边所在的双连通分量 = 这一刻真有电流的边（死支路带电但没电流，不算） */
function srcBlock(E){
  const adj={};
  E.forEach(function(e){ (adj[e.a]=adj[e.a]||[]).push([e,e.b]); (adj[e.b]=adj[e.b]||[]).push([e,e.a]); });
  const disc={}, low={}, stk=[]; let t=0, found=null;
  function dfs(u,pid){
    disc[u]=low[u]=++t;
    (adj[u]||[]).forEach(function(pr){
      const e=pr[0], v=pr[1];
      if(e.id===pid) return;
      if(disc[v]===undefined){
        stk.push(e); dfs(v,e.id); low[u]=Math.min(low[u],low[v]);
        if(low[v]>=disc[u]){ const comp=[]; let x; do{ x=stk.pop(); comp.push(x); }while(x!==e);
          if(!found && comp.some(function(y){ return y.k==='s'; })) found=comp; }
      } else if(disc[v]<disc[u]){ stk.push(e); low[u]=Math.min(low[u],disc[v]); }
    });
  }
  const s=E.filter(function(e){ return e.k==='s'; })[0];
  if(s) dfs(s.a,null);
  return found||[];
}
function solveNet(ws, closedFn){
  const res={coil:{}, cur:{}, pot:{}, short:false};
  SPEC.coils.forEach(function(c){ res.coil[c.id]=false; });
  const E=[];
  ws.forEach(function(w){ E.push({id:'w'+w.id,a:w.from,b:w.to,k:'w'}); });
  SPEC.contacts.forEach(function(c,i){ if(closedFn(c)) E.push({id:'c'+i,a:c.a,b:c.b,k:'c'}); });
  const P={};
  function fd(x){ if(P[x]===undefined) P[x]=x; while(P[x]!==x){ P[x]=P[P[x]]; x=P[x]; } return x; }
  E.forEach(function(e){ P[fd(e.a)]=fd(e.b); });
  const s0=fd(SPEC.src[0]), s1=fd(SPEC.src[1]);
  ws.forEach(function(w){ const r=fd(w.from); res.pot['w'+w.id]= r===s0 ? 1 : (r===s1 ? 2 : 0); });
  if(s0===s1){ res.short=true; return res; }      /* 不经过线圈就把 L1、L2 连上了＝控制回路短路 */
  SPEC.coils.forEach(function(c){ E.push({id:'k'+c.id,a:c.a,b:c.b,k:'k',coil:c}); });
  E.push({id:'src',a:SPEC.src[0],b:SPEC.src[1],k:'s'});
  srcBlock(E).forEach(function(e){ res.cur[e.id]=true; if(e.k==='k') res.coil[e.coil.id]=true; });
  return res;
}
function powered(){ return SIM.qf && !SIM.blown && SIM.sup; }
function simSolve(){
  if(powered()) return solveNet(ACTIVE, contactClosed);
  const res={coil:{}, cur:{}, pot:{}, short:false};
  SPEC.coils.forEach(function(c){ res.coil[c.id]=false; });
  return res;
}
/* 不带时间的测试台：判「这套线接得对不对」用。按下＝动断先断再动合接通，每一下等电路稳定 */
function makeTester(ws){
  const st={btn:{}, km:{}, fr:false, stuck:{}, bad:''};
  function closed(c){
    if(st.km[c.by]!==undefined){ const on = st.stuck[c.by] || st.km[c.by]; return c.no ? on : !on; }
    if(c.by==='fr') return c.no ? st.fr : !st.fr;
    const b=st.btn[c.by]; return c.no ? b.no : b.nc;
  }
  function settle(){
    let i=0;
    for(; i<20; i++){
      const r = solveNet(ws, closed);
      if(r.short){ if(!st.bad) st.bad='short'; SPEC.coils.forEach(function(c){ st.km[c.id]=false; }); return; }
      const c = SPEC.coils.filter(function(c){ return st.km[c.id]!==r.coil[c.id]; })[0];
      if(!c) break;
      st.km[c.id] = r.coil[c.id];
      if(!st.bad && st.km.km1 && st.km.km2) st.bad='both';       /* 中间两只同时合过一下也算相间短路 */
    }
    if(i===20 && !st.bad) st.bad='buzz';
  }
  function press(id){ st.btn[id].nc=false; settle(); st.btn[id].no=true; settle(); }
  function release(id){ st.btn[id].no=false; settle(); st.btn[id].nc=true; settle(); }
  function reset(){
    SPEC.buttons.forEach(function(b){ st.btn[b.id]={no:false, nc:true}; });
    SPEC.coils.forEach(function(c){ st.km[c.id]=false; });
    st.fr=false; st.stuck={}; settle();
  }
  reset();
  return { press:press, release:release, reset:reset, tap:function(id){ press(id); release(id); },
    fr:function(t){ st.fr=t; settle(); }, stick:function(id){ st.stuck[id]=true; settle(); },
    on:function(id){ return !!st.km[id]; }, get bad(){ return st.bad; } };
}

const CHECKS = [

/* 判一套线：通电检查 + 跟标准接法的端子差别 */
function gradeWires(ws){
  const T = makeTester(ws), res = {checks:[], bad:'', miss:[], extra:[]};
  CHECKS.forEach(function(c){ T.reset(); const r = c.f(T); res.checks.push({n:c.n, ok:r, h:c.h}); });
  res.bad = T.bad;
  function key(w){ return [w.from, w.to].sort().join('|'); }
  const std={}, got={};
  WIRES.forEach(function(w){ std[key(w)]=w; }); ws.forEach(function(w){ got[key(w)]=w; });
  for(const k in std) if(!got[k]) res.miss.push(std[k]);
  for(const k in got) if(!std[k]) res.extra.push(got[k]);
  res.pass = !res.bad && res.checks.every(function(c){ return c.ok===true; });
  return res;
}

    if(s.pressed && !s.no && now-s.t>=SW_DELAY) s.no=true;      /* 复合按钮：动断先断，动合后合 */
    if(!s.pressed && !s.nc && now-s.t>=SW_DELAY) s.nc=true;
  });

  if(r.short){ SIM.blown='控制回路短路，4 号熔断器熔断'; ev('bang'); r=simSolve(); }
  let moved=false;

    const k=SIM.km[c.id], e=r.coil[c.id];
    if(e!==k.coil){ k.coil=e; k.t=now; }
    if(k.on!==k.coil && now-k.t>=(k.coil?PICK:DROP)){ k.on=k.coil; moved=true; ev('km',c.id); r=simSolve(); }
  });

  SIM.motor=dir; SIM.last=r;
}

function exitPt(p, q, d){
  const L = Math.hypot(q[0]-p[0], q[1]-p[1]); if(!d || L<0.01) return p;
  const dx=(q[0]-p[0])/L, dy=(q[1]-p[1])/L, m=5;
  const tx = dx>0 ? (d.x+d.w+m-p[0])/dx : dx<0 ? (d.x-m-p[0])/dx : 1e9;
  const ty = dy>0 ? (d.y+d.h+m-p[1])/dy : dy<0 ? (d.y-m-p[1])/dy : 1e9;
  const t = Math.min(Math.max(0, Math.min(tx, ty)), L);
  return [p[0]+dx*t, p[1]+dy*t];
}
function toward(p, q, s){ const L=Math.hypot(q[0]-p[0], q[1]-p[1])||1; return [p[0]+(q[0]-p[0])/L*s, p[1]+(q[1]-p[1])/L*s]; }
function d2(p, q){ return Math.hypot(q[0]-p[0], q[1]-p[1]); }
function path3(p2, za, zb, lane, da, db){
  const n=p2.length, out=[];
  function push(p, z){ const v=V(p[0], p[1], z); if(!out.length || out[out.length-1].distanceTo(v)>0.5) out.push(v); }
  if(za!=null){ push(p2[0], za); const e=exitPt(p2[0], p2[1], da); push(e, za); if(d2(e, p2[1])>8) push(toward(e, p2[1], 6), lane); }

function exAddWire(a, b){

  const w = std ? {id:std.id, from:std.from, to:std.to} : {id:EX.nextId++, from:a, to:b};

    const pts = path3([[A.x,A.y],[B.x,B.y]], TZ[a]+4, TZ[b]+4, 100+(w.id%8)*3, dev(A.device), dev(B.device));

    const mesh = tube(pts, 2.3, mat), pick = tube(pts, 9, new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
    pick.castShadow = false; pick.userData.act = {type:'wire', id:w.id}; picks.push(pick);

/* 把操作记录从头放一遍，得出判分要的事实（顺序、带电接拆线、左手……）*/
function exScan(){
  const F = {chkAtCon:null, left:[], hot:false, order:[], signAtOn:null, everOn:false, everOff:false, btnBeforeProbe:false, btnNoGlove:false,
    probeGlove:false, saidBad:0, disBeforeProbe2:false, standAfterOff:false, repEnv:false, repWired:false, repDone:false, repWrong:[], conSeq:[], disSeq:[]};
  let main=false, qf=false, chk={}, n1=0, n2=0; const con={};
  function ord(t){ if(F.order.indexOf(t)<0) F.order.push(t); }
  EX.ev.forEach(function(e){
    const nCon = Object.keys(con).length;
    if(e.k==='chk') chk[e.id]=1;
    if(e.k==='rep'){
      if(e.id==='env' && !F.conSeq.length) F.repEnv = true;
      else if(e.id==='wired' && nCon===11 && !F.everOn) F.repWired = true;
      else if(e.id==='done' && F.everOff && nCon===0) F.repDone = true;
      else F.repWrong.push(REPS[e.id]);
    }
    if(e.k==='con' || e.k==='dis'){
      if(main || qf) F.hot = true;
      if(e.k==='con'){ if(F.chkAtCon===null) F.chkAtCon = !!(chk.main && chk.qf); if(!F.everOn) F.conSeq.push(e.id); con[e.id]=1; }
      else { if(F.everOff){ F.disSeq.push(e.id); if(n2===0) F.disBeforeProbe2 = true; } delete con[e.id]; }
    }
    if(e.k==='sw'){
      if(e.hand==='L') F.left.push((e.on ? '合' : '分')+(e.id==='main' ? '试车台总开关' : '盘上开关'));
      if(e.id==='main'){
        if(e.on){ if(qf) ord('送电先合了盘上开关（应该先总闸、再盘上）'); if(F.signAtOn===null) F.signAtOn = e.sign; }
        else if(qf) ord('断电先断了试车台总开关（应该先盘上、再总闸）');
        main = e.on;
      } else qf = e.on;
      if(main && qf) F.everOn = true;
      if(F.everOn && !main && !qf) F.everOff = true;
    }
    if(e.k==='sign'){ if(e.hand==='L') F.left.push(e.to==='flat' ? '扣放标识牌' : '立牌'); if(e.to==='stand' && F.everOff) F.standAfterOff = true; }
    if(e.k==='probe'){
      if(e.glove) F.probeGlove = true;
      if(e.said!==e.live) F.saidBad++;
      if(e.live && e.said && PROBE1.indexOf(e.id)>=0) n1++;
      if(F.everOff && !e.live && !e.said && PROBE2.indexOf(e.id)>=0) n2++;
    }
    if(e.k==='btn' && e.pw){ if(!e.np) F.btnBeforeProbe = true; if(!e.glove) F.btnNoGlove = true; }
  });
  function firstDiff(seq, want){ for(let i=0;i<seq.length;i++) if(seq[i]!==want[i]) return i; return -1; }
  let d = firstDiff(F.conSeq, CON_ORDER);
  if(d>=0) ord('接线顺序：第 '+(d+1)+' 个应该接「'+XT[CON_ORDER[d]].name+'」（先地线，再电机线黄绿红，再电源线黄绿红）');
  d = firstDiff(F.disSeq, DIS_ORDER);
  if(d>=0) ord('拆线顺序：第 '+(d+1)+' 个应该拆「'+XT[DIS_ORDER[d]].name+'」（红绿黄，地线最后：先电机地线、再电源箱地线）');
  return F;
}
function exGrade(){
  const F = exScan(), R = {fail:[], ded:[], wrong:[], undone:[], wire:EX.grade, skipped:EX.skipped};
  const nCon = Object.keys(EX.con).length, n1 = Object.keys(EX.p1).length, n2 = Object.keys(EX.p2).length;
  if(F.chkAtCon===false || (F.chkAtCon===null && !(EX.chk.main && EX.chk.qf))) R.fail.push('没有「确认电源开关」动作：接线前要确认试车台总开关和盘上开关都在分闸');
  if(F.everOn && (F.btnBeforeProbe || (!n1 && EX.seq>0))) R.fail.push('送电后不验电就试车');
  else if(F.everOn && n1<8) R.wrong.push('送电后验电不全：8 处只验了 '+n1+' 处');
  if(F.everOff && (F.disBeforeProbe2 || (!n2 && nCon<11))) R.fail.push('断电后没有二次验电就拆线');
  else if(F.everOff && n2<3) R.wrong.push('二次验电不全：接线排电源端子三相只验了 '+n2+' 处');
  if(F.hot) R.ded.push([25, '开关在合闸状态下接线 / 拆线']);
  if(F.everOn && EX.sign!=='stand') R.ded.push([10, '断电后没有立牌']);
  if(F.order.length) R.ded.push([20, '操作顺序相反：'+F.order.join('；')]);
  if(F.left.length) R.wrong.push('用了左手：'+F.left.join('、')+'（合闸、接拆线都用右手）');
  if(F.conSeq.length && !F.repEnv) R.wrong.push('接线前没报告「'+REPS.env+'」');
  if(F.everOn && !F.repWired) R.wrong.push('送电前没报告「'+REPS.wired+'」');
  F.repWrong.forEach(function(t){ R.wrong.push('报告说得不对或时机不对：「'+t+'」'); });
  if(F.signAtOn==='stand') R.wrong.push('合总开关时标识牌还立着：送电前要先（右手）把牌扣放');
  if(F.probeGlove) R.wrong.push('戴着手套验电：验电要摘手套');
  if(F.btnNoGlove) R.wrong.push('试车时没戴手套');
  if(F.saidBad) R.wrong.push('验电喊错 '+F.saidBad+' 次（亮了喊无电，或不亮喊有电）');
  if(EX.seq<6) R.undone.push('试车没做完：做到第 '+EX.seq+' / 6 步（绿 → 黄 → 红 → 黄 → 绿 → 红）');
  if(SIM.qf || EX.main) R.undone.push('开关还合着');
  if(nCon) R.undone.push('还有 '+nCon+' 根外部接线没拆');
  if(!F.repDone) R.undone.push('没有报告「'+REPS.done+'」');
  R.lost = R.ded.reduce(function(a, d){ return a+d[0]; }, 0);
  return R;
}
function exSheet(){
  const R = EX.result = exGrade();
  function ul(a){ return '<ul>'+a.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul>'; }
  const clean = !R.fail.length && !R.ded.length && !R.wrong.length && !R.undone.length;
  let h = '<div class="big '+(R.fail.length ? 'bad' : clean ? 'ok' : '')+'">'+(R.fail.length ? '判不合格' : clean ? '全对，零扣分' : '扣 '+R.lost+' 分'+(R.undone.length ? '，没做完' : ''))+'</div>';
  if(R.fail.length) h += '<div class="sec bad">判不合格（硬条）</div>'+ul(R.fail);
  if(R.ded.length) h += '<div class="sec">扣分</div>'+ul(R.ded.map(function(d){ return '扣 '+d[0]+' 分：'+d[1]; }));
  if(R.wrong.length) h += '<div class="sec">判错（材料没写分值）</div>'+ul(R.wrong);
  if(R.undone.length) h += '<div class="sec">没做完</div>'+ul(R.undone);
  h += '<div class="sec">盘内接线</div>';
  if(R.skipped) h += '<ul><li>跳过了，用的标准接法</li></ul>';
  else if(R.wire){
    const badC = R.wire.checks.filter(function(c){ return c.ok!==true; });
    h += ul([(R.wire.pass ? '<span class="ok">通电检查 11 项全过</span>' : '<span class="bad">通电检查没过 '+badC.length+' 项</span>')+
      (R.wire.bad==='short' ? '；<span class="bad">控制回路短路</span>' : R.wire.bad==='both' ? '；<span class="bad">两只接触器会同时吸合（相间短路）</span>' : R.wire.bad==='buzz' ? '；<span class="bad">接触器来回跳</span>' : '')]
      .concat(badC.map(function(c){ return '✗ '+c.n+'<br><span style="color:var(--mut)">'+c.h+'</span>'; }))
      .concat(R.wire.miss.length ? ['跟你背的那版比，少了：'+R.wire.miss.map(function(w){ return '第 '+w.id+' 根（'+tname(w.from)+' → '+tname(w.to)+'）'; }).join('；')] : [])
      .concat(R.wire.extra.length ? ['多了 / 不一样的：'+R.wire.extra.map(function(w){ return tname(w.from)+' → '+tname(w.to); }).join('；')] : []));
  }
  h += '<div style="color:var(--mut);font-size:12.5px;margin-top:10px">分值只有材料写明的三条：合闸状态接拆线 25、不立牌 10、顺序相反累计 20（我按「有就扣 20」算）。</div>';
  menu('成绩单 · K32 正反转', [['再考一次', function(){ exEnter(); }]], h);
}
/* 下一步该干什么（练习用，点提示那一栏可以关掉）*/
function exNext(){
  if(EX.phase==='wire') return '盘内接线：点两个<b>蓝圈端子</b>接一根线，接错不会提醒。14 根接完点「接线完成」';
  const c = EX.con, nx = function(o, want){ return o.filter(function(i){ return !!c[i]!==want; })[0]; };
  if(EX.seq<6){
    if(!EX.chk.main) return '点试车台的<b>总开关</b> → 确认开关状态（在分闸）';
    if(!EX.chk.qf) return '点盘上的<b>断路器 QF</b> → 确认开关状态（在分闸）';
    if(!EX.chk.sign) return '点<b>标识牌</b> → 确认标识牌位置';
    if(!EX.rep.env) return '点「报告」：周围环境安全，请求接线';
    const n = nx(CON_ORDER, true); if(n) return '接线（先地线，再电机线黄绿红，再电源线黄绿红）：点<b>'+XP[n].name+'</b>';
    if(!EX.rep.wired) return '点「报告」：接线完毕，请求送电';
    if(EX.sign!=='flat' && !EX.main) return '<b>右手</b>把标识牌扣放';
    if(!EX.main) return '<b>右手</b>合试车台总开关（先总闸）';
    if(!SIM.qf) return '<b>右手</b>合盘上开关 QF（再分闸）';
    const n1 = Object.keys(EX.p1).length;
    if(n1<8){ if(EX.glove) return '<b>摘手套</b>，准备验电'; if(!EX.pen) return '点「验电笔」拿在手上';
      return '验电 8 处，还差 '+(8-n1)+' 处：左、右接触器进线端各三相，4、5 号熔断器出线端，每处喊「有电」'; }
    if(EX.pen) return '验完了，点「验电笔」放下';
    if(!EX.glove) return '<b>戴上手套</b>，准备试车';
    return '试车第 '+(EX.seq+1)+' / 6 步：按'+SEQN[EX.seq]+'，每步隔 3 秒';
  }
  if(SIM.qf) return '断电：<b>右手</b>先断盘上开关 QF';
  if(EX.main) return '<b>右手</b>再断试车台总开关';
  if(EX.sign!=='stand') return '随手<b>立牌</b>（右手）';
  const n2 = Object.keys(EX.p2).length, any = Object.keys(c).length;
  if(n2<3 && any===11){ if(EX.glove) return '<b>摘手套</b>，准备二次验电'; if(!EX.pen) return '点「验电笔」拿在手上';
    return '二次验电，还差 '+(3-n2)+' 处：盘上接线排电源端子 L1、L2、L3，每处喊「无电」'; }
  if(EX.pen) return '验完了，点「验电笔」放下';
  const d = nx(DIS_ORDER, false); if(d) return '拆线（红绿黄，地线最后）：点<b>'+XP[d].name+'</b> → 拆下';
  if(!EX.rep.done) return '点「报告」：操作完毕';
  return '点「交卷」看成绩单';
}

/* ══ 声音 / 震动 ══ */
let AC=null, sndOn=true, humNode=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function click(f, dur, vol){
  if(!sndOn || !ac()) return;
  const n=AC.sampleRate*dur|0, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n, 2);
  const s=AC.createBufferSource(), bp=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=buf; bp.type='bandpass'; bp.frequency.value=f; g.gain.value=vol; s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start();
}
function hum(on){
  if(humNode){ const h=humNode; humNode=null; try{ h.g.gain.setTargetAtTime(0, AC.currentTime, 0.15); h.os.forEach(function(o){ o.stop(AC.currentTime+0.8); }); }catch(e){} }
  if(!on || !sndOn || !ac()) return;
  /* 纯音叠在一起像汽笛（11-10 他说像火车鸣笛）。真电动机主要是风扇的呼呼声：噪声过带通，再加一点很轻的 100Hz 电磁嗡 */
  const n=AC.sampleRate*2, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  let b=0; for(let i=0;i<n;i++){ b = b*0.97 + (Math.random()*2-1)*0.25; d[i]=b; }           /* 偏低频的噪声 */
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.6;
  const g=AC.createGain(); g.gain.value=0; g.gain.setTargetAtTime(0.9, AC.currentTime, 0.35);
  const o=AC.createOscillator(), og=AC.createGain(), lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=100; lp.type='lowpass'; lp.frequency.value=420; og.gain.value=0.1;
  src.connect(bp); bp.connect(g); o.connect(lp); lp.connect(og); og.connect(g); g.connect(AC.destination);
  src.start(); o.start(); humNode={g:g, os:[src, o]};
}
function buzz(p){ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
let lastMotor=0;
function drainEvents(){
  SIM.ev.splice(0).forEach(function(e){
    if(e.type==='btn'){ click(3000, 0.03, 0.25); buzz(12); }
    if(e.type==='qf'){ click(1800, 0.05, 0.5); buzz(20); }
    if(e.type==='km'){ click(SIM.km[e.id].on ? 900 : 1300, 0.07, 0.7); buzz(25); }
    if(e.type==='bang'){ click(300, 0.25, 1); buzz([80,40,120]); }
  });
  if(!!SIM.motor !== !!lastMotor) hum(!!SIM.motor);
  lastMotor = SIM.motor;
}

/* ══ 镜头 ══ */
const topH = 44; let botH = 130, W = 1, H = 1;
function fitD(w, h){
  const t = Math.tan(camera.fov/2*Math.PI/180), f = (H-topH-botH)/H;
  return Math.max(h/(2*t*f), w*H/(2*t*W))*1.05;
}
const VIEWS = {
  front:function(){ return {t:V(280,420,20), d:[0,0,1], D:fitD(600,860)}; },
  desk:function(){ return {t:V(300,760,30), d:[0,-0.45,1], D:fitD(600,240)}; },
  km:function(){ return {t:V(237,415,40), d:[0.18,-0.5,1], D:fitD(450,300)}; },
  tb:function(){ return {t:V(480,300,30), d:[-0.5,-0.12,1], D:fitD(300,600)}; }
};
let fly = null;
function view(name, instant){
  const v = VIEWS[name](), dir = new THREE.Vector3(v.d[0], v.d[1], v.d[2]).normalize();
  const to = {p:v.t.clone().add(dir.multiplyScalar(v.D)), t:v.t};
  if(instant){ camera.position.copy(to.p); controls.target.copy(to.t); controls.update(); return; }
  fly = {p0:camera.position.clone(), t0:controls.target.clone(), p1:to.p, t1:to.t, k:0};
}
function resize(){
  W = window.innerWidth; H = window.innerHeight; botH = document.querySelector('.bot').offsetHeight;
  renderer.setSize(W, H, false); camera.aspect = W/H;
  camera.setViewOffset(W, H, 0, (botH-topH)/2, W, H); camera.updateProjectionMatrix();
}

/* ══ 点击 ══ 我的监听要先于 OrbitControls 注册：按住按钮时先把转镜头关掉 */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hit(e){
  ndc.set(e.clientX/W*2-1, -(e.clientY/H*2-1)); ray.setFromCamera(ndc, camera);
  const hs = ray.intersectObjects(picks, false).filter(function(h){ return !h.object.userData.off; });
  if(!hs.length) return null;
  const hard = hs.filter(function(h){ return h.object.userData.act.type!=='wire'; });   /* 按钮/开关优先于线 */
  return (hard[0] && hard[0].distance < hs[0].distance+60 ? hard[0] : hs[0]).object.userData.act;
}
let down = null, held = null;
canvas.addEventListener('pointerdown', function(e){
  ac(); down = {x:e.clientX, y:e.clientY, t:performance.now(), act:hit(e)};
  if(down.act && down.act.type==='btn'){
    held = {id:down.act.id, pid:e.pointerId}; controls.enabled = false;
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    simPress(held.id, true, performance.now()); exBtn(held.id);
  }
});
function up(e){
  if(held && held.pid===e.pointerId){ simPress(held.id, false, performance.now()); held=null; controls.enabled=true; down=null; return; }
  if(!down) return;
  const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y), a = down.act; down = null;
  if(moved>8 || e.type==='pointercancel') return;
  const now = performance.now();
  if(a && a.type==='qf'){ if(EX.on) exTapQF(); else { UI.pend=null; UI.msg=''; simQF(!SIM.qf, now); } }
  else if(a && a.type==='term'){ if(EX.on) exTermTap(a.id); else termTap(a.id); }
  else if((a && (a.type==='main' || a.type==='sign')) && !EX.on) menu('试车台总开关和标识牌是「考场」模式里用的', [['进入考场模式', exEnter]]);
  else if(a && a.type==='main') exTapMain();
  else if(a && a.type==='sign') exTapSign();
  else if(a && a.type==='ex') exTapPoint(a.id);
  else if(a && a.type==='wire' && EX.on){ if(EX.phase==='wire'){ UI.sel = UI.sel===a.id ? 0 : a.id; UI.pend = null; } }
  else if(a && a.type==='fr') simFR(!SIM.frTrip, now);
  else if(a && a.type==='wire'){ UI.sel = UI.sel===a.id && !UI.step ? 0 : a.id; UI.step = false; UI.pend = null; UI.hint = 0; }
  else { UI.sel = 0; UI.step = false; UI.pend = null; }
}
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.minDistance = 160; controls.maxDistance = 5000;
controls.minAzimuthAngle = -1.35; controls.maxAzimuthAngle = 1.35; controls.minPolarAngle = 0.3; controls.maxPolarAngle = 2.85;
controls.zoomSpeed = 1.4;

document.querySelectorAll('.views button').forEach(function(b){ b.onclick = function(){ view(b.dataset.v); }; });
function stepTo(n){ UI.sel = Math.max(1, Math.min(14, n)); UI.step = true; }
document.getElementById('prev').onclick = function(){ stepTo(UI.sel ? UI.sel-1 : 14); };
document.getElementById('next').onclick = function(){ stepTo(UI.sel+1); };
cnt.onclick = function(){ UI.sel = 0; UI.step = false; };
document.getElementById('exam').onclick = function(){ if(EX.on) exExit(); else exEnter(); };
document.getElementById('edel').onclick = function(){ if(UI.sel){ exDelWire(UI.sel); exSave(); EX.msg = '拆掉了'; UI.sel = 0; } };
document.getElementById('edone').onclick = exWireDone;
document.getElementById('epen').onclick = function(){ EX.pen = !EX.pen; EX.msg = EX.pen ? '验电笔拿在手上了：点要验的位置' : '验电笔放下了'; };
document.getElementById('eglove').onclick = function(){ EX.glove = !EX.glove; exLog('glove', {on:EX.glove}); EX.msg = EX.glove ? '戴上了手套' : '摘下了手套'; };
document.getElementById('erep').onclick = function(){
  menu('向考官报告：说哪一句？', ['env','x1','wired','x2','done'].map(function(k){ return ['「'+REPS[k]+'」', function(){ EX.rep[k]=1; exLog('rep', {id:k}); EX.msg = '你报告了：「'+REPS[k]+'」'; }]; }));
};
document.getElementById('esub').onclick = function(){ menu('交卷？', [['交卷，看成绩单', exSheet]]); };
info.onclick = function(){ if(EX.on) EX.guide = !EX.guide; };
ov.onclick = function(e){ if(e.target===ov) closeMenu(); };
document.getElementById('mode').onclick = function(){ setMode(!UI.wire); };
document.getElementById('hint').onclick = function(){
  const w = WIRES.filter(function(w){ return !DONE[w.id]; })[0];
  UI.pend=null; UI.sel=0;
  if(!w){ UI.msg='14 根都接完了，点断路器 QF 合闸试车'; return; }
  UI.hint=w.id; UI.msg='提示 · <b>第 '+w.id+' 根</b>（'+GROUPS[w.group][0]+'）：'+tname(w.from)+' → '+tname(w.to)+'<div class="st">'+GROUPS[w.group][1]+'</div>';
};
document.getElementById('del').onclick = function(){
  if(SIM.qf){ UI.msg='⚠ <b>带电不能拆线</b>：先分闸'; UI.sel=0; return; }
  if(UI.sel && DONE[UI.sel]){ delete DONE[UI.sel]; UI.msg='拆掉了第 '+UI.sel+' 根'; UI.sel=0; applyDone(); }
};
document.getElementById('reset').onclick = function(){
  if(!doneN() || !confirm('把接好的线全部拆掉，重新来？')) return;
  simQF(false, performance.now()); for(const k in DONE) delete DONE[k]; UI.err=0; UI.sel=0; UI.pend=null; UI.hint=0; UI.msg=''; applyDone();
};
document.getElementById('snd').onclick = function(){ sndOn = !sndOn; this.textContent = sndOn ? '🔊' : '🔇'; if(!sndOn) hum(false); else if(SIM.motor) hum(true); };
window.addEventListener('resize', function(){ resize(); });

/* ══ 循环 ══ */
let tPrev = performance.now(), omega = 0;
function ease(o, target, dt){ o.v += (target-o.v)*Math.min(1, dt*22); }
function frame(now){
  const dt = Math.min(0.1, (now-tPrev)/1000); tPrev = now;
  simAdvance(now); drainEvents();
  for(const id in ANIM.btn){ const o=ANIM.btn[id]; ease(o, SIM.btn[id].pressed ? 1 : 0, dt); o.mesh.position.z = o.z0 - o.v*7; }
  for(const id in ANIM.km){ const o=ANIM.km[id]; ease(o, SIM.km[id].on ? 1 : 0, dt); o.mesh.position.z = o.z0 - o.v*8; }
  ease(ANIM.fr, SIM.frTrip ? 1 : 0, dt); ANIM.fr.mesh.position.z = ANIM.fr.z0 + ANIM.fr.v*6;      /* 脱扣：红钮弹出来 */
  const qa = SIM.qf ? -0.5 : 0.5; ANIM.qf.rotation.x += (qa-ANIM.qf.rotation.x)*Math.min(1, dt*20);
  { const ma = EX.on && EX.main ? -0.5 : 0.5; ANIM.main.rotation.x += (ma-ANIM.main.rotation.x)*Math.min(1, dt*20);
    const sa = !EX.on || EX.sign==='stand' ? 1.0 : 0; ANIM.sign.g.rotation.x += (sa-ANIM.sign.g.rotation.x)*Math.min(1, dt*14); }
  omega += (SIM.motor*14-omega)*Math.min(1, dt*1.8); fan.rotation.z -= omega*dt;
  if(fly){ fly.k = Math.min(1, fly.k+dt/0.45); const k = fly.k*fly.k*(3-2*fly.k);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if(fly.k>=1) fly=null; }
  controls.update();
  const near = H/(2*camera.position.distanceTo(controls.target)*Math.tan(camera.fov/2*Math.PI/180)) > 0.66;   /* 每个板面单位占多少像素 */
  if(near!==UI.near){ UI.near = near; SMALL.forEach(function(m){ m.visible = near; }); }
  const s = sig(); if(s!==UI.sig){ UI.sig = s; refresh(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize(); view(VIEWS[Q.get('v')] ? Q.get('v') : 'front', true);
if(Q.get('sel')) stepTo(+Q.get('sel'));
if(Q.has('wire')) setMode(true);
if(Q.has('exam')) exEnter();
if(Q.get('run')){ simQF(true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), false, performance.now()); }, 600); }, 300); }
window.K3 = {SIM:SIM, UI:UI, EX:EX, view:view, press:function(id, d){ simPress(id, d, performance.now()); }, qf:function(on){ simQF(on, performance.now()); }};
refresh(); requestAnimationFrame(frame);
</script>
