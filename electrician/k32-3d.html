const SPEC = {
  src:['fu4-out','fu5-out'],
  coils:[{id:'km1',a:'km1-a1',b:'km1-a2',name:'KM1'},{id:'km2',a:'km2-a1',b:'km2-a2',name:'KM2'}],
  contacts:[

function setActive(a){ ACTIVE = a; }
const SW_DELAY=260, PICK=150, DROP=150, MIN_PRESS=SW_DELAY+PICK+80, STEP=10;
const SIM = {qf:false, frTrip:false, frSet:2, fu:{}, blown:'', motor:0, phaseLoss:false, btn:{}, km:{}, tLast:0, last:null, ev:[], sup:true, noMotor:false};   /* sup：考场里试车台没送电时 QF 上口是空的 */
function simReset(){

  SIM.fu = {'fu1-0':true, 'fu1-1':true, 'fu1-2':true, 'fu4-0':true, 'fu5-0':true};   /* 熔断器盒合着＝true，翻开＝那一相断 */

  const k=SIM.km[c.by]; if(k) return c.no ? (k.on||k.man) : !(k.on||k.man);

/* 电源边所在的双连通分量 = 这一刻真有电流的边（死支路带电但没电流，不算） */
function srcBlock(E){
  const adj={};
  E.forEach(function(e){ (adj[e.a]=adj[e.a]||[]).push([e,e.b]); (adj[e.b]=adj[e.b]||[]).push([e,e.a]); });
  const disc={}, low={}, stk=[]; let t=0, found=null;
  function dfs(u,pid){
    disc[u]=low[u]=++t;
    (adj[u]||[]).forEach(function(pr){
      const e=pr[0], v=pr[1];
      if(e.id===pid) return;
      if(disc[v]===undefined){
        stk.push(e); dfs(v,e.id); low[u]=Math.min(low[u],low[v]);
        if(low[v]>=disc[u]){ const comp=[]; let x; do{ x=stk.pop(); comp.push(x); }while(x!==e);
          if(!found && comp.some(function(y){ return y.k==='s'; })) found=comp; }
      } else if(disc[v]<disc[u]){ stk.push(e); low[u]=Math.min(low[u],disc[v]); }
    });
  }
  const s=E.filter(function(e){ return e.k==='s'; })[0];
  if(s) dfs(s.a,null);
  return found||[];

function solveNet(ws, closedFn){
  const res={coil:{}, cur:{}, pot:{}, short:false};
  SPEC.coils.forEach(function(c){ res.coil[c.id]=false; });
  const E=[];
  ws.forEach(function(w){ E.push({id:'w'+w.id,a:w.from,b:w.to,k:'w'}); });
  SPEC.contacts.forEach(function(c,i){ if(closedFn(c)) E.push({id:'c'+i,a:c.a,b:c.b,k:'c'}); });
  const P={};
  function fd(x){ if(P[x]===undefined) P[x]=x; while(P[x]!==x){ P[x]=P[P[x]]; x=P[x]; } return x; }
  E.forEach(function(e){ P[fd(e.a)]=fd(e.b); });
  const s0=fd(SPEC.src[0]), s1=fd(SPEC.src[1]);
  ws.forEach(function(w){ const r=fd(w.from); res.pot['w'+w.id]= r===s0 ? 1 : (r===s1 ? 2 : 0); });
  if(s0===s1){ res.short=true; return res; }      /* 不经过线圈就把 L1、L2 连上了＝控制回路短路 */
  SPEC.coils.forEach(function(c){ E.push({id:'k'+c.id,a:c.a,b:c.b,k:'k',coil:c}); });
  E.push({id:'src',a:SPEC.src[0],b:SPEC.src[1],k:'s'});
  const blk = srcBlock(E);
  blk.forEach(function(e){ res.cur[e.id]=true; if(e.k==='k') res.coil[e.coil.id]=true; });
  /* 电位：把整张网（线、闭合的触点、全部线圈）当电阻网络解一遍：线/触点 1Ω，线圈 1000Ω，L1=1、L2=0。
     用途两个：①光点方向（电流从电位高往低走，并联的自锁支路也判得对）；
     ②外皮颜色（带电＝跟 L1 或 L2 连着，哪怕中间隔着一个没电流的线圈，验电笔照样亮；悬空的才算不带电） */
  const EV = E.filter(function(e){ return e.k!=='s'; });
  const Q = {}; function fq(x){ if(Q[x]===undefined) Q[x]=x; while(Q[x]!==x){ Q[x]=Q[Q[x]]; x=Q[x]; } return x; }
  EV.forEach(function(e){ Q[fq(e.a)] = fq(e.b); });
  const live = fq(SPEC.src[0]);
  const ns = [], ix = {}; EV.forEach(function(e){ [e.a, e.b].forEach(function(n){ if(ix[n]===undefined && fq(n)===live){ ix[n]=ns.length; ns.push(n); } }); });
  const N = ns.length, A = [], B = new Array(N).fill(0), isSrc = function(n){ return n===SPEC.src[0] || n===SPEC.src[1]; };
  for(let i=0;i<N;i++) A.push(new Array(N).fill(0));
  ns.forEach(function(n, i){ if(isSrc(n)){ A[i][i] = 1; B[i] = n===SPEC.src[0] ? 1 : 0; } });
  EV.forEach(function(e){ const i = ix[e.a], j = ix[e.b]; if(i===undefined || j===undefined) return; const g = e.k==='k' ? 0.001 : 1;
    if(!isSrc(ns[i])){ A[i][i] += g; A[i][j] -= g; }
    if(!isSrc(ns[j])){ A[j][j] += g; A[j][i] -= g; } });
  for(let c=0;c<N;c++){                                   /* 高斯消元（节点就二三十个） */
    let pv = c; for(let r=c+1;r<N;r++) if(Math.abs(A[r][c])>Math.abs(A[pv][c])) pv = r;
    [A[c], A[pv]] = [A[pv], A[c]]; [B[c], B[pv]] = [B[pv], B[c]];

/* 考场里接的「标准接法之外」的线：自动排直角走线，不再两点拉斜线穿过元件（11-26 他发现 KM1-21→KM2-13 从 KM1 底下钻过去）。
   1) 从端子朝最近的元件边出头；2) 试「先竖后横」「先横后竖」和经过元件旁空道的三段走法；3) 取不压任何元件、最短的那条。
   每根线按编号错开几个单位，几根错线不叠成一根 */
function autoRoute(a, b, id){
  const A = TPOS[a], B = TPOS[b], off = 10 + (id % 5)*3, lane = (id % 6)*3;
  const R = DEVICES.map(function(d){ return [d.x, d.y, d.x+(d.W||d.w), d.y+(d.H||d.h)]; });
  function out(T){                                                     /* 朝最近的那条边出头 */
    const d = dev(T.device), x0 = d.x, y0 = d.y, x1 = d.x+(d.W||d.w), y1 = d.y+(d.H||d.h);
    const e = [[T.x-x0, -1, 0], [x1-T.x, 1, 0], [T.y-y0, 0, -1], [y1-T.y, 0, 1]].sort(function(p, q){ return p[0]-q[0]; })[0];
    const inside = function(p){ return R.some(function(r){ return p[0]>r[0] && p[0]<r[2] && p[1]>r[1] && p[1]<r[3]; }); };
    for(const o of [off, 10, 7, 5, 3]){ const p = e[1] ? [e[1]<0 ? x0-o : x1+o, T.y] : [T.x, e[2]<0 ? y0-o : y1+o]; if(!inside(p)) return p; }
    return e[1] ? [e[1]<0 ? x0-3 : x1+3, T.y] : [T.x, e[2]<0 ? y0-3 : y1+3];
  }
  function clear(p, q){                                                /* 一段直线不压任何元件（元件框往里缩 1） */
    const mx = Math.min(p[0], q[0]), Mx = Math.max(p[0], q[0]), my = Math.min(p[1], q[1]), My = Math.max(p[1], q[1]);
    return R.every(function(r){ return Mx <= r[0]+1 || mx >= r[2]-1 || My <= r[1]+1 || my >= r[3]-1; });
  }
  function ok(path){ for(let i=0;i<path.length-1;i++) if(!clear(path[i], path[i+1])) return false; return true; }
  function len(path){ let s = 0; for(let i=0;i<path.length-1;i++) s += Math.abs(path[i][0]-path[i+1][0]) + Math.abs(path[i][1]-path[i+1][1]); return s; }
  const pa = out(A), pb = out(B), C = [[pa[0], pb[1]], [pb[0], pa[1]]];
  const cand = [[pa, C[0], pb], [pa, C[1], pb]];
  const xs = [], ys = [];
  R.forEach(function(r){ xs.push(r[0]-8-lane, r[2]+8+lane); ys.push(r[1]-8-lane, r[3]+8+lane); });
  xs.forEach(function(x){ cand.push([pa, [x, pa[1]], [x, pb[1]], pb]); });
  ys.forEach(function(y){ cand.push([pa, [pa[0], y], [pb[0], y], pb]); });
  xs.forEach(function(x){ ys.forEach(function(y){ cand.push([pa, [pa[0], y], [x, y], [x, pb[1]], pb]); cand.push([pa, [x, pa[1]], [x, y], [pb[0], y], pb]); }); });
  let best = null, bl = 1e9;
  cand.forEach(function(c){ if(ok(c)){ const l = len(c); if(l < bl){ bl = l; best = c; } } });
  if(!best) best = [pa, C[0], pb];                                     /* 实在找不到就退回先竖后横 */
  return [[A.x, A.y]].concat(best, [[B.x, B.y]]);
}
/* ── 对照：把考场里接的线叠在标准答案上（11-26 他说看答案时不知道自己哪里接错）──
   接对的＝正常颜色；漏接的＝半透明影子；接错/多接的＝橙色（标准里没有）。数据来自考场存档 LSX */
function revEnter(){
  let ws = []; try{ ws = JSON.parse(localStorage.getItem(LSX)||'[]')||[]; }catch(e){}
  ws = ws.filter(function(p){ return TPOS[p[0]] && TPOS[p[1]]; });
  if(!ws.length){ note('还没有考场盘内接线的记录：先进「考场」接一遍，再来对照'); return; }
  if(UI.wire) setMode(false);
  const key = function(a, b){ return [a, b].sort().join('|'); }, std = {};
  WIRES.forEach(function(w){ std[key(w.from, w.to)] = w.id; });
  const has = {}, extras = [];
  ws.forEach(function(p){ const k = key(p[0], p[1]); if(std[k]) has[std[k]] = 1; else extras.push({from:p[0], to:p[1]}); });
  extras.forEach(function(w, i){ const A = TPOS[w.from], B = TPOS[w.to];
    const pts = path3(autoRoute(w.from, w.to, 200+i), TZ[w.from]+4, TZ[w.to]+4, 100+(i%8)*3, dev(A.device), dev(B.device));
    w.mesh = tube(pts, 2.6, M(0xff7a00, {roughness:0.4, emissive:0xff7a00, emissiveIntensity:0.35}));
    w.pick = tube(pts, 9, new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false})); w.pick.castShadow = false;
    w.pick.userData.act = {type:'wire', id:'rx'+i}; picks.push(w.pick); });
  UI.rev = {has:has, extras:extras, miss:WIRES.filter(function(w){ return !has[w.id]; }), k:0, note:''};
  UI.sel = 0; UI.step = false; UI.hint = 0; simQF(false, performance.now());
}
function revExit(){
  if(!UI.rev) return;
  UI.rev.extras.forEach(function(w){ root.remove(w.mesh); root.remove(w.pick); const i = picks.indexOf(w.pick); if(i>=0) picks.splice(i, 1); });
  UI.rev = null;
}

}

function exAddWire(a, b){
  const std = WIRES.filter(function(w){ return (w.from===a && w.to===b) || (w.from===b && w.to===a); })[0];
  const w = std ? {id:std.id, from:std.from, to:std.to} : {id:EX.nextId++, from:a, to:b};
  EX.wires.push(w); if(std) EX.has[std.id] = 1;
  if(!std){
    const A=TPOS[a], B=TPOS[b];
    const pts = path3(autoRoute(a, b, w.id), TZ[a]+4, TZ[b]+4, 100+(w.id%8)*3, dev(A.device), dev(B.device));
    const mat = M(0x22262b, {roughness:0.45, emissive:0x000000, transparent:true});
    const mesh = tube(pts, 2.3, mat); ferrule(mesh, pts[0], pts[1]); ferrule(mesh, pts[pts.length-1], pts[pts.length-2]);
    const pick = tube(pts, 9, new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
    pick.castShadow = false; pick.userData.act = {type:'wire', id:w.id}; picks.push(pick);
    XW.push({w:w, mesh:mesh, mat:mat, pick:pick, ends:[pts[0], pts[pts.length-1]], x:true});
  }
  setActive(EX.wires.slice()); return w;
}
function exDelWire(id){

  if(i>=0){ const c = XW.splice(i, 1)[0]; root.remove(c.mesh); root.remove(c.pick); c.mesh.geometry.dispose(); c.pick.geometry.dispose(); picks.splice(picks.indexOf(c.pick), 1); }
  setActive(EX.wires.slice());
}

function repJudge(text){
  const t = String(text).toUpperCase().replace(/[\s，。,.！!？?、：:；;“”"'「」]/g, '');
  let id = null;
  if(CFG.amp && /电流/.test(t)) id = 'amp';
  else if(/操作完毕|操作完了|操作结束|操作完成/.test(t)) id = 'done';
  else if(/接线完|接完线|请求送电/.test(t)) id = 'wired';
  else if(/环境安全|请求接线/.test(t)) id = 'env';
  if(!id) return {id:null, ok:false, why:'听不出是哪一句'};
  const why = [];
  if(id==='amp'){
    ['A','B','C'].forEach(function(p){ if(t.indexOf(p+'相')<0) why.push('少了「'+p+'相电流正常」'); });
    if(!/平衡/.test(t)) why.push('最后要说「三相电流平衡」');
    return {id:id, ok:!why.length, why:why.join('；')};
  }
  if(!/报告|考官/.test(t)) why.push('开头少了「报告考官」');
  if(id==='env'){
    const other = Object.keys(ENVW).filter(function(w){ return w!==CFG.env && t.indexOf(w)>=0; })[0];
    if(other) why.push('说成了「'+other+'」：'+CFG.code+' 是「'+CFG.env+'环境安全」（「'+other+'」是 '+ENVW[other]+'）');
    else if(t.indexOf(CFG.env)<0) why.push('要说「'+CFG.env+'环境安全」');
    if(!/请求接线/.test(t)) why.push('后面要说「请求接线」');
  }
  if(id==='wired'){
    if(!/接线完/.test(t)) why.push('要说「接线完毕」');
    if(!/请求送电/.test(t)) why.push('后面要说「请求送电'+(CFG.wiredTry ? '试车' : '')+'」');

    else if(!CFG.wiredTry && /试车/.test(t)) why.push(CFG.code+' 是「请求送电」，不带「试车」（带「试车」的是 K31/K34）');

let AC=null, sndOn=true, humNode=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function click(f, dur, vol){
  if(!sndOn || !ac()) return;
  const n=AC.sampleRate*dur|0, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n, 2);
  const s=AC.createBufferSource(), bp=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=buf; bp.type='bandpass'; bp.frequency.value=f; g.gain.value=vol; s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start();
}
function hum(on){
  if(humNode){ const h=humNode; humNode=null; try{ h.g.gain.setTargetAtTime(0, AC.currentTime, 0.15); h.os.forEach(function(o){ o.stop(AC.currentTime+0.8); }); }catch(e){} }
  if(!on || !sndOn || !ac()) return;
  /* 纯音叠在一起像汽笛（11-10 他说像火车鸣笛）。真电动机主要是风扇的呼呼声：噪声过带通，再加一点很轻的 100Hz 电磁嗡 */
  const n=AC.sampleRate*2, buf=AC.createBuffer(1, n, AC.sampleRate), d=buf.getChannelData(0);
  let b=0; for(let i=0;i<n;i++){ b = b*0.97 + (Math.random()*2-1)*0.25; d[i]=b; }           /* 偏低频的噪声 */
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.6;
  const g=AC.createGain(); g.gain.value=0; g.gain.setTargetAtTime(0.9, AC.currentTime, 0.35);
  const o=AC.createOscillator(), og=AC.createGain(), lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=100; lp.type='lowpass'; lp.frequency.value=420; og.gain.value=0.1;
  src.connect(bp); bp.connect(g); o.connect(lp); lp.connect(og); og.connect(g); g.connect(AC.destination);
  src.start(); o.start(); humNode={g:g, os:[src, o]};
}

  if(!hs.length) return null;

function camUI(){

  ANIM.frReset.v = Math.max(0, ANIM.frReset.v - dt*5); ANIM.frReset.mesh.position.z = ANIM.frReset.z0 - ANIM.frReset.v*4;
  ANIM.frDial.rotation.z += (frDialAng(FR_SET.indexOf(SIM.frSet)) - ANIM.frDial.rotation.z)*Math.min(1, dt*12);
  for(const id in ANIM.fu){ const o = ANIM.fu[id]; o.v += ((SIM.fu[id] ? 0 : 1) - o.v)*Math.min(1, dt*10); o.pv.rotation.x = o.v*0.75; }
  const qa = SIM.qf ? -0.5 : 0.5; ANIM.qf.rotation.x += (qa-ANIM.qf.rotation.x)*Math.min(1, dt*20);
  { const ma = EX.on && EX.main ? -0.5 : 0.5; ANIM.main.rotation.x += (ma-ANIM.main.rotation.x)*Math.min(1, dt*20);
    const sa = !EX.on || EX.sign==='stand' ? 1.0 : 0; ANIM.sign.g.rotation.x += (sa-ANIM.sign.g.rotation.x)*Math.min(1, dt*14); }
  omega += (SIM.motor*14-omega)*Math.min(1, dt*1.8); fan.rotation.z -= omega*dt;
  if(fly){ fly.k = Math.min(1, fly.k+dt/0.45); const k = fly.k*fly.k*(3-2*fly.k);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if(fly.k>=1) fly=null; }
  controls.update(); if(!fly) camUI(); drawDots(now);
  const near = H/(2*camera.position.distanceTo(controls.target)*Math.tan(camera.fov/2*Math.PI/180)) > 0.66;   /* 每个板面单位占多少像素 */
  if(near!==UI.near){ UI.near = near; SMALL.forEach(function(m){ m.visible = near; }); }
  const s = sig()+(UI.rev ? '|rev'+UI.rev.k : ''); if(s!==UI.sig){ UI.sig = s; refresh(); hlApply(); }
  hlFrame(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
flushScrews();
/* 全景按「实际有东西的范围」装满屏幕（11-26 他嫌板子四周空地占地方）：看得见的零件外框 + 一点边；考场才出现的外部电源线不算 */
let CONTENT = null;
(function(){
  /* 只按元件外框 + 电动机 + 试车台算；伸到板边的进线、按钮盒出厂线不算（裁掉一点点不影响看） */
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  function add(a, b, c, d){ x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); }
  DEVICES.forEach(function(d){ add(d.x, d.y, d.x+d.W, d.y+d.H); });
  if(MOT.y > 0) add(MOT.x-60, MOT.y-60, MOT.x+100, MOT.y+56);
  const bb = new THREE.Box3(), tmp = new THREE.Box3(); EXG.updateMatrixWorld(true);
  EXG.traverse(function(o){ if(!o.isMesh || !o.visible || (o.material && o.material.opacity===0)) return;
    for(let p=o; p && p!==EXG; p=p.parent) if(!p.visible) return; tmp.setFromObject(o); if(isFinite(tmp.min.x)) bb.union(tmp); });
  if(!bb.isEmpty()) add(bb.min.x+BW/2, BH/2-bb.max.y, bb.max.x+BW/2, BH/2-bb.min.y);
  const m = 14;
  CONTENT = {x:(x0+x1)/2, y:(y0+y1)/2, w:x1-x0+2*m, h:y1-y0+2*m};
})();
resize(); stretchBoard(); view(VIEWS[Q.get('v')] ? Q.get('v') : 'front', true);
if(Q.get('sel')) stepTo(+Q.get('sel'));
if(Q.has('wire')) setMode(true);
if(Q.has('exam')) exEnter();
if(Q.get('run')){ simQF(true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), true, performance.now()); setTimeout(function(){ simPress(Q.get('run'), false, performance.now()); }, 600); }, 300); }
window.K3 = {SIM:SIM, UI:UI, EX:EX, view:view, press:function(id, d){ simPress(id, d, performance.now()); }, qf:function(on){ simQF(on, performance.now()); }};
refresh(); requestAnimationFrame(frame);
</script>
